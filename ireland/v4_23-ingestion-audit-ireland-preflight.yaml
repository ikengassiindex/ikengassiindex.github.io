convention_78_4bis_5_layer_3_geofence:
  status: NOT_REQUIRED
  rationale: >
    Ireland has SINGLE national DSO (ESB Networks) covering ALL 26
    Republic of Ireland counties. Analogous to Greek DEDDIE
    simplification (Wave 3 P22 precedent). Voltage-class × single-DSO
    resolver handles all distribution attribution cleanly:
    - ≥110 kV → EirGrid TSO
    - <110 kV → ESB Networks DSO
