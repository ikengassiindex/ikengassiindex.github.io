  licence: ODbL (Open Database License) — attribution required
  endpoint_primary: https://overpass-api.de/api/interpreter
  endpoint_fallback: https://overpass.kumi.systems/api/interpreter
  endpoint_second_fallback: https://overpass.private.coffee/api/interpreter
  expected_query_scope: >
    3 element-type queries for substations (way + node + relation) + 1
    combined query for lines (power=line + cable + minor_line). Area
    header: area["ISO3166-1"="IE"]->.ie
  expected_yield:
    substations_way: 700-1800                 # Moderate OSM density (western European contributor cohort)
    substations_node: 300-800
    substations_relation: 5-20
    lines: 2500-6000                          # Ireland transmission density moderate
    line_ratio_pre_merge: 3.0-4.5             # Ireland moderate transmission density
    total_raw_bytes: ~8-20 MB                 # Smaller than Switzerland (~15-40 MB) but larger than Iceland
  expected_scale_context: >
    Ireland is FOURTH Wave 3 cohort at 994 baseline subs. Expected
    2-4× substation growth to ~1,900-3,900 net-new. Line densification
    expected MODERATE (baseline 1800 lines is closer to expected
    Central European density than Swiss 625 undercount — expected
    ~2-3× line growth to ~4,000-6,000). Western European OSM
    contributor density is MODERATE (higher than Nordic/Mediterranean
    but lower than Central European) — 504 gateway timeouts less
    likely than Iceland/Greek Nordic-Arctic/Mediterranean sparsity
    but possible on line-query. Convention #56 partial-fetch
    preservation ready.

# ── Grid architecture — EirGrid TSO + ESB Networks single national DSO ──

grid_architecture:
  tso_transmission:
    operator_id: EIRGRID
    operator_names_aliases:
      - "EirGrid"                             # English primary
      - "EirGrid plc"                          # With legal form
      - "EirGrid Plc"                          # Capitalisation variant
      - "EirGrid Group"                        # Alternative naming
      - "EIRGRID"                              # Uppercase
      - "Éirid"                                # Gaeilge (Irish) name
      - "Eirgrid"                              # Camelcase-less variant
    voltage_thresholds:
      backbone_kv: 400                          # 5 subs at 400 kV (Moyle + EWIC interconnector + spine)
      high_voltage_kv: 275                      # 2 subs at 275 kV
      subtransmission_kv: 220                   # 51 subs at 220 kV
      distribution_boundary_kv: 110             # 261 subs at 110 kV (mixed TSO/DSO tier)
    tso_threshold_rule: "≥110 kV → EIRGRID"    # Ireland's 110 kV is architecturally TSO
      # Ireland 110 kV is MAIN transmission tier (like Greek 66 kV subtransmission)
    established: 2006                           # EU 3rd Package unbundling from ESB Group
    unbundling_completed: 2008                  # Full asset transfer
    grid_synchronous: TRUE                      # UCTE/Continental Europe synchronous area (via SEM/I-SEM)
    grid_frequency_hz: 50
    cross_border_interconnectors: 3             # Moyle (HVDC-500MW) + East-West (HVDC-500MW) + N.I. AC land
    note: >
      EirGrid is state-owned Irish TSO. Sister TSO SONI (System
      Operator for Northern Ireland) coordinates via I-SEM (Integrated
      Single Electricity Market) with Republic of Ireland. Cross-border
      interconnectors: Moyle HVDC 500 MW (undersea to Scotland/GB) +
      East-West HVDC 500 MW (undersea to Wales/GB) + AC land border
      with Northern Ireland. Post-Brexit unique cohort position: EU
      member Republic of Ireland coordinating with GB/UK (non-EU)
      via SEM/I-SEM cross-border pathway.

  dso_distribution:
    architectural_note: >
      Ireland has SINGLE national DSO (ESB Networks) covering ALL 26
      Republic of Ireland counties. Analogous to Greek DEDDIE
      simplification. NO Convention #78 §4bis.5 Layer 3 geofence
      needed — voltage-class × single-DSO resolver handles all
      distribution attribution cleanly. Dublin metropolitan area does
      NOT require carve-out (ESB Networks covers Dublin as part of
      unified national grid).

    esb_networks:
      operator_id: ESB_NETWORKS
      operator_names_aliases:
        - "ESB Networks"                        # English primary
        - "ESB Networks DAC"                    # With Designated Activity Company legal form
        - "ESB Networks Ltd"                    # Alternative Ltd variant
        - "ESB Networks Limited"
        - "ESB"                                 # Ambiguous parent
        - "ESB Group"                           # Parent Electricity Supply Board
        - "Electricity Supply Board"            # English full name
        - "Bord Solátbhair Leictreachais"       # Gaeilge (Irish) full name
        - "Bord Solathair Leictreachais"        # ASCII transliteration
      territory: >
        All 26 counties of Republic of Ireland (national single DSO)
      share_estimated: ~100%                    # SINGLE national DSO
      predecessor: ESB Distribution — pre-2010 rebrand to ESB Networks
      voltage_range: 110 kV + MV (38/20/10 kV) + LV (0.4 kV)
      customer_base: ~2.3M electricity customers

  private_captives_estimated:
    - "Iarnród Éireann (Irish Rail — DART electric traction 25 kV AC + 1.5 kV DC)"
    - "Dublin Airport (industrial captive — Dublin Airport Authority DAA)"
    - "Intel Ireland (semiconductor fab industrial captive — Leixlip)"
    - "Google Ireland Data Centres (Dublin)"
    - "Microsoft Ireland Data Centres (Dublin)"
    - "Amazon Web Services Ireland Data Centres"
    - "Facebook/Meta Ireland Data Centres"
    - "Aughinish Alumina (industrial captive — Limerick alumina refinery)"
    - "Bord na Móna (state peat harvesting — Midlands)"
    - "Moneypoint Coal Plant (decommissioning 2025 — Clare county)"

  grid_topology_notes:
    single_national_dso: TRUE                   # Greek-precedent simplification
    post_brexit_unique: TRUE                    # EU member coordinating with GB non-EU via SEM/I-SEM
    cross_border_hvdc_undersea: TRUE            # Moyle + East-West interconnectors
    coal_phase_out_underway: TRUE               # Moneypoint 915 MW closure 2025
    just_transition_fund_eligible: TRUE         # EU JTF €68M Midlands region
    renewable_generation_growth: HIGH           # 40% wind share 2023 (top-3 EU); target 80% by 2030
    hydro_generation_share_pct: ~2              # Ardnacrusha + Erne + Turlough Hill pumped storage
    wind_generation_share_pct: ~40              # LARGEST western European wind share
    thermal_share_pct: ~40                      # Natural gas + coal (declining)

