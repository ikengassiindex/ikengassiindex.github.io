    NO metropolitan carve-out needed (Dublin is part of unified national
    grid). Convention #78 §4bis.5 cumulative enforcement count stays at
    4 (Prague CZ + Warsaw PL + EWZ Zürich + SIG Geneva).
  cumulative_enforcement_count_post_ireland: 4    # Unchanged
  ireland_single_dso_confirmation: >
    Single national DSO ESB Networks empirically simplifies architecture
    to Greek P22-style voltage-class × single-DSO resolver. Simplest
    Wave 3 cohort onboarding since Greek P22.

