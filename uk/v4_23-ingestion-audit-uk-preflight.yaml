# ---------------------------------------------------------------
wave_4_architecture_requirements:
  merger_schema_target: canonical_compact_s_l_a_dict_matches_all_38_other_countries
  osm_overpass_query_hints:
    substations: out center  # returns way centroid inline
    lines: out geom          # returns polyline inline
  merger_operations_required:
    - substation_id_assignment  # integer 10-digit format matching UK convention 5000000000+
    - line_id_assignment        # integer 30000000+ format matching UK convention
    - polyline_conversion_to_compact_p_array  # [[lon, lat], ...] format
    - line_endpoint_ss_se_matching  # string IDs matching UK convention (quoted)
    - adjacency_graph_construction  # optional; UK baseline has empty a dict
  ss_se_type: string  # UK convention (Finland used int); match target schema
  do_not_reuse_turkey_merger_pattern: true  # Turkey merger produced empty GeoJSON features

