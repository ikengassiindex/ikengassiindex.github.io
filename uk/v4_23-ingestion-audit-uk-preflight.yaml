  rationale_summary: |
    Post-Brexit 2020 non-ENTSO-E synchronous + 7 subsea HVDC/AC
    interconnectors (IFA + IFA2 + BritNed + Nemo Link + North Sea Link
    + ElecLink + Viking Link) + Greenlink 2024 landing + Northern
