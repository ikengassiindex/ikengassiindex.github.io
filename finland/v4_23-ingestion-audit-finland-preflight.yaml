# ---------------------------------------------------------------
# Convention #78 §4bis.5 Layer 3 geofence assessment
# ---------------------------------------------------------------
layer_3_geofence:
  enforcement_needed: true  # 7TH COHORT-WIDE ENFORCEMENT EXPECTED
  rationale: |
    Uusimaa region (788 subs — LARGEST region) contains 3 metropolitan
    DSOs: Helen Sähköverkko (Helsinki city) + Vantaan Energia
    (Vantaa northern suburb) + Caruna (Uusimaa outside metros).
    Requires metropolitan geofence to disambiguate Helsinki CBD
    from Vantaa suburb from surrounding Caruna region.

    Cumulative Convention #78 §4bis.5 enforcement expected to grow
    to 7:
    - Prague CZ (Czechia P20)
    - Warsaw PL (Poland P21)
    - EWZ Zurich CH (Switzerland P24)
    - SIG Geneva CH (Switzerland P24)
    - Auckland NZ (New Zealand P27)
    - Copenhagen DK (Denmark P28 — 6TH; HIGHEST hits 615)
    - NEW: Helsinki FI (Finland P29 — 7TH)
  proposed_enforcement:
    helsinki_helen_geofence:
      lat_min: 60.15
      lat_max: 60.28
      lon_min: 24.85
      lon_max: 25.20
      attribution: Helen Sähköverkko
      note: Helsinki city core (~40 km²)
    vantaan_geofence:
      condition: lat > 60.28 AND lat <= 60.40 AND lon 24.85-25.20
      attribution: Vantaan Energia Sähköverkot
      note: Vantaa northern suburb

# ---------------------------------------------------------------
# Discipline #36 cross-border filter (EXISTING FI ENTRY)
# ---------------------------------------------------------------
discipline_36:
  boundary_tolerance_km: 5.0  # Baltic archipelago + Bothnian coastline precedent
  existing_tolerance_source: cross_border_tolerances.json
  cross_border_interconnectors:
    - EstLink 1 HVDC (350 MW) — Anttila FI ↔ Harku EE 2007
    - EstLink 2 HVDC (650 MW) — Anttila FI ↔ Püssi EE 2014
    - FennoSkan 1 HVDC (400 MW) — Rauma FI ↔ Dannebo SE 1989
    - FennoSkan 2 HVDC (800 MW) — Rauma FI ↔ Finnböle SE 2011
    - AC synchronous ties with Sweden (multiple 400+220 kV lines)
    - AC synchronous ties with Norway (limited)
    - NO Russian border (post-2022 disconnect via RAO Nordic dissolution)
  aland_islands_swedish_hvdc: preserved  # via Sweden Björkö-Åland HVAC
  expected_pre_filter_drift_pct: 0.5

# ---------------------------------------------------------------
# Discipline #41 line parity target
# ---------------------------------------------------------------
discipline_41:
  target_ratio_range: [1.5, 5.0]  # Healthy band
  baseline_line_count: null  # to be captured from grid-geo.json at Step 4
  projection: |
    Finland transmission grid: ~14,600 km Fingrid 110/220/400 kV
    Finland distribution grid: ~370,000 km MV/LV across ~80 DSOs
    Baseline captures 110 kV Fingrid backbone heavily (3,760 subs);
    OSM captures Fingrid + DSO. Expected line-substation ratio
    HEALTHY (2-8×) or possibly NEAR-UNITY like Denmark
    (Nordic OSM community MV/LV cluster-tagging pattern).

