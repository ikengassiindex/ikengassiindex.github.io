# Convention #56 hazard baselines (Phase 4c prep)
# ---------------------------------------------------------------
convention_56_hazard_baselines:
  flood: 0.35        # MOD-LOW — spring snowmelt (Kokemäenjoki + Vantaa) + Baltic coastal
  wildfire: 0.35     # MOD — boreal forest (2018 summer + 2021 Lappi peatland)
  winter: 0.65      # HIGH — Arctic Circle + snow load + ice/rime + polar night wind stress
  adapt: 0.80       # HIGH — Climate Act 2015 statutory carbon neutrality 2035 (2nd Nordic after Denmark)
  compound: 0.45     # MOD — winter storm + snow load compounds
  just: 0.50         # MOD — peat phaseout 2030 + coal transition Vaasa/Helsinki + Just Transition Fund €165M
  sources:
    - JRC EU-Flood-Atlas (Kokemäenjoki + Bothnian coast)
    - Copernicus wildfire monitoring
    - ECMWF ERA5 winter storm + snow load climatology
    - ND-GAIN adaptation index (Finland rank ~7/181)
    - IPCC AR6 Europe chapter (northern Europe warming 2× global)
    - Ilmastolaki (Climate Act) 2015 carbon neutrality 2035
    - Just-Transition Fund €165M targeted peat regions
    - FMI (Finnish Meteorological Institute) climatology

