# ---------------------------------------------------------------
# Voltage-class × multi-DSO resolver
# ---------------------------------------------------------------
voltage_class_dso_resolver:
  pattern: MULTI_LAYER_TSO_PLUS_METRO_GEOFENCE_PLUS_REGIONAL_DSO
  layers:
    - name: Fingrid TSO threshold (≥110 kV baseline dominates)
      condition: voltage_kv >= 110
      attribution: Fingrid
      priority: 1
      note: Finnish 110/220/400 kV = Fingrid TSO; some DSOs also 110 kV but Layer 5 catches via direct OSM
    - name: HVDC interconnector (EstLink + FennoSkan)
      condition: voltage_kv in [350, 500] AND name matches ['EstLink', 'FennoSkan', 'Anttila', 'Espoo HVDC']
      attribution: Fingrid HVDC
      priority: 2
    - name: Nuclear plant identity
      condition: name matches ['Olkiluoto', 'Loviisa', 'OL1', 'OL2', 'OL3', 'LO1', 'LO2']
      attribution: TVO Olkiluoto (or Fortum Loviisa)
      priority: 3
    - name: VR Group rail traction (25 kV AC)
      condition: voltage_kv == 25 AND name contains rail_context
      attribution: VR Group
      priority: 4
    - name: Helsinki §4bis.5 geofence (7TH ENFORCEMENT — Helen vs Vantaan)
      condition: region == 'Uusimaa' AND voltage_kv < 110
      sub_layers:
        - condition: lat >= 60.15 AND lat <= 60.30 AND lon >= 24.85 AND lon <= 25.20
          attribution: Helen Sähköverkko
          note: Helsinki city core geofence
        - condition: lat > 60.28 AND lon >= 24.85 AND lon <= 25.20
          attribution: Vantaan Energia Sähköverkot
          note: Vantaa northern suburb
        - condition: fallback (Uusimaa region catch-all)
          attribution: Caruna
          note: Caruna covers Uusimaa outside Helsinki+Vantaa
      priority: 5
    - name: Åland special jurisdiction (Swedish autonomous)
      condition: region == 'Ahvenanmaa' OR region == 'Åland' OR lon <= 21.5
      attribution: Kraftnät Åland / Mariehamns Elnät
      priority: 6
    - name: Region → dominant DSO map (18 regions)
      condition: voltage_kv < 110 AND region is not null
      attribution: <region-mapped DSO>
      priority: 7
    - name: Fingrid catch-all (safety net)
      condition: fallback
      attribution: Fingrid
      priority: 8  # Layer 8 CATCH-ALL

