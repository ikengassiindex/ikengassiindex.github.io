# ---------------------------------------------------------------
# Convention #78 §4bis.5 Layer 3 — NOT REQUIRED for France
# ---------------------------------------------------------------
convention_78_4bis_5_layer_3_geofence:
  required: false
  architectural_simplification: enedis_dominant_dso_95pct_mainland_monopoly_pattern
  sibling_pattern_to:
    portugal_p33: E-REDES 99% single-DSO
    japan_p35: 9-regional-utility non-overlapping monopoly
  cohort_wide_signature: THIRD_WAVE_4_COUNTRY_WITHOUT_4BIS_5_via_ENEDIS_DOMINANCE
  rationale: |
    France is REGIONAL-DOMINANT-DSO jurisdiction — Enedis holds ~95%
    mainland market share, with ~150 small regional ELDs (~5%) that
    are NON-OVERLAPPING territorial entities (not metro splits).

    Paris → Enedis only (no metropolitan multi-DSO split like Milan
    A2A+E-Distribuzione or Rome ACEA+E-Distribuzione or Madrid
    Naturgy+Iberdrola).

    Strasbourg → ES Strasbourg (regional ELD) covers Bas-Rhin only,
    NOT a Paris-analog metro split. Metz → UEM similar. These are
    small regional monopolies within Enedis's dominant territory,
    resolved via voltage class or fallback default DSO layer, not
    §4bis.5.

  cumulative_enforcement_roster_pre_france:
    1: Prague CZ (P20)
    2: Warsaw PL (P21)
    3: EWZ Zurich CH (P24)
    4: SIG Geneva CH (P24)
    5: Auckland NZ (P27)
    6: Copenhagen DK (P28 — 615)
    7: Helsinki FI (P29 — 446)
    8: Istanbul TR (P30 — 178)
    9: London UK (P31 — 1994 LARGEST)
    10: Stockholm SE (P32 — 24)
    11: Milan IT (P34 — 350)
    12: Rome IT (P34 — 131)
    13: Madrid ES (P36 — 139)
  france_signature: ENEDIS_DOMINANT_ARCHITECTURAL_SIMPLIFICATION_NO_4BIS_5

