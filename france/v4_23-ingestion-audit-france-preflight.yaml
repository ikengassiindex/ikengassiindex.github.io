# ---------------------------------------------------------------
# Wave 4 architecture requirements (Portugal P33 bi-directional inheritance)
# ---------------------------------------------------------------
wave_4_architecture_requirements:
  merger_schema_target: canonical_compact_s_l_a
  osm_overpass_query_hints:
    substations: out center
    lines: out geom
  portugal_p33_bi_directional_option_b_inheritance:
    lines_side_sweden_p32_inheritance:
      include_power_minor_line: true
      accept_no_voltage_with_inference: true
      voltage_inference_defaults_kv:
        minor_line: 20.0  # French MV standard (matches Italy+Spain)
        cable_no_voltage: 20.0
        line_no_voltage: 63.0  # French subT standard (vs Italy 132, Portugal 60, Spain 66, Japan 66)
    subs_side_portugal_p33_extension:
      accept_no_voltage_with_inference: true
      voltage_inference_defaults_kv:
        substation_transmission: 225.0  # French HV standard (unique — between Italy 220 and Japan 275)
        substation_distribution: 20.0  # Enedis MV standard
        substation_minor_distribution: 15.0  # Enedis MV rural
        substation_traction: 1.5  # SNCF 1.5 kV DC classic + 25 kV AC 50 Hz TGV
        power_substation_generic: 20.0  # Enedis MV default (~95% market)
  merger_operations_required:
    - substation_id_assignment
    - line_id_assignment
    - polyline_conversion_to_compact_p_array
    - line_endpoint_ss_se_matching_string_ids
    - adjacency_graph_construction
    - grid_based_spatial_index_for_large_N_merges
    - bbox_split_fallback_if_single_bbox_fails
  compact_schema_write: via_scripts_pipeline_utils_grid_geo_sharding_write_grid_geo

