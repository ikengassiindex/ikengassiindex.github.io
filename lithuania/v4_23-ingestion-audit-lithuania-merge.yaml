lessons_generalised:
  - >
      **Baltic OSM density is unique**: Lithuania's OSM added +871% substations
      vs baseline (505 → 4901) — LARGEST relative-growth cohort-wide.
      Baltic OSM contributor community has mapped MV/LV distribution
      exhaustively. Pattern likely to repeat in Latvia + Estonia (Baltic
      Trio siblings).
  - >
      **Simplest 2-operator resolver validates cleanest**: Litgrid TSO
      + ESO monopoly default produced 99.9% state-duopoly attribution
      with only 6 tiny IPPs surviving (UAB Vėjas LT + Ignitis renewables
      + Enefit Green + 4 smaller). Fewer operators than any other Wave 2
      country. Reflects EPSO-G's post-1994 vertical integration.
  - >
      **Cyrillic Unicode alias handling**: Lithuania surfaced 1 Cyrillic
      "ЕСО" tag from likely Kaliningrad-adjacent Russian-speaking OSM
      contributor. NFC + case-insensitive lookup extended to catch
      Cyrillic ↔ Latin bridging. Pattern generalises to any future country
      with multi-script OSM community (Ukraine, Kazakhstan, other post-
      Soviet states).
  - >
      **Sub-heavy line ratio (0.81) is architecturally honest**: OSM's
      fine-grained MV substation tagging without corresponding MV/LV
      line tagging inverts the ratio. Not a task #182 outlier concern
      (opposite direction). Norway + Israel remain sole cohort-wide
      line-density outliers.
  - >
      **Baltic Trio Feb 2025 EU synchronisation context**: 400 kV LitPol
      Link + NordBalt HVDC captured cleanly in OSM. Cross-border 400 kV
      tag preservation empirically validates Discipline #36 polygon +
      100m tolerance for post-2025 grid topology.

