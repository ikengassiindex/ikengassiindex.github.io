lessons_generalised:
  - >
      **Monopoly + multi-DSO overlay scales cleanly from 4 to 7 nested territories**:
      Costa Rica extends Luxembourg's monopoly + 4 municipal geofence pattern to
      ICE default + 7 non-ICE DSOs (CNFL SJ + ESPH + JASEC + 4 rural cooperatives).
      Priority ordering (most-specific-first) resolves overlap zones. Pattern
      generalises to countries with state utility as majority + patchwork of
      municipal/cooperative DSOs (India + Bangladesh + Kenya + Tanzania).
  - >
      **Step 5 retroactive owner attribution pattern**: when OSM baseline
      is smaller than ssi-data baseline (Costa Rica 112 OSM vs 169 baseline),
      the OSM-driven merge leaves unmatched baseline subs without owner. The
      same resolver applied retroactively closes the gap cleanly. Provenance
      tagged distinctly ("retroactive_" prefix) for audit trail. Should be
      wired into future merge scripts as a Step 4b post-pass for countries
      where OSM sub count < baseline count.
  - >
      **All 3 coverage dimensions at 100% simultaneously — cleanest cohort result**:
      Costa Rica is the FIRST cohort-country to reach 100% on ALL three
      dimensions (owner + voltage + region) simultaneously. Baseline was
      already 100% voltage + 100% region; Step 5 retroactive closed the
      owner gap. Reflects the small country + clean transmission-tier
      baseline + monopoly-dominated distribution architecture.
  - >
      **Line densification exceeded substation densification**: OSM added
      195 net-new lines (34% growth) but 0 net-new substations. Costa Rica's
      transmission-tier baseline was already comprehensive; OSM contributed
      distribution-tier line detail (mostly 34.5 + 24.9 kV MV lines). Line-
      ratio moved from clean 3.40 to clean 4.56.
  - >
      **Small OSM footprint doesn't imply incomplete country — baseline is
      the arbiter**: Pre-flight estimated 500-1500 OSM subs; actual 112.
      This isn't a country-onboarding failure; it reflects that Costa Rica's
      distribution grid is underrepresented in OSM globally. The baseline
      canonical (169 subs) is the source of truth; OSM is enrichment.

