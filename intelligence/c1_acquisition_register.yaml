  france:
    verdict: NOT ACQUIRED — typed constants behind a function named fetch()
    file: "SSI Index/SSI_v4_0 France/france-pipeline/data/raw/cre_tiqe.csv"
    producer: "SSI Index/SSI_v4_0 France/france-pipeline/ingestion/cre_tiqe.py"
    schema: dept_code, dept_name, region_name, SAIDI_min, SAIFI, CAIDI_min, C3_MT_exceed_pct, C4_planned_count
