        route: HTML table only; no CSV or XLSX offered on this page
        read: true
      - name: Bundesnetzagentur — Kennzahlen der Versorgungsunterbrechungen Strom
        url: https://www.bundesnetzagentur.de/DE/Fachthemen/ElektrizitaetundGas/Versorgungssicherheit/Versorgungsunterbrechungen/Auswertung_Strom/start.html
        metrics: [C1, C2]
        unit: not yet verified
        licence: not yet verified
        route: not yet verified
        read: false
    status: partially_established
    open: >
      Licence unresolved. 16 units for 108,016 substations is 6,751 assets per
      measured value — the coarsest granularity so far and a real limit on what
      C can claim in Germany.

  italy:
    records: 41662
    regulator: ARERA
    publications:
      - name: >
          Pubblicazione comparativa degli indicatori di continuità del servizio
          elettrico (13th edition, reference year 2024)
        url: https://www.arera.it/comunicati-operatore/dettaglio/continuita-servizio-e-qualita-tensione-nuova-interfaccia
        metrics: [C1, C2]
        note: >
          Number and duration of interruptions. Published under TIQD, the
          integrated output-based regulation text for 2024-2027.
        unit: >
          ambito territoriale — comune density class (over 50,000 inhabitants
          / 5,000-50,000 / under 5,000) crossed with distributor
        unit_count: not yet counted
        years: 2024, with twelve prior comparative editions
        licence: not stated on the page
        route: >
          SAS Visual Analytics interface at reporting.arera.it; no download or
          API located yet
        read: true
    status: partially_established
    open: >
      The unit is not province. Joining to Italian substations needs
      lat/lon -> comune -> density class and distributor. That join is finer
      than province if the underlying table can be obtained; the SAS interface
      is not yet a machine-readable route.

  us:
    records: 73859
    regulator: US Energy Information Administration (EIA)
    publications:
      - name: Form EIA-861 Annual Electric Power Industry Report — Reliability file
        url: https://www.eia.gov/electricity/data/eia861/
        metrics: [C1, C2]
        note: >
          "The data contain information on non-momentary electrical
          interruptions. If collected, utilities report the system average
          interruption duration index (SAIDI), the system average interruption
          frequency index (SAIFI)." Reported by the filing utility. "If
          collected" is load-bearing: the return is conditional, so coverage
          must be measured per year before use, not assumed.
        unit: filing utility
        unit_count: not yet counted from the file
        years: 1990 to 2025 (2025 early release)
        licence: >
          Public domain. "U.S. government publications are in the public
          domain and are not subject to copyright protection." Acknowledgment
          with publication date is required.
        licence_url: https://www.eia.gov/about/copyrights_reuse.php
        route: annual ZIP per year, direct download, no key
        read: true
    status: partially_established
    open: >
      The join from substation to filing utility is the work. Utility service
      territories are published separately; that join has to be built and
      measured, and every substation that falls in no territory gets no C
      rather than a default.

  uk:
    records: 59744
    regulator: Ofgem
    publications:
      - name: RIIO-2 Electricity Distribution Annual Report 2024 to 2025
        url: https://www.ofgem.gov.uk/sites/default/files/2026-01/ED-annual-report-2024-2025.pdf
        metrics: [C1, C2, C4]
        note: >
          Customer Minutes Lost is SAIDI under its GB name; Customer
