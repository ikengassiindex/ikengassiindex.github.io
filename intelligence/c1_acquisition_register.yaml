      Session 21 (3 March 2026) replaced an earlier estimated series with
      these figures and recorded the deltas: Basilicata had been
      overestimated by 44 per cent, Piemonte underestimated by 46 per cent,
      Trentino-Alto Adige by 40 per cent. That is the measured cost of typing
      a continuity series instead of fetching it.
    wired: false
    wired_check: >
      grep across ssi-pipeline/ and ikengassiindex.github.io/scripts/ returns
      no reference to these files, to D1L, or to arera_tiqe. Italy's published
