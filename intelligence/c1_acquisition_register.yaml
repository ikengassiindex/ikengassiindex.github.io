    gate: >
      The builder carries the count, the three annual sums and the 2024 min and
      max exactly as the Enedis API itself computed them, and refuses to write
      unless the transferred rows reproduce every one. n=94,
      sum(2024)=197.84799486999702 to fourteen significant figures. A
      transcription error cannot pass that.
    spread_2024: Paris 0.000245 per cent to Aveyron 7.05 per cent
    national_anchor:
      layer: 1
      years: 2022 2023 2024
      C1_2024: 53.300
      C2_2024: 1.911
      C4_2024: 18.272
    definitional_correction:
      what: >
        Enedis' published critère B is "hors événements exceptionnels et hors
        RTE". It is not an all-causes figure. Earlier in this session France's
        53.300 was set against Italy's all-causes 73.11 and France called the
        better performer. On the matched basis — Italy's "altre cause" 44.840 —
        France is 19 per cent worse. Both definitions files now carry a
        do_not_compare block naming that exact pairing.
    c4_schema_correction: >
      France and Italy both publish planned interruption DURATION in minutes.
      The typed France file emitted C4_planned_count. No French source
      publishes a planned count. C4 is a duration and the schema says so.
    open_residual: >
      Whether the critère B duration series counts sub-three-minute
      interruptions is not stated by Enedis. Bounded at roughly 7 per cent of
      53.300 in the worst case and realistically far less. Recorded, not
      assumed away. Route: CRE's current qualité reporting, unread.

  C3_STRUCTURAL_FINDING:
    date: 2026-09-25
    question: >
      Can C3 be transferred to Italy by fitting its relationship to C1, C2 and
      C4 in a donor jurisdiction that publishes all four sub-nationally?
    answer: >
      Not from any jurisdiction yet checked, and the reason is structural
      rather than a gap in searching.
    evidence:
      italy:
        C1: published, DSO x concentration x region
        C2: published, same unit
        C4: published, province (E-Distribuzione)
        C3: NOT published. Collected by ARERA per ambito — "Numero di utenti
            MT con un numero di interruzioni oltre lo standard" — and not
            disclosed.
      norway:
        C1: published, national / nettselskap / fylke / sluttbrukargruppe
        C2: published, same units, kortvarige <=3 min and langvarige >3 min
        C4: published, "varsla" reported separately from "ikkje-varsla"
        C3: no regulated-breach metric in RME's external documentation
        source: https://www.nve.no/media/20400/ekstern-dokumentasjon-avbrotsstatistikken.pdf
      spain:
        C1: published, TIEPI, national / CCAA / provincia / municipio x zona
        C2: published, NIEPI, same units
        C4: published, programmed distinguished from unplanned
        C3: >
            NOT published. MITECO states there are no published measures
            regarding the number or percentage of customers exceeding
            individual quality limits. The limits themselves exist in Orden
            ECO/797/2002; the exceedance data is not disclosed.
        source: https://www.miteco.gob.es/en/energia/energia-electrica/electricidad/calidad-servicio/indices.html
      france:
        C1: national only, 18 records
        C2: national only, 18 records
        C4: national only
        C3: published, 94 départements, 2009-2024
    the_pattern: >
      C3 is published sub-nationally in exactly one of four jurisdictions
      checked, and that one publishes nothing else sub-nationally. The three
      that publish C1, C2 and C4 all withhold C3.
    why_structurally: >
      C1, C2 and C4 are fleet-performance statistics — what the average
      customer experienced. C3 is a compliance statistic — how many customers
      breached an individual guarantee. They come from different regulatory
      instruments and the regimes that publish one do not publish the other.
      That is not a coincidence to be searched around.
    consequence_for_the_transfer: >
      A transfer needs C3 and C1/C2/C4 at the SAME units in the SAME
      jurisdiction so the cross-sectional relationship can be fitted. No
      overlap exists in four jurisdictions. France cannot donate to Italy
      because France has no sub-national C1, C2 or C4 to fit C3 against.
      The mosaic has nothing to bridge with.
    what_this_licenses: >
      It converts "we could not obtain C3" into "C3 is not published at the
      required unit in four of four jurisdictions checked, for a stated
      structural reason". That is what makes a declared renormalisation over
      the present metrics a finding-backed decision rather than a convenience.
    best_next_acquisition: >
      Spain. TIEPI and NIEPI at municipio x zona (urbana, semiurbana, rural
      concentrada, rural dispersa) is the finest unit located anywhere so far,
      with programmed separated from unplanned, CSV and Excel, all years,
      under the public-sector reuse initiative.

