        read: true
    status: partially_established
    open: >
      14 units for 59,744 substations. The six DNO groups run their own open
      data portals, several at primary-substation level, which would be far
      finer than the licence area. That is the route worth establishing for
      the UK, not the Ofgem aggregate.

