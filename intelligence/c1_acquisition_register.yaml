# ════════════════════════════════════════════════════════════════════════════
# C1 ACQUISITION REGISTER — regulator continuity-of-supply returns
#
# WHY THIS FILE EXISTS
# ────────────────────
# The metric registry in the component builder blocks C1, C2, C3 and C4 on one
# source class: "regulator continuity return — SAIDI / SAIFI / C3_MT_exceed_pct
# / planned-unplanned split, sub-national". The same source class is the sole
# dependency of V1 ("SAIDI; V_socio is already present at 100% coverage") and
# half of E1 ("C1_raw and avg_load_MW").
#
# One acquisition therefore unblocks components C (weight 0.30), V (0.10) and
# part of E (0.10) — by the rank-variance decomposition of
# doctrine/FINDING_what_determines_a_substations_rank.md, over half of what
# decides a substation's position within its own country.
#
# Until it lands, C V E S and T are what
# doctrine/FINDING_every_traced_component_is_a_hash.md measured them to be.
#
# RULES THIS FILE OBEYS
# ─────────────────────
# Pin 14  every coefficient verified against a primary or secondary source
# Pin 15  open public data only; no paid source is entered here, ever
# §7.6    no citation not read — `read: true` means the page was fetched and
#         the fields below were taken from it, not from a search snippet
# §7.9    a jurisdiction not yet researched says so; it gets no placeholder
#
# FIELD MEANINGS
# ──────────────
# unit          the geographic unit the regulator publishes at
# unit_count    how many such units exist (the granularity ceiling)
# records       published substations in that jurisdiction
# per_unit      records / unit_count — how many assets share one measured value
# metrics       which of C1 C2 C3 C4 the publication carries
# licence       as stated by the publisher; null where the publisher states none
# route         machine-readable access, or the form the data takes if none
# read          true only where the cited URL was fetched and read
# ════════════════════════════════════════════════════════════════════════════

version: 1
compiled: 2026-09-25
blocks: [C1, C2, C3, C4, V1, E1]
total_jurisdictions: 39
researched: 5

jurisdictions:

  france:
    records: 168894
    regulator: CRE
    operator: Enedis
    CORRECTION:
      date: 2026-09-25
      what_was_recorded: >
        This register's first version carried France at "département, 96 units,
        1,759 substations per measured value" and left the unit of the two
        critère B datasets as "not yet verified from the primary source". The
        département figure was read off the sibling C3 dataset and generalised
        to critère B. That generalisation was wrong.
      what_is_true: >
        Enedis publishes critère B and the coupure frequency NATIONALLY ONLY —
        18 records and 485 bytes for the duration series, 18 records and 707
        bytes for the frequency series, one value per year. Neither is
        sub-national. The only sub-national continuity dataset Enedis
        publishes is the regulatory indicator, 94 records at département,
        2009 to 2024.
      consequence_for_the_mosaic: >
        France cannot serve as the calibration donor for a C3 transfer to
        Italy. The transfer needs a jurisdiction publishing C1, C2 and C4
        sub-nationally alongside C3, so that the cross-sectional relationship
        can be fitted. France has C3 sub-nationally and the other three only
        as 18 national points. Italy is its mirror image: C1, C2 and C4 per
        province, no C3. Neither is a donor; together they are evidence that
        the four metrics are not published as a set anywhere yet checked.
    publications:
      - name: Indicateur réglementaire continuité d'alimentation
        url: https://opendata.enedis.fr/datasets/indicateur-continuite-dalimentation/
        metrics: [C3]
        unit: département
        records: 94
        size: 17 kB
        years: 2009-01-01 to 2024-12-31
        refresh: annual
        licence: Licence Ouverte / Open Licence 2.0
        read: true
        status: THE ONE SUB-NATIONAL C METRIC FRANCE PUBLISHES. Not yet fetched.
      - name: Durée moyenne de coupure par client BT (critère B)
        url: https://opendata.enedis.fr/datasets/duree-moyenne-de-coupure-bt
        metrics: [C1]
        unit: national
        records: 18
        size: 485 bytes
        refresh: twice yearly, last 29 June 2026
        licence: Licence Ouverte / Open Licence 2.0
        read: true
      - name: Fréquence moyenne de coupure par client BT
        url: https://opendata.enedis.fr/datasets/frequence-moyenne-de-coupure-par-client-bt/
        metrics: [C2]
        unit: national
        records: 18
        size: 707 bytes
        licence: Licence Ouverte / Open Licence 2.0
        read: true
      - name: Durée / Fréquence moyenne de coupure par client HTA
        url: https://opendata.enedis.fr/datasets/frequence-moyenne-annuelle-de-coupure-par-client-hta/
        metrics: [C1, C2]
        unit: not yet verified
        read: false
    what_the_typed_file_invented:
      file: "SSI Index/SSI_v4_0 France/france-pipeline/data/raw/cre_tiqe.csv"
      producer: ingestion/cre_tiqe.py::fetch()
      finding: >
        The typed file carries SAIDI_min, SAIFI, CAIDI_min and C4_planned_count
        per département. Enedis publishes none of those four at département
        level — they exist only as national annual series. So four of its five
        measured columns are not merely unfetched, they are quantities no
        French source publishes at that unit.
        The fifth column, C3_MT_exceed_pct, IS published per département by
        Enedis, has been since 2009, under Licence Ouverte 2.0, in a 17 kB
        file. It was typed too.
    status: partially_established
  germany:
    records: 108016
    regulator: Bundesnetzagentur
    publications:
      - name: Versorgungsunterbrechungen Strom — SAIDI je Bundesland
        url: https://www.statistikportal.de/de/nachhaltigkeit/ergebnisse/ziel-9-industrie-innovation-und-infrastruktur/versorgungsunterbrechungen
        metrics: [C1]
        note: >
          SAIDI(EnWG) for each of the 16 Länder plus a national figure. The
          portal is the statistical offices' SDG-9 presentation; the source it
          names is the Bundesnetzagentur.
        unit: Bundesland
        unit_count: 16
        per_unit: 6751
        years: 2008 to 2024
        licence: >
          null — the portal footer states "Alle Rechte vorbehalten". The
          primary source is BNetzA and its terms must be read there before
