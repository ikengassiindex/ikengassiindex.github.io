    National granularity only, so it cannot satisfy the sub-national
    requirement. Its value is definitional: it states, per country, how SAIDI
    is computed — planned versus unplanned, exceptional events in or out —
    which is what makes the national returns comparable to each other. Read it
    before the first connector is written, not after.
  read: false
