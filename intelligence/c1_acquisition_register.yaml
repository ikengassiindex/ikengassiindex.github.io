  italy_L0_definitions:
    read_from: https://www.arera.it/dati-e-statistiche/dettaglio/prestazioni-delle-imprese-distributrici-continuita-del-servizio-23
    read: true
    date_read: 2026-09-25
    durata_D1L: >
      "durata annua media di interruzioni (minuti persi) per le interruzioni
      senza preavviso lunghe (> 3 minuti)" — annual average minutes lost, per
      LV user, counting UNPLANNED LONG interruptions only.
    numero_N1L: >
      "numero medio di interruzioni per le interruzioni senza preavviso lunghe
      e brevi" — annual average count, per LV user, counting UNPLANNED LONG
      AND SHORT interruptions.
    consequence_1: >
      D1L and N1L are not on the same basis. D1L excludes short interruptions;
      N1L includes them. D1L / N1L is therefore NOT a restoration time: the
      numerator omits the duration of events the denominator counts.
      arera_tiqe_2024_regional.csv publishes CAIDI_min and CAIDI_ratio built on
      that ratio, and session 21 drew a substantive conclusion from it — that
      restoration is faster in the south and worst in Piemonte at 15.73 min.
      That conclusion is not supported by ARERA's own definitions. The two
      columns must not feed a score and the inference must not be repeated.
    consequence_2: >
      Both indices are "senza preavviso" — unplanned only. C4, the planned /
      unplanned split, is absent from this publication entirely. Italy has C1
      and C2 on an unplanned basis and no C4 from this source.
    consequence_3: >
      C1 for Italy means unplanned-long SAIDI. France's critère B and the
      Ofgem CML are not necessarily on that basis. Cross-country comparison of
      C is already excluded by the per-country band, but the basis must be
      recorded per country or the within-country series will drift when a
      regulator changes its exclusions.

  italy_L4_independent_constraint:
    verdict: LOCATED, NOT YET FETCHED
    name: Rapporto annuale degli output
    obligation: article 58 of ARERA deliberation 617/2023/R/eel
    who: each distribution company with more than 100,000 delivery points
    count: 10 companies, each publishing on its own site
    url: https://www.arera.it/comunicati-operatore/dettaglio/prime-edizioni-rapporto-annuale-degli-output-e-di-monitoraggio-piano-di-sviluppo-imprese-distribuzione-24
    read: true
    why_it_matters: >
      This is published by the operators themselves, independently of ARERA's
      comparative tables. It is therefore a genuine constraint on the 91-row
      L3 — the first one Italy has. E-Distribuzione alone carries the majority
      of the 36,995,573 LV users, so agreement or disagreement on that one
      company already tests most of the estate.
    caution: >
      Independent of the comparative tables only if the companies compute it
      from their own records rather than restating ARERA's published figures.
      That has to be read before the residual means anything — the lesson of
      arera_tiqe_2024_regional.csv.

  italy_L4_RECONCILED:
    verdict: INDEPENDENT CONSTRAINT OBTAINED AND IT HOLDS
    date: 2026-09-25
    source:
      name: E-Distribuzione — Rapporto Annuale degli Output, 30/06/2025
      url: https://www.e-distribuzione.it/content/dam/e-distribuzione/documenti/Rapporto%20annuale%20degli%20output%202025.pdf
      obligation: article 58, ARERA deliberation 617/2023/R/eel
      basis: the company's own operational records
      data_year: 2024
      unit: province
      unit_count: 107
      read: true
    published_national_totals_2024:
      durata_unplanned_long_all_causes: 73.11
      durata_unplanned_long_other_causes: 44.84
      numero_unplanned_long_and_short_all_causes: 5.502
      numero_unplanned_long_and_short_other_causes: 3.985
      durata_planned_all_causes: 95.53
      durata_planned_other_causes: 90.71
    residual_against_L3:
      L3: ARERA comparative tables 2024, the 53 E-DISTRIBUZIONE rows
      L3_users: 31732983
      L3_share_of_italy: 0.858
      N1L: "L3 3.985  vs  L4 3.985   residual 0.000 — exact agreement"
      D1L: "L3 45.610 vs  L4 44.840  residual +0.770 min, +1.7%"
      reading: >
        This is what an independent check looks like. One index agrees to
        three decimals; the other agrees to within 1.7 per cent and the
        residual carries information — the weighting basis differs, ARERA
        aggregating over ambiti and the company over provinces. Set it beside
        arera_tiqe_2024_regional.csv, which agreed to 0.0000 on every row
        because it was the same numbers rearranged.
    why_L4_supersedes_L3_for_italy:
      granularity: >
        107 provinces against 91 DSO x concentration x region. In fleet terms
        356 substations per measured value against 458 — and the join is
        direct: italy's records already carry the province name in `region`
        and the NUTS-3 code in `province`, 108 codes across 41,662 records,
        none missing. No geocoding, no polygon intersection, no ID
        reconciliation of the kind that blocks I4.
      completeness: >
        E-Distribuzione publishes durata CON preavviso — planned interruptions
        — which ARERA's comparative publication omits entirely. That is C4,
        and it is the larger number: 95.53 planned all-cause minutes against
        73.11 unplanned. A C1 built on ARERA's D1L alone counts well under
        half the minutes a customer actually loses.
      exceptional_events: >
        all causes 73.11 minus other causes 44.84 = 28.27 minutes per user of
        exceptional events in 2024, 38.7 per cent of all-cause minutes. This
        is the CEER definitional axis with a number on it, published by the
        operator, per province.
    coverage_gap: >
      E-Distribuzione is 85.8 per cent of Italy's LV users. The remaining
      14.2 per cent sit with the other 14 DSOs in the ARERA tables; nine of
      them exceed 100,000 delivery points and so publish their own Rapporto
      under the same article 58. Those are the next nine reads, and the ARERA
      L3 covers them in the meantime.
    blocked_on: >
      the 107-province table itself. The figures above are the document's
      national totals. The per-province rows must be parsed from the PDF, not
      transcribed by eye — §7.2. The file has to be on disk for that.

