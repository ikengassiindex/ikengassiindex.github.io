  name: 7th CEER-ECRB Benchmarking Report on the Quality of Electricity and Gas Supply
  url: https://www.ceer.eu/wp-content/uploads/2024/04/7th-Benchmarking-Report-2022.pdf
  published: 2022-12-22
  covers: CEER members and observers and Energy Community Contracting Parties
