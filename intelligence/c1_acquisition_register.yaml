      The schema is exactly C1 C2 C3 C4 and the column C3_MT_exceed_pct is the
      string the metric registry blocks on, verbatim. The values are not
      measurements. cre_tiqe.py::fetch() performs no request: it assigns one
      of seven typed base values by région, adds one of twenty-two typed
      per-département adjustments, and writes the result under a docstring
      citing CRE's Bilan de la qualité de l'électricité. Ain and Allier carry
      identical SAIDI because both are Auvergne-Rhône-Alpes. SAIFI, C3 and C4
      are constant within each région.
    rule: §7.2 — no measured value typed. §7.6 — no citation not read.

  switzerland:
    verdict: ROUTE NAMED, NOT ACQUIRED
    named_in: "ssi-pipeline/SSI_ESG_Data_Sources_and_SDG_Mapping.md:261"
    entry: >
      "Continuity component C (only 2 unique values) | SFOE / Swissgrid |
      bfe.admin.ch, swissgrid.ch | Grid reliability statistics (SAIDI, SAIFI
      by canton) | CSV"
