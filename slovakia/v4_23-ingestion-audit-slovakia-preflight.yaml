source_options:
  canonical:
    name: OSM Overpass
    endpoint_primary: https://overpass-api.de/api/interpreter
    endpoint_fallback_1: https://overpass.kumi.systems/api/interpreter
    endpoint_fallback_2: https://overpass.private.coffee/api/interpreter
    query_scope: power=substation + power=line + power=minor_line + power=cable
    bbox: [16.83, 47.73, 22.57, 49.61]  # west, south, east, north (Slovakia bounds)
    strategy: >
      Single-query pattern — Slovakia bbox ~49k km² (similar to Estonia).
      Sub-2-minute fetch expected. Endpoint-fallback strategy per LT + EE
      + LV precedent.
    expected_yield:
      substations: 2500-6000  # empirical post-Baltic Trio range
      lines: 3500-9000  # sparse baseline should permit substantial OSM densification
    tag_completeness_hypothesis: >
      Slovakia OSM tagging density expected moderate — Bratislava metro
      well-mapped, eastern Košice industrial region moderately mapped,
      rural centre + east sparser. Historical Czechoslovak-era operator
      names may appear (pre-1993 Slovak-Czech unified grid). Post-Soviet
      cohort — Convention #78 BINDING enforcement mandates preemptive
      Cyrillic alias handling (some Rusyn/Ukrainian OSM contributors in
      eastern Slovakia + Ukraine border zone). Semi-colon compound tags
      likely (per Estonia + Latvia precedent — SEPS;VSD/SSD/ZSD shared-
      node handoffs at DSO connection points).
    lp_dd_class: canonical

  fallback_region_jurisdiction_by_voltage_class:
    strategy: seps_tso_threshold_plus_3_regional_dso_via_nuts3_geofence
    rationale: >
      Region-jurisdiction × voltage-class pattern (7th cohort-wide
      application after Belgium 3-region + Netherlands 4-region + Chile
      latitude-band + Hungary 4-region + Slovenia 5-DSO NUTS-3 map +
      Colombia department + Norway county). Slovakia's clean 3-way
      east/centre/west partition maps 1:1 to NUTS-3 codes — no geofence
      lat/lon needed if OSM populates NUTS-3 tags (per Slovenia + Hungary
      precedent). SEPS as unified state TSO at ≥110 kV; 3 regional DSOs
      at ≤110 kV via NUTS-3 map. Each DSO carries 51% state + 49%
      strategic partner (RWE/EPH/E.ON) but state control preserved.
    tso_threshold_kv: 110
    tso_operator: SEPS  # Slovenská elektrizačná prenosová sústava (100% state-owned)
    dso_partition_via_nuts3:
      ZSD (Západoslovenská distribučná): [SK010, SK021, SK022, SK023]  # 42.3% baseline
      SSD (Stredoslovenská distribučná): [SK031, SK032]  # 22.2% baseline
      VSD (Východoslovenská distribučná): [SK041, SK042]  # 35.5% baseline
    holding_partial_state:
      ZSD_parent: ZSE Energia (Západoslovenská energetika a.s. — 51% Slovak state / 49% E.ON)
      SSD_parent: SSE Distribúcia (Stredoslovenská energetika a.s. — 51% Slovak state / 49% EPH)
      VSD_parent: VSD (Východoslovenská energetika a.s. — 51% Slovak state / 49% RWE Innogy)
    system_operator_note: >
      SEPS handles both TSO ownership AND SO functions in Slovakia. No
      separate system operator entity. Slovenské elektrárne (SE) is
      generation-only (Enel Group + Slovak Power Holding), non-grid.

