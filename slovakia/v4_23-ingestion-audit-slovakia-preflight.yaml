risks_flagged:
  - risk_1: >
      110 kV is a MIXED tier in Slovakia — SEPS operates transmission
      backbone at 110 kV AND regional DSOs operate subtransmission at
      110 kV. Empirically the baseline is 63.2% at 110 kV (dominant tier),
      so partitioning at 110 kV threshold gives SEPS transmission subs
      + DSO subtransmission. May require voltage threshold refinement
      post-merge based on empirical OSM operator tags.
  - risk_2: >
      Historical Czechoslovak-era operator names may appear on very old
      OSM tags (pre-1993 unified Czech-Slovak grid). Alias map catches
      predecessor variants → legacy tags.
  - risk_3: >
      5-country border zones with Czech Republic (NW) + Poland (N) +
      Ukraine (E — 750 kV Mir/Slavia HVDC) + Hungary (S) + Austria (W —
      small). Discipline #36 cross-border filter uses slovakia/bounds.json.
      Mir/Slavia 750 kV Ukraine cross-border may generate coastal-analogue
      edge cases at Vysoké Tatry mountain range crossings.
  - risk_4: >
      Cyrillic alias handling — Eastern Slovakia (Prešov + Košice) has
      Rusyn + Ukrainian minority populations (~2% total, concentrated
      near Ukraine border). Convention #78 BINDING enforcement preemptive
      Cyrillic aliases (СЕПС / ЗСД / ССД / ВСД / Словенска ELEKTRIZAČNA
      pre-Nova su STAVA / equivalents) mapped in alias table.
  - risk_5: >
      Semi-colon compound operator tags (per Estonia + Latvia precedent)
      likely to surface — SEPS;VSD / SEPS;SSD / SEPS;ZSD shared-node
      transmission↔distribution handoffs. Convention #56 preserves as-is.
  - risk_6: >
      Typographic-quote variants (per Latvia precedent) — Slovak uses
      „..." typographic quotes (like Czech/German/Latvian). Convention
      #78 BINDING enforcement preemptive mapping. Test whether preemptive
      mapping produces first-cohort clean output (Estonia precedent =
      zero Step 5 patches) or requires post-merge retighten (Latvia
      precedent = 122 subs retightened).

