# ── Baseline state (as of pre-fetch snapshot 17 July 2026) ───────────────

baseline_state:
  ssi_data_substations: 684
  grid_geo_lines: TBD_at_step_2
  voltage_coverage_pct: 100.0                 # ALL subs have voltage (630 MV + 54 HV)
    # empirical baseline audit: 630 subs at 11-66 kV (MV) + 54 subs at 132 kV (HV/EHV) = 100% voltage coverage
  region_coverage_pct: 100.0                  # 8/8 statistical regions populated
  owner_coverage_pct: 0.0                     # ⚡ ZERO baseline — same as Czechia/Poland/Slovakia signature
  bounds_features: 8                          # 8 statistical region polygons
  min_fleet_pin: 600                          # KB §56 fleet-floor (Iceland 684 baseline; 500-800 range typical for small Nordic countries)

# ── Data source primary — OSM Overpass API ──────────────────────────────

primary_source:
  source_id: IS-C1-osm-overpass
  publisher: OpenStreetMap contributors via Overpass API
  licence: ODbL (Open Database License) — attribution required
  endpoint_primary: https://overpass-api.de/api/interpreter
  endpoint_fallback: https://overpass.kumi.systems/api/interpreter
  expected_query_scope: >
    3 element-type queries for substations (way + node + relation) + 1
    combined query for lines (power=line + cable + minor_line). Area
    header: area["ISO3166-1"="IS"]->.is
  expected_yield:
    substations_way: 500-1500                 # Icelandic OSM density modest — smaller than Central European per-capita
    substations_node: 200-600
    substations_relation: 5-15
    lines: 2000-8000                          # Nordic + geothermal-clustered line-density profile
    line_ratio_pre_merge: 3.5-5.5             # Similar to Norway coastline profile
    total_raw_bytes: ~10-25 MB                # Small fetch (below Greek scale)
  expected_scale_context: >
    Iceland is SECOND Wave 3 cohort at 684 baseline subs. Expected 2-5×
    increase to ~1500-3500 net-new substations. SIMPLEST cohort-wide
    remains Greece (single DSO); Iceland has 4-5 regional DSOs but
    geographically distinct territories make Layer 3 geofence unlikely
    (unlike Warsaw metro Innogy Stoen narrow carve-out). Estimated
    ~3-5 min sandbox fetch (safely within timeout — but Greek OSM
    sparsity precedent suggests possible timeout on 1-2 query cycles).

# ── Grid architecture — Landsnet single-TSO + 4-5 regional DSOs ─────────

grid_architecture:
  tso_transmission:
    operator_id: LANDSNET
    operator_names_aliases:
      - "Landsnet"                              # Icelandic
      - "Landsnet hf."                          # Icelandic with legal form
      - "Landsnet hf"                           # Without period
      - "LANDSNET"                              # Uppercase
      - "Landsnet A.S."                         # Latin legal form variant
    voltage_thresholds:
      backbone_kv: 220                          # 220 kV EHV backbone (Iceland has NO 400 kV — small grid)
      high_voltage_kv: 132                      # 132 kV HV main transmission
      subtransmission_kv: 66                    # 66 kV subtransmission (regional interties)
    tso_threshold_rule: "≥132 kV → LANDSNET"    # Simple threshold; 66 kV could be TSO or DSO depending on region
    established: 2005                           # Unbundled from Landsvirkjun 2005 per EU 3rd Package
    pre_2005_operator: Landsvirkjun (state utility integrated 1965)
    predecessor_alias_generation: 1             # Single rebrand cascade (Landsvirkjun → Landsnet)
    grid_synchronous: FALSE                     # Iceland isolated grid — NOT synchronised with Nordic Grid
    grid_frequency_hz: 50
    note: >
      Iceland is a fully isolated grid (no cross-border interconnections)
      unlike Nordic mainland (Norway/Sweden/Finland/Denmark synchronous
      grid). This affects Convention #56 cross-border filter — outside-
      polygon substations are ALWAYS erroneous (no legitimate Icelandic
      subs beyond bounds.json envelope).

  dso_distribution:
    architectural_note: >
      Iceland has 4-5 regional DSOs — architecturally MORE complex than
      Greece (single DEDDIE) but geographically SIMPLER than Poland
      (regional territories are distinct + non-overlapping unlike Poland's
      Warsaw metro exception). Layer 3 lat/lon geofence LIKELY needed
      for Reykjavík Capital Region (Veitur + Landsnet HV coexistence).

    veitur:
      operator_id: VEITUR
      operator_names_aliases:
        - "Veitur"
        - "Veitur ohf."                         # ohf. = opinbert hlutafélag (public LLC)
        - "Veitur ohf"
        - "Orkuveita Reykjavíkur"               # Parent OR
        - "OR"                                  # Acronym
        - "Orkuveitan"                          # Colloquial
      territory: >
        Capital Region (Höfuðborgarsvæðið) + Akranes + Borgarnes +
        parts of South Iceland
      share_estimated: ~35%                     # LARGEST DSO by connection count
      predecessor: Rafmagnsveita Reykjavíkur (RR) — pre-2000

    rarik:
      operator_id: RARIK
      operator_names_aliases:
        - "RARIK"
        - "Rarik"
        - "Rarik ohf."
        - "Rafmagnsveitur ríkisins"              # Icelandic full name (State Electricity Corporation)
        - "Rafmagnsveitur rikisins"              # Latin transliteration
      territory: >
        Rural areas + North + South + East excluding Capital Region +
        Reykjanes peninsula
      share_estimated: ~40%                     # LARGEST by area, medium by connections
      predecessor: Rafmagnsveitur ríkisins (state 1946-2006) — 2006 became ohf.

    hs_veitur:
      operator_id: HS_VEITUR
      operator_names_aliases:
        - "HS Veitur"
        - "HS Veitur hf."
        - "HS Veitur hf"
        - "Hitaveita Suðurnesja"                # Pre-2008 legacy name (Suðurnes Heat Utility)
      territory: >
        Reykjanes peninsula + Vestmannaeyjar (Westman Islands) +
        part of South Iceland
      share_estimated: ~15%
      predecessor: Hitaveita Suðurnesja (1974-2008) — geothermal-first

    nordurorka:
      operator_id: NORDURORKA
      operator_names_aliases:
        - "Norðurorka"                          # Icelandic
        - "Nordurorka"                           # Latin transliteration
        - "Norðurorka hf."
        - "Nordurorka hf"
      territory: >
        Akureyri (2nd largest Icelandic city) + Eyjafjörður region
      share_estimated: ~7%
      predecessor: Rafveita Akureyrar (Akureyri Electric — pre-2000)

    orkubu_vestfjarda:
      operator_id: OV
      operator_names_aliases:
        - "Orkubú Vestfjarða"                    # Icelandic
        - "Orkubu Vestfjarda"                    # Latin transliteration
        - "OV"                                   # Acronym
        - "Orkubú Vestfjarða ohf."
        - "Orkubu Vestfjarda ohf"
      territory: >
        Westfjords (Vestfirðir) — isolated peninsula
      share_estimated: ~3%
      predecessor: None (established 1978 for Westfjords)

  private_captives_estimated:
    - "Landsvirkjun (state generation — 12 hydro + 3 geothermal + 2 wind)"
    - "Rio Tinto Alcan (Straumsvík aluminium smelter — largest single consumer)"
    - "Century Aluminum (Grundartangi + Helguvík smelters)"
    - "Norðurál (Grundartangi smelter — Century Al subsidiary)"
    - "Elkem Iceland (Grundartangi ferrosilicon plant)"
    - "PCC BakkiSilicon (Bakki silicon metal plant)"
    - "Fjarðaál (Reyðarfjörður aluminium smelter — Rio Tinto)"
    - "OR/ON Power (geothermal generation — Hellisheiði + Nesjavellir)"
    - "HS Orka (geothermal — Svartsengi + Reykjanes)"
    - "Data centers (Verne Global + Advania + atNorth — cryptocurrency + AI compute)"

  grid_topology_notes:
    isolated_grid: TRUE                         # No submarine interconnector to mainland Europe
    geothermal_generation_share_pct: ~30
    hydro_generation_share_pct: ~70
    wind_share_pct: ~0.5                        # Búrfellslundur pilot only
    renewable_share_pct: 100                    # 🏆 100% renewable — Iceland is world leader
    volcanic_geothermal_correlation: HIGH       # Reykjanes 2021-2023 volcanic activity impacts Svartsengi + HS Orka

# ── Convention #78 BINDING 5th enforcement (post-Greece cumulative) ─────

convention_78_binding_5th_enforcement:
  enforcement_number: 5
  cumulative_7_country_hits_pre_iceland: 20514
    # Latvia 1 + Estonia 20 + Latvia 143 + Slovakia 615 + Czechia 5178 + Poland 14449 + Greece 108
  expected_iceland_alias_hits: 200-800
    # LOWER than Greece (108) or Czechia (5178) due to smaller fleet + Icelandic
    # script normalisation dominant class; single-generation Landsnet rebrand
  cumulative_8_country_hits_post_iceland: 20714-21314
  cadence_precedent_ratio_post_iceland: 2071-2131x above 10-instance BINDING threshold
  status_signal: "Convention #78 BINDING continues cohort-wide adoption — 5th enforcement"

  alias_class_distribution_estimated:
    icelandic_script: HIGH                     # 🆕 NEW class cohort-wide — Þ (thorn) + ð (eth) + æ + ö
      # Landsnet has no Icelandic-only chars; Veitur/RARIK/HS Veitur normal Latin
      # BUT captives like Norðurorka + Orkubú Vestfjarða use ð + ö
    latin_transliteration: MODERATE            # d for ð + oe for ö + ae for æ + th for Þ
    legal_form_variants:                        # Icelandic hlutafélag
      - "hf."                                   # hlutafélag (LLC)
      - "hf"                                    # Without period
      - "ohf."                                  # opinbert hlutafélag (public LLC)
      - "ohf"
    diacritics_class: HIGH                      # á é í ó ú ý (acute accents on vowels)
    predecessor_rebrand_alias_classes:
      landsvirkjun_pre_2005: LOW               # Small class (few tags predate 2005 rebrand)
      hitaveita_sudurnesja_pre_2008: MODERATE  # HS Veitur predecessor still tagged
      rafmagnsveitur_rikisins_pre_2006: LOW    # RARIK predecessor (few subs still tagged)
    orkubu_vestfjarda_westfjords_isolation: LOW  # Small isolated peninsula operator

  new_sub_convention_candidate_status:
    scope: >
      Icelandic script normalisation would be a NEW alias class cohort-wide
      (5th class after Greek + Cyrillic + typographic quotes + comma-legal-
      form). Cumulative Wave 2/3 multi-script coverage would expand:
      Latin (all countries) + Cyrillic (Czechia/Slovakia + Ukrainian minority
      Poland) + Greek (Greece) + Icelandic (Iceland) + Korean/Japanese
      (deferred East Asian Wave 3).

