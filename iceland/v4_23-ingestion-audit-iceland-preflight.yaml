convention_78_4bis_5_layer_3_geofence:
  status: LIKELY_REQUIRED
  target_region: Reykjavík Capital Region (Höfuðborgarsvæðið)
  layer_3_geofence_bbox: [64.05, 64.20, -22.05, -21.70]   # Rough Reykjavík metro
  rationale: >
    Veitur (DSO) operates Capital Region distribution while Landsnet
    (TSO) has HV substations in Reykjavík metro area. Both entities
    coexist geographically — voltage-class threshold alone may not
    disambiguate. Prague precedent (Czechia PRE distribuce Layer 3
