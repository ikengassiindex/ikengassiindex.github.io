    lat_max: 66.55                               # Northernmost — Grímsey (crosses Arctic Circle)
    lon_min: -24.55                              # Westernmost — Bjargtangar
    lon_max: -13.30                              # Easternmost — Gerpir
  tolerance_km: 5.0                              # PROPOSED — coastline + geothermal + island tolerance
  mode_class: MODE_2_ISOLATED_GRID               # No cross-border legitimate subs
  iceland_specific_considerations:
    - "Iceland is FULLY isolated grid (no submarine interconnector to Europe)"
    - "8 disjoint polygons covering mainland + Grímsey (Arctic Circle island) + Vestmannaeyjar"
    - "Heavily indented fjord coastline (Westfjords + Eastfjords)"
    - "Volcanic + glacial terrain — some geothermal subs at high elevations"
    - "Expected pre-filter substation drift <1% (fully isolated grid — no legitimate outside-polygon subs)"

