# Convention #78 §4bis.5 Layer 3 8TH ENFORCEMENT — Istanbul 3-way
# ---------------------------------------------------------------
convention_78_4bis_5_istanbul_geofence:
  cohort_wide_enforcement_number: 8  # after FI Helsinki 7th
  geofence_architecture: 3_way_metropolitan_split_with_strait_carve_out
  cumulative_enforcement_roster:
    1: Prague CZ (Czechia P20)
    2: Warsaw PL (Poland P21)
    3: EWZ Zurich CH (Switzerland P24)
    4: SIG Geneva CH (Switzerland P24)
    5: Auckland NZ (New Zealand P27)
    6: Copenhagen DK (Denmark P28 — HIGHEST hits 615)
    7: Helsinki FI (Finland P29 — 446 hits)
    8: NEW ISTANBUL TR (Turkey P30 — anticipated LARGEST cohort-wide)
  istanbul_metropolitan_context: |
    Istanbul metropolitan area is the LARGEST cohort-wide urban
    concentration (~16M population; ~19% of Turkish population;
    ~30% of Turkish electricity demand). Bosphorus strait separates
    European side (BEDAŞ ~4.5M customers) from Asian side (AYEDAŞ
    ~3M customers). Three HV crossings connect the two sides via
    Boğaziçi (380 kV AC 1968), FSM (154 kV AC 1993), and Yavuz
    Sultan Selim (500 kV HVDC 2016). BOĞAZİÇİ legacy operator
    name (pre-2013 privatization monolithic operator for entire
    Istanbul) captures Bosphorus-region substations tagged with
    strait proximity OR historical operator identity.
  geofence_bboxes:
    bedas_european_side:
      lat: [40.85, 41.30]
      lon: [28.30, 29.05]
      customers: 4.5M
    ayedas_asian_side:
      lat: [40.85, 41.30]
      lon: [29.05, 30.00]
      customers: 3.0M
    bogazici_strait_carve_out:
      lat: [41.00, 41.20]
      lon: [29.00, 29.15]
      note: Bosphorus HV crossing zone — overlaps both sides
  anticipated_hits: LARGEST_COHORT_WIDE  # +7-8M customer base + 3× DSO carve-outs
  expected_hit_projection: 700_1200  # 1.1-2.0× Denmark 615 HIGHEST

