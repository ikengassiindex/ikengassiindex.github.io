    growth_vs_first_pass_pct: 300.5
    growth_vs_baseline_pct: 38.8
    subs_voltage_inferred: 10487  # 100% of first-pass filtered recovered
    signature: DECISIVE_WIN_ACROSS_EVERY_DIMENSION_✓

  root_cause_confirmed: |
    Iberian OSM community sparse on voltage tags for BOTH lines AND
    substations. Portugal E-REDES ~99% mainland monopoly means most
    subs tagged power=substation + substation=distribution but voltage
    tag omitted. Sweden P32 Option B pattern for lines EMPIRICALLY
    generalises to subs at Iberian scale.

# ---------------------------------------------------------------
# 🌍 Wave 4 architectural finding — Option B is BI-DIRECTIONAL
# ---------------------------------------------------------------
wave_4_architectural_finding_bi_directional_option_b:
  finding_id: WAVE_4_BI_DIRECTIONAL_OPTION_B_LINES_AND_SUBS
  discovery_lineage:
    - Sweden P32: revealed lines-side (Nordic minor_line MV)
    - Portugal P33: revealed subs-side (Iberian substation=distribution MV)
  canonical_wave_4_template_post_portugal:
    lines_side:
      - Include power=minor_line in OSM Overpass query
      - Accept lines without voltage tag with power-class-based defaults:
          minor_line → 20 kV MV rural distribution
          cable no-voltage → 20 kV MV underground urban
          line no-voltage → 60 kV (Portugal) or 130 kV (Nordic) subtransmission
    subs_side:
      - Accept subs without voltage tag with substation-class-based defaults:
          substation=transmission → 220 kV national TSO
          substation=distribution → 30 kV MV distribution
          substation=minor_distribution → 15 kV rural MV
          substation=traction → 25 kV rail electrification
          power=substation generic → 30 kV DSO MV default
    both_sides:
      - Tag inferred entities with `_vi: true` compact flag
      - Suffix resolution_layer with `_voltage_inferred` for audit
      - Preserve Convention #56 visibly-honest degradation end-to-end
  inheritance_priority:
    - Spain P36 (Wave 4, Iberian sibling — direct inheritance)
    - Italy P34 (Mediterranean rural MV — may benefit from subs pattern)
    - France P37 (rural MV ENEDIS + regional — likely benefit both)
    - Germany P38 (rural MV Bayern + Sachsen — likely benefit both)
    - US P39 (rural cooperatives NREC — likely benefit both)
    - Japan P35 (uncertain; OSM tagging density likely higher)
  jurisdictions_completed_via_bi_directional_pattern:
    2: Sweden P32 (lines side established)
    3: Portugal P33 (subs side established — this closure)
  future_countries_MUST_inherit: |
    Any future Wave 4+ country with sparse OSM voltage tagging on
    lines OR subs MUST inherit the appropriate side(s) of Option B.
    Iberian countries (Spain P36) inherit BOTH sides by default.
    Nordic countries inherit lines-side. Central European countries
    depend on empirical inspection at Step 4 first-pass merge.

