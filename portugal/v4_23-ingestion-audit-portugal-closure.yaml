    date: 2026-07-19
    subs_before: 10066
    subs_after_first_pass: 3490
    subs_regression_pct: -65.3
    subs_filtered_no_voltage: 10487
    signature: MASSIVE_SUB_REGRESSION_🚨
    root_cause_hypothesis: |
      First-pass merger required voltage_kv for every substation.
      Iberian OSM community sparse on voltage tags for subs
      (mirrors Sweden P32 line-side pattern).

  hotfix_patch_applied:
    patch_1_extend_option_b_to_subs: |
      Extended _process_subs() voltage inference logic to accept
      no-voltage substations via substation=* tag class:
        substation=transmission → 220 kV REN transmission backbone
        substation=distribution → 30 kV E-REDES MV distribution
        substation=minor_distribution → 15 kV E-REDES MV rural
        substation=traction → 25 kV Infraestruturas de Portugal rail
        power=substation generic → 30 kV E-REDES MV default (99% mainland)
      Each inferred sub carries `_vi: true` compact flag per
      Convention #56 visibly-honest degradation.
    patch_2_sidecar_audit_extension: |
      Added portugal_p33_hotfix_option_b_extended_to_subs block to
      merge sidecar exposing subs_voltage_inferred_count + per-class
      voltage inference defaults + cohort-wide architectural finding.

  hotfix_recovery_signal:
