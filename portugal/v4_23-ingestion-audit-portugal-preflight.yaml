# ---------------------------------------------------------------
# Convention #78 §4bis.5 Layer 3 — NOT REQUIRED for Portugal
# ---------------------------------------------------------------
convention_78_4bis_5_layer_3_geofence:
  required: false
  rationale: |
    Portugal is a SINGLE-DSO jurisdiction (E-REDES ~99% mainland market
    share). No metropolitan 2-way DSO split exists. Lisboa + Porto +
    Coimbra + Braga + Faro + Setúbal all serviced by E-REDES exclusively.
    Açores + Madeira are separate ISLANDED DSOs (EDA + EEM) but these
    are archipelago-wide not metropolitan geofences — resolved via bbox
    layer, not §4bis.5 layer.

    Compare to:
    - Convention #78 §4bis.5 9th London UK: 4-way TSO+DNO/UKPN/SPEN/NPG
    - Convention #78 §4bis.5 10th Stockholm SE: 2-way Ellevio+Vattenfall
    - Portugal: NO Layer 3 geofence needed (architectural simplification
      via single-DSO monopoly + islanded archipelago separation)

  cumulative_enforcement_roster_pre_portugal:
    1: Prague CZ (P20)
    2: Warsaw PL (P21)
    3: EWZ Zurich CH (P24)
    4: SIG Geneva CH (P24)
    5: Auckland NZ (P27)
    6: Copenhagen DK (P28 — 615)
    7: Helsinki FI (P29 — 446)
    8: Istanbul TR (P30 — 178)
    9: London UK (P31 — 1994 LARGEST)
    10: Stockholm SE (P32 — 24)
  portugal_signature: SINGLE_DSO_ARCHITECTURAL_SIMPLIFICATION_NO_4BIS_5_LAYER

# ---------------------------------------------------------------
# Discipline #36 cross-border tolerance
# ---------------------------------------------------------------
discipline_36_tolerance:
  boundary_tolerance_km: 6.0
  entry_added_to: cross_border_tolerances.json
  rationale_summary: |
    Highest Wave 4 tolerance (6.0 km) — 60× cadastral default. Justified
    by: (a) 900 km continental Atlantic coastline complexity (Ria Formosa
    + Sado + Tejo + Douro estuaries + Costa Vicentina cliffs); (b)
    Açores 9-island archipelago 1,400 km mid-Atlantic offshore extension;
    (c) Madeira archipelago + Selvagens islands ~1,000 km sub-tropical
    Atlantic; (d) 5 400 kV AC cross-border interconnectors with Spain
    at strategic positions along 1,214 km land border.
  expected_drops_estimate:
    subs: 100_300
    lines: 50_150

# ---------------------------------------------------------------
# Discipline #41 line-substation parity target
# ---------------------------------------------------------------
discipline_41_parity_target:
  baseline_pre_enhancement: 1.10  # BELOW_HEALTHY_BAND already
  target_ratio_min: 1.5
  target_ratio_max: 5.0
  anticipated_signature_post_sweden_option_b_inheritance: HEALTHY_BAND
  rationale: |
    Portugal baseline parity 1.10 is BELOW_HEALTHY_BAND (below 1.5
    threshold) — indicates baseline was already sub-heavy topology
    with insufficient line coverage. Sweden P32 Option B inheritance
    (minor_line + no-voltage inference) MUST substantially grow line
    coverage. Post-Option-B target ratio 2-4 HEALTHY_BAND ✓.

