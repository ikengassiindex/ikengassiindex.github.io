# ---------------------------------------------------------------
# Wave 4 architecture requirements (Sweden P32 Option B inheritance)
# ---------------------------------------------------------------
wave_4_architecture_requirements:
  merger_schema_target: canonical_compact_s_l_a
  osm_overpass_query_hints:
    substations: out center
    lines: out geom
  sweden_p32_option_b_inheritance:
    include_power_minor_line: true  # NORDIC pattern; MUST inherit
    accept_no_voltage_with_inference: true  # NORDIC pattern; MUST inherit
    voltage_inference_defaults_kv:
      minor_line: 20.0  # rural MV distribution wooden-pole
      cable_no_voltage: 20.0  # underground urban MV
      line_no_voltage: 60.0  # PORTUGAL SPECIFIC subtransmission
      # NOTE: Portugal uses 60 kV for regional subtransmission
      # rather than Nordic 130 kV. Sweden 130 default overridden.
    compact_flag: _vi
  merger_operations_required:
    - substation_id_assignment
    - line_id_assignment
    - polyline_conversion_to_compact_p_array
    - line_endpoint_ss_se_matching_string_ids
    - adjacency_graph_construction
    - grid_based_spatial_index_for_large_N_merges
    - bbox_split_fallback_if_single_bbox_fails
  compact_schema_write: via_scripts_pipeline_utils_grid_geo_sharding_write_grid_geo

