empirical_finding_of_note:
  finding: >
    OSM Slovenia empirically does NOT populate ref:nuts:3 tag on power=substation
    elements. Zero of 1,825 fetched subs carried NUTS-3 code. This empirical
    discovery drove the mid-workstream Layer 3 lat/lon geofence hotfix (commit
    c54f1762). The NUTS-3 map layer (Layer 2) is preserved as a forward-compat
    surface for future OSM ingestion or per-tenant enrichment.
  implication: >
    Any future country whose NUTS-3 codes aren't populated in OSM must include
    a lat/lon geofence as Layer 3. The pattern generalises via country-specific
    DSO territory bounding boxes with priority ordering.

lessons_generalised:
  - >
      **Empirically-validated resolver stack**: Layer 1 TSO voltage threshold +
      Layer 2 NUTS-3 map (forward-compat) + Layer 3 lat/lon geofence (primary in
      Slovenia's case) + Layer 4 unresolved fallback (Convention #56). Four-layer
      priority pattern is now the canonical region-jurisdiction × voltage-class
      template for future countries.
  - >
      **Priority ordering matters for overlap zones**: Trbovlje (46.15°N, 15.05°E)
      is Zasavska (Elektro Ljubljana) but sits inside Celje's default bbox. Only
      priority ordering (most-specific first + tightening Celje's north-south
      bounds to 46.20-46.40°N) resolves the seam without misattributing.
  - >
      **Edge extensions catch canton-level corners**: Alpine Goriška (Bovec/Kobarid
      NW alpine strip) + Prlekija E strip (Kidričevo) + Golte wolf's tooth (Upper
      Savinjska west of 14.90°E) + Kočevje SW extremity — each edge extension
      catches a single-canton peculiarity that basic bbox misses. 27/27 city
      validation tests PASS end-to-end.
  - >
      **Task #182 line-density outlier retired**: Slovenia's baseline ratio 27.9
      collapsed to 2.61 post-merge because OSM's fresh line data provided the
      right transmission-tier scope (baseline had MV deep-ingestion carrying
      most weight; OSM's line query returned mostly transmission-tier). Norway
      remains the sole outstanding task #182 outlier.
  - >
      **99.7% owner coverage validates the region-jurisdiction × voltage-class
      pattern at 5 empirical instances** (Belgium + Netherlands + Hungary +
      Chile-lat-band variant + Slovenia). Pattern is now empirically mature.

