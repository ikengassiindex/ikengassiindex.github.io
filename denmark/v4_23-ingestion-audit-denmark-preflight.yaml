# ---------------------------------------------------------------
# Voltage-class × multi-DSO resolver
# ---------------------------------------------------------------
voltage_class_dso_resolver:
  pattern: MULTI_LAYER_TSO_PLUS_METRO_GEOFENCE_PLUS_REGIONAL_DSO
  layers:
    - name: Energinet TSO threshold
      condition: voltage_kv >= 132
      attribution: Energinet
      priority: 1
      note: Danish transmission tiers 400/150/132 kV all Energinet TSO
    - name: HVDC interconnector terminals
      condition: voltage_kv in [350, 275] AND name matches ['Skagerrak', 'Kriegers Flak', 'Kontek', 'Öresund', 'Konti-Skan']
      attribution: Energinet HVDC
      priority: 2
    - name: Offshore wind terminals (name-match)
      condition: name matches ['Horns Rev', 'Anholt', 'Kriegers Flak', 'Vesterhav', 'Rødsand', 'Nysted', 'Middelgrunden']
      attribution: <offshore operator or Energinet>
      priority: 3
      note: Offshore wind farm substations — direct OSM tag usually captures operator
    - name: Banedanmark rail traction (25 kV AC)
      condition: voltage_kv == 25 AND name contains rail_context
      attribution: Banedanmark
      priority: 4
    - name: Copenhagen §4bis.5 geofence (Radius Elnet metropolitan)
      condition: region == 'Hovedstaden' AND voltage_kv < 132
      sub_layers:
        - condition: lat >= 55.55 AND lat <= 55.80 AND lon >= 12.30 AND lon <= 12.70
          attribution: Radius Elnet
          note: Copenhagen city + Frederiksberg metropolitan geofence
        - condition: fallback (Hovedstaden region catch-all)
          attribution: Radius Elnet
          note: Radius covers entire Hovedstaden region + Bornholm
      priority: 5
    - name: Zealand → Cerius
      condition: region in ['Sjælland'] AND voltage_kv < 132
      attribution: Cerius
      priority: 6
    - name: Jutland major (Nordjylland + Midtjylland) → N1
      condition: region in ['Nordjylland', 'Midtjylland'] AND voltage_kv < 132
      attribution: N1
      priority: 7
      note: Requires soft-boundary Layer 3 sub-cascade for AURA + Konstant + Dinel Aarhus metropolitan carve-outs
    - name: Southern Jutland + Fyn → Trefor
      condition: region == 'Syddanmark' AND voltage_kv < 132
      attribution: Trefor
      priority: 8
    - name: Energinet catch-all (safety net)
      condition: fallback
      attribution: Energinet
      priority: 9  # LAYER 6 CATCH-ALL

# ---------------------------------------------------------------
# Region → dominant DSO map (5 admin regions × 4 major DSOs + 3 minor)
# ---------------------------------------------------------------
region_to_dso_map:
  Hovedstaden: Radius Elnet    # Copenhagen + Frederiksberg + North Zealand
  Sjælland: Cerius             # Central+South Zealand
  Nordjylland: N1              # North Jutland (Aalborg)
  Midtjylland: N1              # Central Jutland (Aarhus)
  Syddanmark: Trefor           # South Jutland + Funen

# ---------------------------------------------------------------
# Convention #78 §4bis.5 Layer 3 geofence assessment
# ---------------------------------------------------------------
layer_3_geofence:
  enforcement_needed: true  # 6TH COHORT-WIDE ENFORCEMENT EXPECTED
  rationale: |
    Hovedstaden region (808 subs — LARGEST region) requires
    metropolitan geofence to disambiguate Copenhagen city core
    from suburbs. Radius Elnet is dominant DSO across entire
    Hovedstaden region PLUS Bornholm. Metropolitan geofence
    ensures Copenhagen CBD attribution regardless of alternative
    regional DSOs (rare).

    Cumulative Convention #78 §4bis.5 enforcement expected to grow
    to 6:
    - Prague CZ (Czechia P20)
    - Warsaw PL (Poland P21)
    - EWZ Zurich CH (Switzerland P24)
    - SIG Geneva CH (Switzerland P24)
    - Auckland NZ (New Zealand P27)
    - NEW: Copenhagen DK (Denmark P28)

    Alternative consideration: Aarhus metro (AURA vs N1 boundary)
    could warrant additional geofence at Layer 3 sub-cascade if
    empirical evidence shows DSO ambiguity. Keeping metropolitan
    geofence to Copenhagen only for empirical parsimony; extend
    retroactively if Step 4 shows Aarhus attribution ambiguity.
  proposed_enforcement:
    copenhagen_radius_geofence:
      lat_min: 55.55
      lat_max: 55.80
      lon_min: 12.30
      lon_max: 12.70
      attribution: Radius Elnet
      note: Copenhagen + Frederiksberg metropolitan core

# ---------------------------------------------------------------
# Discipline #36 cross-border filter (EXISTING DK ENTRY)
# ---------------------------------------------------------------
discipline_36:
  boundary_tolerance_km: 5.0  # existing entry from Mode 2 remediation
  existing_tolerance_source: cross_border_tolerances.json
  rationale_existing: |
    Coastal + offshore-wind territorial-waters allowance. 105 of
    123 audit outliers within 5 km coastline tolerance. Remaining
    18 outliers between 5-34 km include offshore wind transformer
    platforms (Anholt Havmøllepark in Kattegat, Horns Rev North
    Sea). Offshore wind platforms are legitimate Danish substations
    in Danish EEZ; explicit allowance pending bounds.json maritime
    polygon extension in Phase 2.
  cross_border_interconnectors: 4  # Skagerrak Norway + Kontek Germany + Öresund Sweden + Kriegers Flak Germany
  interconnector_terminals_expected_preserved:
    - Skagerrak DC × 4 (Norway)
    - Kontek HVDC (Germany)
    - Kriegers Flak HVDC (Germany + Sweden)
    - Öresund AC (Sweden)
    - Konti-Skan HVDC legacy (Sweden — decommissioned but historical infrastructure)
  faroe_greenland_pre_excluded: true  # separate country entries in ssi-index
  expected_pre_filter_drift_pct: 1.0  # LOW (existing tolerance validated)

# ---------------------------------------------------------------
# Discipline #41 line parity target
# ---------------------------------------------------------------
discipline_41:
  target_ratio_range: [1.5, 5.0]  # Healthy band
  baseline_line_count: null  # to be captured from grid-geo.json at Step 4
  projection: |
    Denmark transmission grid: ~7,000 km Energinet 400/150/132 kV
    Denmark distribution grid: ~150,000 km MV/LV across ~50 DSOs
    Baseline captures MV/LV (10 kV dominant); OSM captures full
    distribution. Expected line-substation ratio HEALTHY-to-
    ELEVATED (3-15×) — between Nordic-analog (Iceland/Korea 3.30)
    and Ireland/NZ 46+ ELEVATED depending on OSM community MV/LV
    tagging completeness.

# ---------------------------------------------------------------
# Data sources (OSM Overpass + Energinet + Dansk Energi ENA public)
# ---------------------------------------------------------------
data_sources:
  primary:
    - name: OpenStreetMap
      endpoint_pool:
        - overpass-api.de
        - kumi.systems
        - private.coffee
      query_type: substations + power lines
      license: ODbL
      convention_60_compliant: true
  cross_reference:
    - name: Energinet Annual Report 2024
      url: https://en.energinet.dk/
      purpose: TSO backbone verification (400/150/132 kV + 4 HVDC interconnectors)
      convention_60_compliant: true  # State-Owned Enterprise
    - name: Dansk Energi ENA (Electricity Network Association)
      url: https://www.danskenergi.dk/
      purpose: DSO registry + regional coverage cross-check
      convention_60_compliant: true  # Public industry association
    - name: Danmarks Statistik
      url: https://www.dst.dk/
      purpose: 5 regions + 98 municipalities boundary + demographic context
      convention_60_compliant: true  # Public statistics agency
    - name: Klima- Energi- og Forsyningsministeriet
      url: https://kefm.dk/
      purpose: Climate Act 2020 + Net Zero 2050 statutory context
      convention_60_compliant: true

# ---------------------------------------------------------------
# Convention #56 hazard baselines (Phase 4c prep)
# ---------------------------------------------------------------
convention_56_hazard_baselines:
  flood: 0.55        # Coastal storm surge (Sankt Jakobstormen 2013 + Bodil 2013 + Malik 2022) + North Sea storms
  wildfire: 0.10     # LOW — moist maritime climate; occasional heath fires
  winter: 0.40       # MOD — Baltic storm gusts + occasional cold snaps + snow load
  adapt: 0.85        # HIGHEST cohort-wide — Denmark = world's first Net Zero 2050 statutory (Climate Act 2020) + wind 55% electricity 2024 + Ministry of Climate structural + green transition frontrunner
  compound: 0.45     # Storm + coastal flood clusters + wind curtailment cascades
  just: 0.55         # MOD-HIGH — coal phaseout 2030 + Esbjerg oil transition + Aalborg cement decarbonization + Just Transition Fund €90M
  sources:
    - JRC EU-Flood-Atlas (coastal + fluvial North Sea + Kattegat)
    - Copernicus (wildfire monitoring — LOW baseline)
    - ECMWF ERA5 (winter storm gust climatology)
    - ND-GAIN adaptation index (Denmark rank ~1/181, 2024 — GLOBAL LEADER)
    - IPCC AR6 Europe chapter (Baltic + North Sea storm projection)
    - Danish Climate Act 2020 statutory Net Zero 2050
    - Just-Transition Fund €90M Danish allocation (Esbjerg + Aalborg + coal)
    - DMI (Danish Meteorological Institute) storm climatology

