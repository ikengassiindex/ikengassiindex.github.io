[pytest]
# SSI Pipeline — pytest configuration
# Introduced in Phase 1 PR-1 per PHASE_1_IMPLEMENTATION_PLAN.md.

# Discover tests in tests/ directory
testpaths = tests

# Test file naming convention
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Add the repo root to sys.path so tests can do
#   `from scripts.pipeline.scoring.modifier_registry import ...`
# (this also happens in conftest.py but pythonpath here covers
#  invocations that don't load conftest.py for some reason)
pythonpath = .

# Show extra test summary info: pass/fail counts, warnings, etc.
addopts =
    -ra
    --strict-markers
    --tb=short

# Treat unregistered marker warnings as errors
filterwarnings =
    error::pytest.PytestUnknownMarkWarning

# Markers for slow / integration / unit tests
markers =
    unit: Pure unit tests (fast, no I/O)
    integration: Integration tests (touches files, slower)
    slow: Slow tests (>1 second, may be skipped in CI quick mode)
