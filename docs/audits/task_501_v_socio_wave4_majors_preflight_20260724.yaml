# ═══════════════════════════════════════════════════════════════════════════
#  OPERATOR LOCAL PREP CHECKLIST
# ═══════════════════════════════════════════════════════════════════════════

operator_local_prep:
  - name: verify_eurostat_shapefile_present
    action: "ls ~/eurostat_gisco_nuts3_2024/NUTS_RG_01M_2024_4326.shp"
    status: "REUSED from Task #453/#454"
  - name: download_gadm_usa
    action: "curl -O https://geodata.ucdavis.edu/gadm/gadm4.1/shp/gadm41_USA_shp.zip && unzip"
    target_dir: "~/gadm41_USA_shp/"
    approx_size: "~30MB"
  - name: download_gadm_jpn
    action: "curl -O https://geodata.ucdavis.edu/gadm/gadm4.1/shp/gadm41_JPN_shp.zip && unzip"
    target_dir: "~/gadm41_JPN_shp/"
    approx_size: "~15MB"
  - name: pilot_dry_run_france
    action: "python3 scripts/pipeline/enrichment/socio_economic_backfill.py --polygon-slug france --dry-run"
    gate: "Gate B — validate polygon-shapefile CRS + CSV column names + admin-code emission before cohort apply"
  - name: cohort_apply
    action: "python3 scripts/pipeline/enrichment/socio_economic_backfill.py --polygon-cohort france germany spain portugal sweden us japan"
    expected_wall_clock: "~30-60 seconds (5 EU + 2 non-EU, largest cohort at DE 400 NUTS-3 × 187,714 subs)"

