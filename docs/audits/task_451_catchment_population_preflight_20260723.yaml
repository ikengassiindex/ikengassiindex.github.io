# ── Root cause of synthetic values ───────────────────────────────────────

synthetic_generator_root_cause:
  source_file: scripts/score-country.py
  line_number: 195
  code_snippet: |
    'population': int(det_var(seed+'pop', ref.get('pop_density',50)*25, 0.40)),
  mechanism: |
    Deterministic-variance function `det_var(seed, base, pct)` (line 85)
    generates synthetic values from a per-country `pop_density` reference
    multiplied by 25 with 40% variance. The `seed` argument makes values
    reproducible per substation but the values are NOT sourced from
    real population data.

  convention_56_violation: |
    Convention #56 visibly-honest degradation requires that unpopulated
    fields surface as None or `[N/A]` markers, not as fabricated values.
    The synthetic-population generator violates this by producing
    data-shaped values that look real to downstream consumers
    (esg-sections.js R2 report + LP-DD deliverables) but aren't.

  scope_context: |
    Sister to the pre-existing Wave 4 per-substation interpolation
    regression class (Task #117/#159/#450 D2 modifier drift). Same
    architectural anti-pattern applied at the R2 Grid Equity axis rather
    than R6c_flood/R7_cyber axis. Task #450 SYSTEMIC parent closed 23 Jul
    2026 documenting this class; this Task #451 pre-flight extends the
    inventory to R2 axis.

  pipeline_gap: |
    scripts/pipeline/ingestion/socioeconomic.py::overlay_socioeconomic()
    line 452+ constructs the socio_economic dict but explicitly does NOT
    include population field. The socioeconomic cache
    (scripts/pipeline/.cache/socioeconomic_*.json) carries
    gdp_per_capita + unemployment_rate + elderly_pct + ep_rate +
    migration_score — but NO population key. So the modern pipeline
    doesn't emit population at all; the values in ssi-data.json come from
    the legacy score-country.py script that appears to have been run
    inconsistently across countries.

# ── Three-path decision matrix ───────────────────────────────────────────

decision_matrix:
  path_A_real_data:
    name: Retire synthetic + build GHSL Population Grid spatial-join pipeline
    steps:
      - Retire scripts/score-country.py population line 195
      - Source GHSL Population Grid raster (EC JRC open license, 100m resolution)
      - Build scripts/pipeline/enrichment/catchment_population.py utility
      - Author spatial-join with configurable radius (default 5km per methodology)
      - Apply per-substation across all 39 countries
      - Retroactively rescore 30 currently-synthetic countries + 9 currently-None
      - Author sentinel scripts/tests/test_catchment_population_coverage.py
      - Update esg-sections.js R2 audit validity paragraph with post-fix state
      - Doc cascade to CLAUDE.md + Foundation KB
    engineering_estimate: 5-8 engineer-days
    convention_56_posture: FULLY COMPLIANT — real data from public canonical
    lp_dd_defensibility: HIGH — GHSL is EC JRC-anchored open license
    convention_7_alignment: YES — GHSL is the archetypal Data-Layer Anchoring documented-proxy
    downside: dedicated engineering sprint, multi-session
    upside: methodologically correct; retires legacy synthetic-generator class
    operator_recommendation: THIS ONE

  path_B_extend_synthetic:
    name: Extend synthetic generator to 9 missing countries for consistency
    steps:
      - Add 9 missing countries to score-country.py country reference table
      - Re-run score-country.py against 9 countries
    engineering_estimate: 2-3 hours
    convention_56_posture: VIOLATION — perpetuates fabricated-data-shape anti-pattern
    lp_dd_defensibility: LOW — LP-DD reviewer notices any careful cross-check
    downside: technical debt masquerading as progress; expands surface of Convention #56 violation
    upside: (none material)
    operator_recommendation: DO NOT PURSUE

  path_C_retire_to_none:
    name: Retire 30 synthetic countries to None + document as pending-L4-wiring
    steps:
      - Author scripts/task_451_retire_synthetic_population.py idempotent script
      - Set socio_economic.population = None for all 30 currently-synthetic countries
      - Update esg-sections.js R2 audit validity paragraph to reflect post-retirement state
      - Doc cascade minimal (methodology.html tooltip)
    engineering_estimate: 1 hour
    convention_56_posture: FULLY COMPLIANT — visibly-honest gap surfaced consistently
    lp_dd_defensibility: MEDIUM — honest empty state readable as "field pending L4 wiring"
    downside: temporarily degrades R2 reports for 30 currently-populated countries
    upside: clean interim state; zero technical debt; fast to ship
    operator_recommendation: INTERIM state if Path A pushed to Q4 2026

  operator_selection:
    selected_path: A
    selection_date: 2026-07-23
    selection_rationale: |
      Methodologically correct + LP-DD defensible + aligns with Convention #7
      Data-Layer Anchoring pattern. Full engineering sprint accepted; Path C
      not chosen because operator prefers real-data build rather than clean-
      then-defer.

