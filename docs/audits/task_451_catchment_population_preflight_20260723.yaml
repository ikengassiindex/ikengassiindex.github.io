# ── Reframing the task scope ─────────────────────────────────────────────

reframing:
  original_task_description: |
    "R2 Defect Class 2 — Catchment population field missing (9 countries)"
    Original scope estimate: 9 countries need field wired.
    Original engineering estimate: 5-8 engineer-days for GHSL spatial-join pipeline.

  empirical_pre_flight_finding: |
    Field name is `socio_economic.population` (NOT `catchment_population`).
    Empirical audit reveals the honest picture is OPPOSITE to task description:
      - 30 countries have SYNTHETIC values written by scripts/score-country.py
        line 195 via deterministic-variance generator
      - 9 countries (austria + 8 Wave 4: france/germany/italy/japan/portugal/
        spain/sweden/us) legitimately have None — these are the countries
        score-country.py was NEVER run against, so they're Convention #56
        visibly-honest defaults
    The 30 "populated" countries have data that shouldn't be trusted for LP-DD
    purposes. This is the pre-existing Wave 4 per-substation interpolation
    regression pattern (Task #117/#159/#450 D2 class) manifesting at the
    R2 Grid Equity axis.

  reframed_scope:
    what_task_actually_is: |
      Retire synthetic-population generator + build proper real-data spatial
      join pipeline + retroactively rescore 30 currently-synthetic countries
      + wire 9 currently-None countries with same real-data source.
    engineering_estimate_revised: |
      Path A execution: 5-8 engineer-days (as originally estimated) — but
      scope is 39 countries rescore, not 9. The delta is that 30 countries
      currently-populated must ALSO be rescored to retire synthetic values.

