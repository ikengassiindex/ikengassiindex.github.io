  purpose: >
    Task #452 was pre-scoped in Task #451 pre-flight as "R2 Defect Class 3
    — migration_score missing for ~20 countries". Empirical scan revealed
    the picture is more complex than the pre-scope suggested. Three classes:

  cohort_empirical_state:
    all_populated_countries: 10   # 796k subs across 10 countries have SOME value
    all_none_countries: 19        # ~135k subs have None (never populated)
    partial_coverage_countries: 10  # mixed within-country
    total_populated_subs: 641_000  # approx
    total_none_subs: 155_000       # approx (~19.5% of 796,121 cohort)

  wave_4_majors_fleet_uniform_signature:
    countries: [france, germany, portugal, spain, sweden, us, japan, australia]
    value: 0.5   # SINGLE fleet-uniform national scalar per Task #450 SYSTEMIC
    unique_values_per_country: 1
    note: >
      These 8 countries carry an identical 0.5 value per every substation
      cohort-wide — clean Task #450 SYSTEMIC signature. The socioeconomic.py
      pipeline emits national scalar when per-substation NUTS-3 join fails.
      Path C's raster enrichment will replace this with per-substation values.

  per_country_semantic_drift:  # MAJOR finding
    denmark_range: [-0.020, +0.040]  # tiny scale — looks unrescaled
    mexico_range: [-5.0, +8.0]       # percent-scale — different unit!
    italy_range: [-5.0, -5.0]         # fleet-uniform miscoded fallback
    norway_range: [+0.010, +0.982]   # correct [0,1] normalized
    lithuania_range: [+0.162, +0.990]
    ireland_range: [-0.120, +0.780]  # spans zero, includes negative
    new_zealand_range: [-0.390, +0.330]
    canonical_intended_range: [0.0, 1.0]  # inferred from Norway + 0.5 fallback

  no_synthetic_generator_to_retire:
    score_country_line_195_analog: absent
    note: >
      Unlike Task #451, `scripts/score-country.py` does NOT synthesize
      migration_score anywhere. Path C is pure additive enrichment —
      no retire-with-tombstone step needed for score-country.py.
      (However see `scope_decision.existing_values_normalization` below —
      the DRIFTED existing values are their own separate problem.)

  modern_pipeline_source:
    file: scripts/pipeline/ingestion/socioeconomic.py
    inputs:
      - eurostat_nuts3_socioeconomic.csv (27 EU + adjacent countries)
      - agency_regional_socioeconomic.csv (non-EU nations)
      - oecd_national_socioeconomic.csv (fallback)
    note: >
      Pipeline knows how to derive migration_score BUT falls back to 0.5
      national scalar for Wave 4 majors. Path C bypasses the pipeline's
      fallback path entirely by writing enriched values directly.


# ═══════════════════════════════════════════════════════════════════
#  2. STRUCTURAL DIFFERENCES vs Task #451 (catchment_population)
# ═══════════════════════════════════════════════════════════════════

structural_differences_vs_task_451:

  - concept:  "STOCK (population count) vs FLOW (net migration rate over time period)"
    consequence: >
      Migration is a rate, not a count. Zonal-sum a raster of migration
      rates makes NO sense (rates don't sum). Instead: zonal-mean (weighted
      by population) OR sample raster value at substation point coordinates.

  - concept:  "5 km catchment definition"
    consequence: >
      For population #451: catchment = 5 km buffer, zonal SUM
      For migration #452: catchment = 5 km buffer, zonal MEAN (weighted by
      GHSL population — reuse from #451 as denominator!). Or single-point
      sample if simpler.

  - concept:  "Raster resolution"
    consequence: >
      GHSL population: 30 arc-sec (~1 km). Niva migration: 5 arc-min (~10 km).
      Niva's 10 km pixels are LARGER than the 5 km catchment buffer — most
      buffers will intersect ~1-4 Niva pixels. This is fine for a signal but
      substation-level differentiation within the same ~10 km neighborhood
      will be zero. Acceptable per authors' recommendation "aggregate over
      larger area".

  - concept:  "Temporal vintage"
    consequence: >
      Niva covers 2000-2019 (5 years old at cohort target 2025). Author-
      recommended aggregate is 20-year sum (2000-2019). Not a real-time
      signal — acceptable proxy per Convention #7 documented-proxy.

  - concept:  "Retire synthetic vs additive enrichment"
    consequence: >
      #451 RETIRED score-country.py line 195 synthetic. #452 has NO
      synthetic to retire. Task #452's shape is pure enrichment.

  - concept:  "Range mapping"
    consequence: >
      Niva outputs persons per 1000 per 20-year period. Pipeline expects
      migration_score in [0, 1] range where 0.5 = neutral. NEW STEP
      required: raster-value → [0, 1] normalization formula. See
      `range_mapping_spec` below.


