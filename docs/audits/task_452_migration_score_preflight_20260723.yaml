# ═══════════════════════════════════════════════════════════════════
#  5. SEMANTIC CLARIFICATION — Range mapping spec
# ═══════════════════════════════════════════════════════════════════

range_mapping_spec:
  raw_raster_units: "persons per 1000 people per 20-year period"
  raw_raster_typical_range: "[-500, +500]"  # empirical, Niva paper Fig 1
  raw_raster_extreme_range: "[-1000, +2000]"  # empirical extreme outliers

  target_range: "[0, 1]"
  target_convention:
    0.0: "extreme net out-migration (population loss)"
    0.5: "neutral (no net migration)"
    1.0: "extreme net in-migration (population gain)"

  proposed_mapping_formula: |
    # Symmetric hyperbolic tangent squash — centered at zero, saturates
    # smoothly at [0, 1] extremes. Prevents extreme outliers from
    # dominating the [0, 1] scale while preserving order + magnitude.
    #
    # Reference constant K = 200 persons/1000/20yr = author-empirical
    # "moderate net migration" (Niva 2023 Fig 2 histogram median for
    # non-zero cells) → maps to score ~0.75 (in-migration) or ~0.25 (out).
    def raster_to_score(raw_persons_per_1000_per_20yr):
        K = 200.0
        return 0.5 + 0.5 * math.tanh(raw_persons_per_1000_per_20yr / K)

  alternatives_considered:
    - "Linear normalize by percentile [P5, P95] — sensitive to outliers"
    - "Sigmoid instead of tanh — same behavior, different constants"
    - "Absolute-value tanh — loses direction info; rejected"

  gate_a_operator_decision_needed:
    - "Confirm target [0, 1] range vs alternatives"
    - "Confirm 0.5 = neutral (in line with Wave 4 majors' current fallback)"
    - "Confirm tanh(x/200) formula or specify alternative"
    - "Confirm using 20-yr sum (vs 5-yr sum with 4 windows averaged)"


# ═══════════════════════════════════════════════════════════════════
#  6. SCOPE DECISION — Fill-Nones-only vs also-normalize-existing
# ═══════════════════════════════════════════════════════════════════

scope_decision:
  # This is a MONSTER-avoidance decision. Choosing narrowly closes R2 D3
  # defect only. Choosing broadly ALSO closes the semantic drift picture
  # but risks scope creep into Task #450 SYSTEMIC.

  proposed_scope: NARROW    # fill Nones only, leave existing values intact
  proposed_scope_rationale: >
    Narrow scope closes R2 Defect Class 3 as originally scoped. The
    per-country semantic drift (Denmark rescale, Mexico rescale, Italy
    fleet-uniform, Wave 4 majors 0.5 fallback) is Task #450 SYSTEMIC scope
    and deserves its own workstream. Bundling both into #452 risks
    monster-creep AND blurs the Task #451/#452 sibling pattern which was
    exclusively "close R2 Defect Class N".

  narrow_scope_deliverable:
    "Enrich the 155,000 currently-None substations with Niva-derived
     migration_score in [0, 1] range. Leave existing 641,000 populated
     values untouched (including the 8 Wave 4 majors' 0.5 fleet-uniform
     fallback + Denmark's tiny [-0.02, +0.04] values + Mexico's [-5, +8]
     values + Italy's -5.0 fleet-uniform). These persist as visible drift
     signal per Convention #56."

  gate_a_operator_decision_needed:
    - "Confirm NARROW scope (recommended) — fill Nones only"
    - "OR confirm WIDE scope — also normalize existing values into [0, 1]"

  wide_scope_risk_if_chosen:
    - "Overwrites values that some downstream consumer may rely on"
    - "Changes cohort-wide distribution shape → downstream reruns needed"
    - "Duplicates Task #450 SYSTEMIC scope"


# ═══════════════════════════════════════════════════════════════════
#  7. RISK INVENTORY — 8 items × mitigation × sentinel
# ═══════════════════════════════════════════════════════════════════

risk_inventory:

  - id: R1
    risk: "Zenodo download fails or is slow (338 MB total, 10.5 MB for canonical)"
    likelihood: "low"
    impact: "blocks Step 4"
    mitigation: >
      Download to local Mac (residential IP + normal bandwidth) rather
      than sandbox. Same pattern as Task #451 GHSL. If Zenodo unreachable:
      fallback to GitHub mirror at github.com/mattikummu/global_net_migration
    sentinel: "diagnose-only mode verifies raster presence + integrity md5"

  - id: R2
    risk: "Raster CRS mismatch or read failure"
    likelihood: "low"
    impact: "blocks Step 3"
    mitigation: >
      Niva is EPSG:4326 (WGS84) — SIMPLER than GHSL Mollweide. Direct
      lat/lon pixel index (no reprojection needed). Fewer pyproj dependencies.
    sentinel: "diagnose-only smoke reads raster + reports shape + bounds"

  - id: R3
    risk: "Range mapping formula produces distributional artifacts"
    likelihood: "medium"
    impact: "distorts downstream R2 scoring"
    mitigation: >
      Gate A operator sign-off on formula + Gate B pilot country
      empirical spot-check with distribution visualization (histogram of
      100 subs before/after mapping). Adjust formula if distribution is
      skewed vs Norway's known-good real distribution.
    sentinel: "post-apply distribution check — every country's populated
               values should have mean in [0.3, 0.7] and stdev > 0.02
               UNLESS country is genuinely uniform"

  - id: R4
    risk: "Convention #56 fallback rate is high (raster gaps in remote areas)"
    likelihood: "medium"
    impact: "many substations get None values"
    mitigation: >
      Niva has global coverage (216 countries) so gap rate should be
      LOWER than GHSL (0.17% for Task #451). Still expect some remote
      subs to fall on NoData pixels (deserts, oceans, protected areas).
    sentinel: "acceptable Convention #56 fallback rate < 1% cohort-wide"

  - id: R5
    risk: "Downstream R2 scoring formula breaks on new mig_score distribution"
    likelihood: "low"
    impact: "R2 scores shift materially cohort-wide"
    mitigation: >
      Gate B empirical spot-check on pilot country compares R2 score
      distribution before/after enrichment. If shift is > 1 band across
      > 20% of subs, halt + investigate.
    sentinel: "R2 band distribution shift check per Task #450/#461 pattern"

  - id: R6
    risk: "Wave 4 majors' fleet-uniform 0.5 gets misinterpreted as populated
           and skipped — 8 countries × 100+k subs left with fake 0.5"
    likelihood: "high (this IS the current state)"
    impact: "R2 defect class 3 remains open for 8 majors"
    mitigation: >
      Two options: (a) NARROW scope leaves 0.5 fallback intact — Task #450
      SYSTEMIC deferred; (b) WIDE scope adds `--override-wave4-fallback`
      flag that specifically targets 0.5-uniform fleets.
    sentinel: "explicit dry-run report shows n_wave4_majors_skipped + note"

  - id: R7
    risk: "Norway/Lithuania/Ireland real distributions accidentally overwritten"
    likelihood: "low (with NARROW scope)"
    impact: "loses genuinely rich per-substation data"
    mitigation: >
      NARROW scope = fill Nones only. force_rewrite flag NOT used.
      Explicit sentinel: no country with genuine per-substation
      distribution has more than 10% of subs overwritten.
    sentinel: "post-apply integrity check on norway/lithuania/ireland/denmark"

  - id: R8
    risk: "Niva 20-yr sum vs cohort target vintage 2025 — 5-year staleness"
    likelihood: "certain (Niva coverage ends 2019)"
    impact: "reader may question temporal alignment"
    mitigation: >
      Convention #7 documented-proxy — cite Niva vintage explicitly in
      audit trail + esg-sections.js narrative. Note 20-yr sum smooths
      inter-annual noise and captures structural rather than current-year
      migration patterns. Acceptable for a 'score' semantic.
    sentinel: "esg-sections.js narrative + CLAUDE.md addendum cite vintage"


