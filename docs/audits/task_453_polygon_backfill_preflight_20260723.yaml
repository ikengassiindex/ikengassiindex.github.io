reframing:
  purpose: >
    Task #453 was pre-scoped in Task #452 pre-flight as "R2 Defect Class 4 —
    major partial socio_economic coverage on Luxembourg 12% / Slovenia 16% /
    Colombia 51% / Lithuania 50%; failed spatial joins upstream; requires per-
    country diagnosis". Step 1 (per-field × per-country audit) + Step 2a
    (empirical OSM tag-density probe) revealed a bigger scope than the
    pre-scope suggested. Provenance-mode is DEAD for all 4 countries.

  root_cause_diagnosed_23_jul_2026:
    file: scripts/pipeline/ingestion/socioeconomic.py
    line: 476
    code: 'province = sub.get("province") or ""'
    failure_mode: >
      v43 subs (added via Wave 2/3 OSM Overpass ingestion) landed with
      `province: None` in the canonical. overlay_socioeconomic() uses
      `province` as CSV lookup join key — empty join key = no match =
      all 6-8 socio_economic fields empty. v1 subs (pre-Wave-2 baseline)
      inherited proper province tagging from earlier ingestion paths and
      are unaffected.

  cohort_empirical_state:
    luxembourg:
      total_subs: 828
      v43_subs_missing_province: 828     # 100% of v43 cohort
      populated_pct: 12
    slovenia:
      total_subs: 1_731
      v43_subs_missing_province: 1_574
      populated_pct: 16
    colombia:
      total_subs: 720                    # approximate
      v43_subs_missing_province: 366
      populated_pct: 51
    lithuania:
      total_subs: 5_500                  # approximate
      v43_subs_missing_province: 5_094
      populated_pct: 50
    total_v43_subs_target: 7_862         # approximate — final count post-execute

  no_synthetic_generator_to_retire:
    score_country_analog: absent
    note: >
      Task #453 is pure additive enrichment — no synthetic generator to retire.
      Compare to Task #451 (retired score-country.py line 195 synthetic det_var
      generator) + Task #452 (retired fleet-uniform national scalar fallback
      via is_fleet_uniform_fallback() detection).


# ═══════════════════════════════════════════════════════════════════
#  2. EMPIRICAL PROVENANCE-MODE DEAD-END (Step 2a probe 23 Jul 2026)
# ═══════════════════════════════════════════════════════════════════

empirical_provenance_mode_dead_end:
  hypothesis: >
    Slovenia + Colombia OSM Overpass connectors emit
    `nuts3_code_detected` / `department_detected` respectively into per-sub
    `v43_provenance`. Assumption: propagate detected code to top-level
    `sub["province"]` + trigger downstream socio_economic overlay.

  empirical_result:
    slovenia:
      v43_subs_probed: 1_574
      subs_with_nuts3_code_detected_populated: 0
      population_rate_pct: 0.0
      connector_code_state: >
        `_extract_nuts3_from_tags()` reads ref:nuts:3 / ref:NUTS:3 / nuts:3 /
        addr:state / region. Extraction logic present + emits into per-sub
        provenance under `SI-C1-osm-overpass.nuts3_code_detected`. But
        Slovenian OSM contributors do not populate ANY of these tags at
        country scale. Extraction runs, returns null, no exception.
    colombia:
      v43_subs_probed: 366
      subs_with_department_detected_populated: 0
      population_rate_pct: 0.0
      connector_code_state: >
        Emits `department_detected` into per-sub provenance under
        `CO-C1-osm-overpass`. Colombian OSM contributors do not populate
        admin:department tags at country scale.
    luxembourg:
      v43_subs_probed: 828
      admin_tag_extraction_logic_in_connector: absent
      note: >
        Connector `scripts/pipeline/ingestion/luxembourg/osm_overpass.py`
        has no admin/NUTS tag extraction logic (empirically confirmed via
        grep). Reads `osm_region = tags.get("addr:state") or tags.get("region")
        or tags.get("addr:region")` at line 230 but does not export.
    lithuania:
      v43_subs_probed: 5_094
      admin_tag_extraction_logic_in_connector: absent
      note: >
        Connector `scripts/pipeline/ingestion/lithuania/osm_overpass.py`
        has ZERO admin/NUTS logic (empirically confirmed via grep).

  architectural_finding: >
    OSM tag density is EMPIRICALLY PER-COUNTRY — cohort-wide pattern
    confirmed at 5-country scale (Poland P21 17 July 2026 was the first
    instance; LU/SI/CO/LT bring cumulative empirical instance count to 5
    of Convention #76 5-10 BINDING threshold). See METHODOLOGY_DISCIPLINES.md
    §5septies for full codification. Path A-connector via provenance-mode
    is architecturally DEAD for this class of problem; polygon spatial-join
    is the load-bearing implementation across all 4 Task #453 countries.


# ═══════════════════════════════════════════════════════════════════
#  3. PATH SELECTION — Path A-polygon (post empirical dead-end)
# ═══════════════════════════════════════════════════════════════════

path_selection:
  chosen: "Path A-polygon (shared spatial-join utility for all 4 countries)"
  operator_directive_23_jul_2026: >
    Sequential operator decisions: (a) "proceed with task 453" — scope entry;
    (b) "why not path A? thinking hat" — pushback on initial Path B recommendation;
    (c) "yes proceed with phase A" — Path A accepted post thinking-hat analysis;
    (d) "path a connector" — chose true root-cause fix over shim; (e) "proceed
    with step 2a" — empirical OSM-tag probe; (f) "proceed with shape B" — live-
    pilot discipline (skip formal YAML for Task #453 originally, later reversed
    after scope grew to 4-country polygon per Tier 2 cascade discipline);
    (g) "proceed with tier 2" — full doc cascade with Discipline #47 EXTENSION
    + METHODOLOGY_DISCIPLINES.md §5septies + this preflight YAML.

  paths_considered_and_rejected:
    path_b_post_hoc_utility:
      description: "Post-ingestion utility fills province + socio_economic without connector changes."
      rejected_because: >
        Post-hoc shim leaves root cause unaddressed. Future Wave 5+
        countries would inherit the same silent failure mode. Path A-
        polygon closes the root cause at the L1 layer while providing
        reusable template for Task #454 SYSTEMIC (~21 additional countries).
    path_c_nearest_neighbor:
      description: "Nearest-neighbor lookup against v1 sub with populated province."
      rejected_because: >
        Not defensible for LP-DD narrative. Substation-to-substation
        proximity does not guarantee shared admin-code; a NUTS-3 boundary
        can pass between two adjacent subs. Would fail Convention #56
        visibly-honest degradation because the derivation input is a proxy
        for admin identity, not a direct measurement.
    path_a_connector_provenance:
      description: "Fix at connector layer via OSM tag extraction."
      rejected_because: >
        Empirical Step 2a probe confirmed OSM tag density = 0.0% across
        all 4 target countries. Connector tag-extraction is dead code
        for this class of problem (see METHODOLOGY_DISCIPLINES.md §5septies).

  path_a_polygon_load_bearing:
    description: >
      Shared spatial-join utility. Loads country-specific admin polygon
      shapefile into shapely STRtree, iterates v43 subs with province=None,
      does point-in-polygon to derive admin code, sets top-level sub["province"],
      MERGES CSV socio_economic fields into sub["socio_economic"] via
      dict.update() semantics preserving Task #451/#452 audit-trail markers.


# ═══════════════════════════════════════════════════════════════════
#  4. DISCIPLINE #47 CANDIDATE — Third structural variant (ADMIN)
# ═══════════════════════════════════════════════════════════════════

discipline_47_variant_class: "ADMIN"

discipline_47_context:
  parent: "REPORTS_FRAMING_KB.md §8bis Discipline #47 candidate (23 July 2026 EXTENDED)"
  three_structural_variants:
    - variant: "STOCK"
      task: 451
      mechanism: "raster zonal-sum over 5 km substation-catchment buffer"
      example: "socio_economic.population via GHSL Population Grid"
    - variant: "FLOW"
      task: 452
      mechanism: "raster single-point sampling with tanh range-mapping to [0, 1]"
      example: "socio_economic.migration_score via Niva 2023 gridded net-migration"
    - variant: "ADMIN"
      task: 453
      mechanism: >
        point-in-polygon spatial join → admin code → CSV lookup → merge fields
      example: "socio_economic.{gdp_per_capita, unemployment_rate, EP_rate_region, elderly_pct, V_socio}"

  first_canonical_formula_construct:
    variable: "V_socio"
    formula: "V_socio = 0.45 * ep_norm + 0.35 * gdp_norm + 0.20 * elderly_norm"
    normalisations:
      ep_norm: "min(1.0, ep_rate / 25.0)"
      gdp_norm: "clip(1.0 - (gdp_pc - 14000) / 40000, 0, 1)"
      elderly_norm: "clip((elderly_pct - 18) / 15, 0, 1)"
    anchor_points:
      ep_saturation: "25% energy poverty rate → 1.0 vulnerability on that axis"
      gdp_inversion_floor: "€14k regional GDP → 1.0 vulnerability (LT/SI/CO regional variance)"
      gdp_inversion_ceiling: "€54k regional GDP → 0.0 vulnerability (Luxembourg + Norway + Switzerland regional variance)"
      elderly_floor: "18% elderly-population → 0.0 vulnerability (Colombia + LT youth-heavy)"
      elderly_ceiling: "33% elderly-population → 1.0 vulnerability (Italy + Japan + Germany oldest regional variance)"
    weight_profile_literature_backing: >
      Sovacool 2015 + Bouzarovski 2018 energy-poverty primacy for grid-equity
      outcomes. 45% EP + 35% GDP + 20% elderly reflects empirical Grid Equity
      axis literature synthesis.
    canonical_location: "scripts/pipeline/ingestion/socioeconomic.py::overlay_socioeconomic() line 511-517"
    binding_contract: >
      Task #453 utility scripts/pipeline/enrichment/socio_economic_backfill.py::compute_v_socio()
      MIRRORS the formula. Any drift would produce different V_socio values
      than the modern pipeline emits (regression sentinel
      tests/test_socio_economic_backfill_polygon.py::TestVSocioFormulaLock
      pins the anchor points end-to-end).

  merge_not_replace_binding_contract:
    rule: >
      Any post-hoc enrichment utility in this discipline family MUST
      preserve upstream Task #451/#452/#453 audit-trail markers via
      dict.update() semantics on the sub's socio_economic block.
    banned:
      - "Direct field assignment that overwrites existing keys"
      - "Full-dict replacement of sub['socio_economic']"
      - "Calling overlay_socioeconomic() directly (would clobber migration_score)"
    preserved_markers:
      - "_catchment_population_source (Task #451)"
      - "_migration_score_source (Task #452)"
      - "_socio_economic_source (Task #453 — new)"
    sentinel_test_class: "TestMergeNotReplace"


