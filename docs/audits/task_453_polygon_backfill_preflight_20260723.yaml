# ═══════════════════════════════════════════════════════════════════
#  6. RISK INVENTORY
# ═══════════════════════════════════════════════════════════════════

risk_inventory:
  R1_task_451_marker_regression:
    severity: HIGH
    scenario: >
      Utility inadvertently overwrites _catchment_population_source marker
      when applying dict.update() semantics, or worse — replaces the entire
      sub['socio_economic'] block.
    mitigation: >
      Merge-not-replace BINDING contract codified as convention. Sentinel
      TestMergeNotReplace parametrised across 4-country cohort. Convention #56
      REINFORCED via defensive dict.setdefault() + explicit field-list update.

  R2_task_452_migration_score_clobber:
    severity: HIGH
    scenario: >
      Utility calls overlay_socioeconomic() directly, which builds a new
      sub['socio_economic'] dict INCLUDING migration_score from CSV. Would
      clobber Task #452 Niva values with CSV migration_score (which may
      itself be a Task #450 SYSTEMIC signature — the CSV migration_score
      field is the SAME semantic drift class Task #452 already retired).
    mitigation: >
      Task #453 utility MUST NOT call overlay_socioeconomic() directly.
      It builds its OWN 5-field update dict (gdp_per_capita, unemployment_rate,
      EP_rate_region, elderly_pct, V_socio) and applies via dict.update().
      migration_score is EXCLUDED from Task #453's update field-list.

  R3_polygon_boundary_edge_cases:
    severity: MEDIUM
    scenario: >
      Substation lat/lon lands exactly on a NUTS-3 boundary (topological
      edge case). shapely point-in-polygon may report false or ambiguous.
      Coastal substations may land in ocean pixels of the raster; polygon
      variant analogous risk: land near coast may not intersect any
      country's admin polygon if polygon boundaries are inland-simplified.
    mitigation: >
      Convention #56 fallback: subs outside all polygons receive None
      (not fabricated). Empirical audit will surface count of such subs
      per country. If count > 5% for any country, investigate polygon
      quality + consider tolerance buffer.

  R4_polygon_projection_mismatch:
    severity: MEDIUM
    scenario: >
      Eurostat GISCO NUTS-3 shapefile is EPSG:4326 (WGS84). Colombia DANE
      MGN may be in MAGNA-SIRGAS (Colombia's national projection) with
      centimetre offset from WGS84. Point coordinates from ssi-data.json
      are EPSG:4326. Mismatch produces boundary-region point-in-polygon
      failures.
    mitigation: >
      Explicit reprojection to EPSG:4326 at shapefile load time (shapely +
      pyproj). Verify via known-Bogotá point falls in Bogotá D.C. polygon.

  R5_task_454_scope_creep:
    severity: LOW
    scenario: >
      Utility works for LU/SI/CO/LT but proves difficult to generalise
      for the ~21 other v43-at-0%-coverage countries in Task #454 SYSTEMIC
      because each has its own admin-shapefile source + CSV schema variant.
    mitigation: >
      Design utility with per-country config dict from the start.
      COUNTRY_CONFIGS class-level dict. Adding a country = drop a new
      entry (polygon path + admin-code column + CSV path + CSV lookup
      column). No connector code changes needed.

  R6_v_socio_formula_drift:
    severity: MEDIUM
    scenario: >
      Task #453 utility computes V_socio via mirrored formula but drifts
      from socioeconomic.py canonical version. Utility-produced V_socio
      differs from modern pipeline output. LP-DD reviewer surfaces the
      drift.
    mitigation: >
      Utility MUST cite `overlay_socioeconomic() line 511-517` as canonical
      source in module docstring. Regression sentinel TestVSocioFormulaLock
      pins anchor points end-to-end. Any future pipeline change to the
      formula requires simultaneous utility update.


