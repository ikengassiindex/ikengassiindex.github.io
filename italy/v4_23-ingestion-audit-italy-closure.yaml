# ---------------------------------------------------------------
# Convention #78 §4bis.5 pattern side-effect finding
# ---------------------------------------------------------------
convention_78_4bis_5_pattern_side_effect_finding:
  finding_id: WAVE_4_VOLTAGE_INFERENCE_FIRES_BEFORE_GEOFENCE
  observation: |
    Italy P34 revealed that the current 10-layer resolver architecture
    fires voltage inference (via voltage_kv-based layers) BEFORE the
    §4bis.5 geofence layer. When a metro sub has no voltage tag AND
    is in Milan/Rome geofence, it gets tagged as
    `<geofence>_voltage_inferred` rather than pure `<geofence>` hit.
    This produces 419 "_voltage_inferred" variants of the geofence
    layers alongside 62 direct hits.
  interpretation: |
    NOT A BUG — architecturally correct. Voltage inference happens at
    Layer 6 (voltage-class heuristic) AFTER §4bis.5 geofences (Layers
    2-5). But when voltage is missing entirely, the resolver falls
    through to voltage inference AT THE SUB-PROCESSING LEVEL (before
    resolver is called with inferred voltage), then resolver picks the
    geofence layer and tags it with `_voltage_inferred` suffix.
  future_optimization_option: |
    Wave 4+ or Wave 5 optimization: reorder sub-processing to call
    resolver TWICE — first with raw voltage (may fire alias_hit or
    voltage-class layers), then IF unresolved AND geofence-eligible,
    apply geofence layer BEFORE voltage inference. This would give
    pure `<geofence>` hits for metro DSOs even when voltage tag missing.
    Non-blocking finding — current architecture is Convention #56
    visibly-honest (both direct + inferred variants recorded).
  cohort_wide_implication: |
    Milan+Rome combined metro DSO attribution is actually 481 (not 62).
    The `_voltage_inferred` variants are legitimate metro DSO
    attributions — just recorded with resolver-audit-trail suffix.

