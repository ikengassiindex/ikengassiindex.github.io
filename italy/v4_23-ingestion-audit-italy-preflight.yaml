  entry_added_to: cross_border_tolerances.json
  rationale_summary: |
    5.0 km tolerance — Mediterranean coastline complexity + Alpine
    ridge complexity + island archipelago precision. Comparable to
    Turkey P30 5.0 km + Sweden P32 4.0 km + Portugal P33 6.0 km.
    Italy sits between UK 3.0 (compact island) and Portugal 6.0
    (dual mid-Atlantic archipelagos).
