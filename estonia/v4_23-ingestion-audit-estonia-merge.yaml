lessons_generalised:
  - >
      **Baltic Trio empirical density divergence**: Lithuania +871% subs
      + 0.81 sub-heavy line ratio; Estonia +192% subs + 3.21 line-heavy
      ratio. Both Baltic OSM communities but DIFFERENT tagging
      priorities. Lithuania OSM contributors mapped exhaustive MV/LV
      substations without corresponding line coverage; Estonia OSM
      contributors mapped transmission-tier substations WITH matching
      line coverage. Latvia (Priority 18) will empirically bracket
      the range — expect between Lithuania's substation-heavy and
      Estonia's line-heavy patterns.
  - >
      **Semi-colon compound operator tag — NEW sub-convention codified**:
      Estonia surfaced 135 subs (128 primary + 8 minor variants) with
      semi-colon delimited compound operator strings representing
      shared-node substations where transmission (Elering) hands off
      to distribution (Elektrilevi) at the same physical location.
      Convention #56 visibly-honest preserves these as-is (not
      force-split to primary operator). Codifies new sub-convention
      on multi-operator OSM tagging semantics. Pattern likely to
      surface in Latvia + Slovakia + Czechia + Slovenia (all with
      similar shared-node conventions in OSM community).
  - >
      **Convention #78 21-instance cumulative validation**: Lithuania
      surfaced 1 Cyrillic hit; Estonia surfaced 20 Cyrillic + NFC hits.
      Cumulative 2-country Baltic Trio cohort = 21 empirical instances.
      Well above Convention #76 5-10 cadence threshold. Priority 18
      Latvia closure would complete 3-country Baltic Trio empirical
      validation — likely triggers Convention #78 sub-convention
      BINDING promotion methodology-version event.
  - >
      **First cohort-country with ZERO Step 5 alias-retighten patches**:
      Estonia's OSM tagging was empirically clean at first pass.
      Preemptive Cyrillic alias handling (Convention #78) + Estonian
      NFC diacritic support caught all variants at Step 3 connector
      author-time. No post-merge normalisation required. Pattern
      generalises to future countries where alias map author-time
      thoroughness exceeds runtime discovery cost.
  - >
      **Dense baseline advantage**: Estonia's baseline had 3,769 lines
      (2.5× Lithuania). Post-merge dedupe absorbed 64.4% of OSM lines
      (3,597/5,581) — HIGHEST dedupe rate cohort-wide. Sparse-baseline
      countries (Slovenia, Colombia) had 10-20% dedupe rates. Line
      densification value diminishes as baseline coverage improves.

