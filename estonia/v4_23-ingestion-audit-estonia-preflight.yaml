meta:
  country: estonia
  iso2: EE
  iso3: EST
  wave: 2
  priority: 17
  step: 1
  target: "Owner enrichment via OSM Overpass — 2-operator vertically-integrated state monopoly via Eesti Energia holding (Baltic Trio 2nd instance)"
  rationale: >
    Estonia carries 614 substations with 0% owner tagged, 77.9% voltage
    tagged (478/614 covering 450/330/150/110/35/10/6 kV + 22.1% unknown),
    and 100% region tagged across all 15 Estonian counties (maakonnad).
    Estonia's electricity architecture parallels Lithuania — a 2-operator
    vertically-integrated state monopoly via Eesti Energia holding:
    Elering AS (state TSO ≥110 kV, 2010 spinoff from Eesti Energia) +
    Elektrilevi OÜ (unified state DSO ≤110 kV, 2013 spinoff from Eesti
    Energia). Both 100% state-owned via Eesti Energia Grupp — pure
    vertically-integrated state architecture like Lithuania's EPSO-G
    holding. Baltic Trio sibling to Lithuania — empirical validation
    of the +871% Baltic OSM density hypothesis before Latvia lands as
    Priority 18.

