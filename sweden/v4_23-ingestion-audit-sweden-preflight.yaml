# ---------------------------------------------------------------
# Wave 4 architecture requirements (post-Turkey schema-bug lesson)
# ---------------------------------------------------------------
wave_4_architecture_requirements:
  merger_schema_target: canonical_compact_s_l_a
  osm_overpass_query_hints:
    substations: out center
    lines: out geom
  merger_operations_required:
    - substation_id_assignment
    - line_id_assignment
    - polyline_conversion_to_compact_p_array
    - line_endpoint_ss_se_matching_string_ids
    - adjacency_graph_construction
    - grid_based_spatial_index_for_large_N_merges
    - bbox_split_fallback_if_single_bbox_fails
  compact_schema_write: via_scripts_pipeline_utils_grid_geo_sharding_write_grid_geo
  # Sweden projected 30-45 MB grid-geo — safely under 90 MB sharding threshold

