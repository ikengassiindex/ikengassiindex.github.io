convention_78_4bis_5_stockholm_geofence:
  cohort_wide_enforcement_number: 10  # candidate — after UK London 9th
  geofence_architecture: 2_way_metropolitan_split
  cumulative_enforcement_roster_pre_sweden:
    1: Prague CZ (P20)
    2: Warsaw PL (P21)
    3: EWZ Zurich CH (P24)
    4: SIG Geneva CH (P24)
    5: Auckland NZ (P27)
    6: Copenhagen DK (P28 — 615)
    7: Helsinki FI (P29 — 446)
    8: Istanbul TR (P30 — 57+121=178)
    9: London UK (P31 — 1,994 LARGEST)
  candidate: Stockholm SE (P32 candidate — 2-way Ellevio + Vattenfall split)
  stockholm_context: |
    Stockholm metropolitan area (~2.4M population = ~23% of Swedish
    population; ~30% of Swedish electricity demand). Two-way DSO split:
    (a) Ellevio Stockholm — inner-city + eastern suburbs (Nacka +
    Ekerö + Solna + Sundbyberg + Stockholm inner + some Stockholm
    outer wards); (b) Vattenfall Eldistribution Stockholm — outer
    western + northern suburbs + Uppsala.
  geofence_bboxes:
    ellevio_stockholm:
      lat: [59.20, 59.50]
      lon: [17.80, 18.25]
      operator_canonical: Ellevio Stockholm
      customers_millions: 0.7
    vattenfall_stockholm:
      lat: [59.30, 59.60]
      lon: [17.55, 18.10]
      operator_canonical: Vattenfall Eldistribution Stockholm
      customers_millions: 0.5
  anticipated_hits: 500_1500  # comparable to Helsinki 446; less than London 1,994

