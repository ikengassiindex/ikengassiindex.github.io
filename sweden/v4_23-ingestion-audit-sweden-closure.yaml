# ---------------------------------------------------------------
option_a_to_option_b_recovery:
  option_a_first_pass_signal:
    date: 2026-07-19
    lines_before: 20877
    lines_after_option_a: 9687
    regression_pct: -53.6
    discipline_41_parity: 0.85
    signature: BELOW_HEALTHY_BAND_🚨

  option_b_patch_applied:
    patch_1_osm_overpass_extended_query: |
      Extended _build_lines_query() to include:
        way["power"="minor_line"](bbox)  # NEW — Nordic MV distribution
      alongside existing power=line + power=cable classes. Sweden
      OSM community populates minor_line heavily for wooden-pole
      10-40 kV rural distribution — excluding it was root cause.
    patch_2_merger_voltage_inference: |
      Extended _process_lines() to accept lines without voltage tag
      with power-class-based inferred defaults:
        minor_line → 20 kV MV rural distribution
        cable (no voltage) → 20 kV MV underground urban
        line (no voltage) → 130 kV subtransmission Nordic HV
      Each inferred line carries `_vi: true` compact flag per
      Convention #56 visibly-honest degradation.

  option_b_recovery_signal:
    lines_after_option_b: 19676
    growth_vs_option_a_pct: 103.1
    regression_vs_baseline_pct: -5.7  # essentially FLAT
    discipline_41_parity: 1.73
    signature: HEALTHY_BAND_✓

  root_cause_confirmed: |
    Nordic OSM community tagging pattern differs from Central European
    + Anglosphere pattern. Wave 4 default query optimised for UK+Turkey+
    Central European tagging density (where minor_line is rarely
    populated + voltage tags are near-universal). Nordic wooden-pole
    rural MV distribution predominantly tagged as power=minor_line +
    voltage tag often omitted by rural OSM mappers.

