descriptions:
  map: Interactive map of Israel's electrical grid with SSI v4.0.2 resilience scores
    for 257 substations across 6 mehozot. 95 variables, IEC + Noga ILITO + PUA + INCD/CERT-IL
    oversight. 50 Hz · 161 kV main backbone · 400 kV limited deployment · 22 kV /
    12.6 kV distribution.
  regional: Compare Israel's 6 mehozot (Northern, Haifa, Central, Tel Aviv, Jerusalem,
    Southern) by SSI resilience score, component breakdown, and socio-economic context.
    Tel Aviv Silicon Wadi vs Southern Negev periphery — moderate-upper R3 4-tier gradient.
  data: Download the complete SSI dataset for Israel — JSON, CSV, GeoJSON. 13 verified
    public data sources, 95 variables, 10 data layers. IEC + Noga ILITO + PUA + INCD/CERT-IL/Unit
    8200 + GSI + IMS + CBS + Bank of Israel + Mekorot.
regional:
  subheader: Compare Israel's 6 mehozot by SSI score, component breakdown, and socio-economic
    context across 257 substations. Tel Aviv ↑ (Silicon Wadi tech) · Southern ↓ (Negev
    arid R6_drought peak + 4.1× metro-to-periphery SAIDI gradient).
  ranking_tab_label: Mehozot Ranking
  compare_tab_label: Mehoz Comparison
  ranking_header: Mehozot Ranked by Median R Score
  ranking_count_text: 6 mehozot · sorted worst → best
  ranking_column_header: Mehoz
  compare_select_h3: Select Mehozot to Compare
  compare_a_label: Mehoz A
  compare_b_label: Mehoz B
  compare_empty_text: Select mehozot above
  decomp_header: Average Component Contribution by Mehoz
  decomp_subtext: Stacked horizontal bars · 6 Israeli mehozot
  page_title_override: SSI Index — Israel Regional Analysis
map:
  voltage_filter_options:
  - value: '400'
    label: 400 kV (limited deployment)
  - value: '161'
    label: 161 kV (main transmission backbone)
  - value: '22'
    label: 22 kV
  - value: other
    label: 12.6 kV &amp; below
data:
  country_adjective: Israel
  layer_e_extended: false
  source_registry_count: '13'
  data_layers:
  - code: A
    vars: 20
    sources: PUA quality monitoring · IEC annual reliability indicators · IEC + cooperative
      DSO aggregate · CBS regional accounts
  - code: B.1
    vars: 3
    sources: IMS daily synoptic · ERA5 · PUA continuity bulletins · Noga ILITO SMP
      market data (open since 1 Nov 2021 reform)
  - code: B.2
    vars: 4
    sources: IEEE C57.91 thermal stress under arid/Mediterranean climate · summer
      peaking ~16-17 GW · 161 kV + 400 kV backbone loading
  - code: B.3
    vars: 12
    sources: IEEE/CIGRÉ degradation curves under arid + Mediterranean coastal-marine
      + Dead Sea industrial corrosion + active-conflict stress
  - code: C
    vars: 9
    sources: CBS mehoz GDP · Bank of Israel national accounts · R&D intensity ~5.4%
      cohort-LEADING · Silicon Wadi ~18% GDP
  - code: D
    vars: 7
    sources: GSI Dead Sea Transform strike-slip seismic (M7+ overdue per ~80-100yr
      recurrence; last major 1927 Jericho Mw 6.2) · IMS Negev arid drought (R6_drought
      NEW) · R6_volcanic INACTIVE (Pliocene Golan basalts ~4 Mya) · Mediterranean
      C3-C4 + Dead Sea c5_extreme corrosion
  - code: E
    vars: 8
    sources: GSI seismic + IMS climate + INCD cyber posture + IEC station-level operational
      data + Mekorot desalination demand
  - code: F
    vars: 12
    sources: State-transition probabilities calibrated against IEC ~80% dominance
      + IPP private ~20% (Dorad + OPC + Edeltech + Bazan)
  - code: G
    vars: 3
    sources: PUA quality reports · OSM Power · JRC DSO benchmarks · NEW R6_drought
      α anchor (FIRST in cohort; Negev desalination-electricity nexus) · R7 ceiling
      1.040 cohort-LEADING
  - code: H
    vars: 7
    sources: IEC Master Plan 2023-2030 · GSI seismic · OSM Overpass ISO3166-1=IL ring
      analysis (insular grid — no synchronous interconnect; EuroAsia HVDC IL-CY-GR
      Phase 1 planned 2027-2028 will end insularity mid-cohort-lifecycle)
  - code: I
    vars: 7
    sources: Risk score, ETTC, stationary probabilities, R3 4-tier band (Tel Aviv
      1.06 / Central+Haifa 1.05 / Jerusalem 1.04 / Northern+Southern 1.03), Markov
      5-state
