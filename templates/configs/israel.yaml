  - code: B.3
    vars: 12
    sources: IEEE/CIGRÉ degradation curves under arid + Mediterranean coastal-marine
      + Dead Sea industrial corrosion + active-conflict stress
  - code: C
    vars: 9
    sources: CBS mehoz GDP · Bank of Israel national accounts · R&D intensity ~5.4%
      cohort-LEADING · Silicon Wadi ~18% GDP
  - code: D
    vars: 7
    sources: GSI Dead Sea Transform strike-slip seismic (M7+ overdue per ~80-100yr
      recurrence; last major 1927 Jericho Mw 6.2) · IMS Negev arid drought (R6_drought
      NEW) · R6_volcanic INACTIVE (Pliocene Golan basalts ~4 Mya) · Mediterranean
      C3-C4 + Dead Sea c5_extreme corrosion
  - code: E
    vars: 8
    sources: GSI seismic + IMS climate + INCD cyber posture + IEC station-level operational
      data + Mekorot desalination demand
  - code: F
    vars: 12
    sources: State-transition probabilities calibrated against IEC ~80% dominance
      + IPP private ~20% (Dorad + OPC + Edeltech + Bazan)
  - code: G
    vars: 3
    sources: PUA quality reports · OSM Power · JRC DSO benchmarks · NEW R6_drought
      α anchor (FIRST in cohort; Negev desalination-electricity nexus) · R7 ceiling
      1.040 cohort-LEADING
  - code: H
    vars: 7
    sources: IEC Master Plan 2023-2030 · GSI seismic · OSM Overpass ISO3166-1=IL ring
      analysis (insular grid — no synchronous interconnect; EuroAsia HVDC IL-CY-GR
      Phase 1 planned 2027-2028 will end insularity mid-cohort-lifecycle)
  - code: I
    vars: 7
    sources: Risk score, ETTC, stationary probabilities, R3 4-tier band (Tel Aviv
      1.06 / Central+Haifa 1.05 / Jerusalem 1.04 / Northern+Southern 1.03), Markov
      5-state
