methodology:
  subheader: How the SSI v4.0.2 is calculated for Israel — from raw IEC, Noga, PUA,
    GSI, IMS, INCD, and CBS feeds through to the substation-level R<sub>final</sub>.
    Open methodology, open data, fully reproducible.
  custom_thesis_html: 'Power-grid resilience is inseparable from its socio-economic
    context. A mehoz serving a Galilee Arab municipality with long radial 22 kV feeders,
    slow restoration times and weaker fiscal capacity is fundamentally more vulnerable
    than a Tel Aviv urban-core substation with identical electrical characteristics.
    The SSI captures this reality by fusing traditional grid metrics — IEC asset condition,
    PUA SAIDI/SAIFI, Noga dispatch frequency — with socio-economic, environmental,
    and energy-transition data — all from public sources. Israel adds two cohort-first
    stress dimensions: a strike-slip transform fault (the Dead Sea Transform) as the
    primary seismic source, and an arid-climate drought modifier coupled to electricity
    demand through the desalination-water-electricity nexus.'
  custom_ingest_html: '95 variables from 30+ verified public data sources — IEC annual
    reports + transmission plan 2023-2030, Noga ILITO monthly + SMP wholesale market
    data (open since the November 2021 reform), PUA tariff resolutions + quality-of-service
    indicators (2023-24 annual report), CBS regional accounts at the mehoz level,
    Bank of Israel macro + ILS FX, IMS (Israel Meteorological Service) climate + drought
    indices, GSI (Geological Survey of Israel) seismology + 475-yr PGA hazard maps,
    INCD + CERT-IL critical-infrastructure scope, Mekorot national water utility +
    desalination plant electricity-demand data, MoEP air-quality monitoring, Copernicus
    ERA5 + CMIP6, IEA + OECD energy benchmarks, OSM Overpass (ISO3166-1=''IL''). Israel
    is NOT an ENTSO-E member (effectively-insular Mediterranean grid; EuroAsia Interconnector
    under construction, target 2027-2028). Zero proprietary SCADA dependencies. Maximum
    ingestion frequency: daily.'
  admin_label_plural_lower: mehozot
  ingestion_frequency: daily
  data_sources_country: Israel
