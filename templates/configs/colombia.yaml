  subheader: A composite resilience score for Colombia's electrical grid — 381 substations
    across 32 departamentos plus Bogotá D.C., scored against the XM CND dispatch +
    ISA INTERCOLOMBIA 500/230/220/138 kV STN backbone and the fragmented ~25-DSO distribution
