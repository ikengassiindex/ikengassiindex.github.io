descriptions:
  map: Interactive map of Colombia's electrical grid with SSI v4.0.2 resilience scores
    for 381 substations across 32 departamentos plus Bogotá D.C. Volcanic-proximity
    overlay for Caldas + Tolima (Nevado del Ruiz), Nariño (Galeras), Cauca (Puracé),
    Huila (Nevado del Huila). XM CND dispatch + ISA INTERCOLOMBIA STN backbone + ~25-DSO
    fragmented distribution.
  regional: Compare Colombia's 32 departamentos plus Bogotá D.C. by SSI resilience
    score, component breakdown, and socio-economic context. Five-tier R3 calibration
    (Capital-Metro/Industrial 1.05 / Regional-Capital 1.04 / Andean Intermediate 1.03
    / Pacific-Frontier 1.02 / Amazon-Frontier Sparse 1.01).
  data: Download the complete SSI dataset for Colombia — JSON, CSV, GeoJSON. 30+ verified
    public data sources, 95 variables, 10 data layers. XM + ISA INTERCOLOMBIA + CREG
    + UPME + DANE + Banco de la República + IDEAM + SGC + ColCERT/CSIRT-XM + Unidad
    de Víctimas + Migración Colombia.
  methodology: SSI v4.0.2 methodology — master equation, 6 components, modifiers including
    R6_armed_conflict + R6_volcanic + R6_drought (reservoir-electricity nexus), 95
    variables, Monte Carlo uncertainty. Colombia edition.
  index: SSI Index v4.0.2 — Systemic System Infrastructure Index. Composite resilience
    scoring for Colombia's 381 substations across 32 departamentos + Bogotá D.C. 95
    variables, 30+ public data sources, XM + CREG + MME/UPME oversight, hydro-dominant
    matrix (~70% normal year) with El Niño drought + Nevado del Ruiz/Galeras volcanic
    + Andean subduction seismic + R6_armed_conflict modifiers. Open data, open methodology.
regional:
  subheader: Compare Colombia's 32 departamentos plus Bogotá D.C. by SSI score, component
    breakdown, and socio-economic context across 381 substations. Five-tier R3 calibration
    spans Capital-Metro/Industrial (Bogotá D.C. + Antioquia, 1.05) through Regional-Capital
    (Valle del Cauca / Santander / Cundinamarca / Atlántico / Bolívar / Casanare,
    1.04), Andean Intermediate (coffee zone + Galeras/Ruiz proximity, 1.03), Pacific-Frontier
    (Chocó cohort-poorest + Cauca + La Guajira + Putumayo, 1.02), down to Amazon-Frontier
    Sparse (Vichada / Guainía / Vaupés / Amazonas, 1.01).
