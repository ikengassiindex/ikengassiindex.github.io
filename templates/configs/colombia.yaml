    95 variables, 30+ public data sources, zero proprietary dependencies. XM system
    operation since June 1995 + CREG tariff regulation + MME/UPME planning + ColCERT/CSIRT-XM
    cyber oversight. Population ~52.2M (DANE 2024); 37th OECD member (accession 28
    April 2020 — first Andean OECD member, second South American after Chile 2010).
  kpi_total_sub: XM/ISA INTERCOLOMBIA transmission + ~25-DSO fragmented distribution
    · 32 departamentos + Bogotá D.C.
