    \    <div class=\"label-xs\" style=\"color:#941914;margin-bottom:6px\">T1 · Capital-Metro\
    \ / Industrial</div>\n        <div style=\"font-family:'Playfair Display',serif;font-size:17px;font-weight:600;color:var(--ink);margin-bottom:8px\"\
    >Bogotá D.C.</div>\n        <p style=\"font-size:12px;line-height:1.6;color:var(--warm-grey);margin:0\"\
    >Capital district + Distrito Capital special administrative status. Population\
    \ ~7.9M (DANE 2024); ~16% of national GDP; government + financial services + tertiary\
    \ core. R3 ceiling 1.05. Codensa S.A. E.S.P. (Enel Colombia) is the regional DSO\
    \ with ~30% of national MWh. Critical supply: Guavio 1,200 MW (Emgesa, Cundinamarca-Boyacá\
    \ border) is the reservoir-electricity nexus anchor for Bogotá D.C. supply continuity\
    \ during dry-season El Niño years.</p>\n      </div>\n\n      <div class=\"card\"\
    \ style=\"border-left:3px solid #941914\">\n        <div class=\"label-xs\" style=\"\
    color:#941914;margin-bottom:6px\">T1 · Capital-Metro / Industrial</div>\n    \
    \    <div style=\"font-family:'Playfair Display',serif;font-size:17px;font-weight:600;color:var(--ink);margin-bottom:8px\"\
    >Antioquia (Medellín)</div>\n        <p style=\"font-size:12px;line-height:1.6;color:var(--warm-grey);margin:0\"\
