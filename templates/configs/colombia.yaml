descriptions:
  map: Interactive map of Colombia's electrical grid with SSI v4.0.2 resilience scores
    for 381 substations across 32 departamentos plus Bogotá D.C. Volcanic-proximity
    overlay for Caldas + Tolima (Nevado del Ruiz), Nariño (Galeras), Cauca (Puracé),
    Huila (Nevado del Huila). XM CND dispatch + ISA INTERCOLOMBIA STN backbone + ~25-DSO
    fragmented distribution.
  regional: Compare Colombia's 32 departamentos plus Bogotá D.C. by SSI resilience
    score, component breakdown, and socio-economic context. Five-tier R3 calibration
    (Capital-Metro/Industrial 1.05 / Regional-Capital 1.04 / Andean Intermediate 1.03
    / Pacific-Frontier 1.02 / Amazon-Frontier Sparse 1.01).
regional:
  subheader: Compare Colombia's 32 departamentos plus Bogotá D.C. by SSI score, component
    breakdown, and socio-economic context across 381 substations. Five-tier R3 calibration
    spans Capital-Metro/Industrial (Bogotá D.C. + Antioquia, 1.05) through Regional-Capital
    (Valle del Cauca / Santander / Cundinamarca / Atlántico / Bolívar / Casanare,
    1.04), Andean Intermediate (coffee zone + Galeras/Ruiz proximity, 1.03), Pacific-Frontier
    (Chocó cohort-poorest + Cauca + La Guajira + Putumayo, 1.02), down to Amazon-Frontier
    Sparse (Vichada / Guainía / Vaupés / Amazonas, 1.01).
  custom_header_html: "<div style=\"display:flex;align-items:center;gap:14px;margin-bottom:8px\"\
    >\n      <span class=\"flag\" style=\"font-size:32px;line-height:1\">\U0001F1E8\
    \U0001F1F4</span>\n      <h1 style=\"margin:0\">Regional Analysis — Colombia</h1>\n\
    \    </div>\n    <p>Compare Colombia's 32 departamentos plus Bogotá D.C. by SSI\
    \ score, component breakdown, and socio-economic context across 381 substations.\
    \ Five-tier R3 calibration spans Capital-Metro/Industrial (Bogotá D.C. + Antioquia,\
    \ 1.05) through Regional-Capital (Valle del Cauca / Santander / Cundinamarca /\
    \ Atlántico / Bolívar / Casanare, 1.04), Andean Intermediate (coffee zone + Galeras/Ruiz\
    \ proximity, 1.03), Pacific-Frontier (Chocó cohort-poorest + Cauca + La Guajira\
    \ + Putumayo, 1.02), down to Amazon-Frontier Sparse (Vichada / Guainía / Vaupés\
    \ / Amazonas, 1.01).</p>"
  ranking_tab_label: Departamento Ranking
  compare_tab_label: Departamento Comparison
  ranking_header: Departamentos Ranked by Median R Score
  ranking_count_text: 33 departamentos · sorted worst → best
  ranking_column_header: Departamento
  compare_select_h3: Select Departamentos to Compare
  compare_a_label: Departamento A
  compare_b_label: Departamento B
  compare_empty_text: Select departamentos above
  decomp_header: Average Component Contribution by Departamento
  decomp_subtext: Stacked horizontal bars · 33 departamentos
  page_title_override: Colombia (CO) — Regional Analysis — SSI v4.0.2
  ranking_tab_extra_html: "<!-- Top-3 Deep-Dive Callouts -->\n    <div class=\"grid-3\
    \ animate-in delay-3\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:24px\"\
    >\n\n      <div class=\"card\" style=\"border-left:3px solid #941914\">\n    \
    \    <div class=\"label-xs\" style=\"color:#941914;margin-bottom:6px\">T1 · Capital-Metro\
    \ / Industrial</div>\n        <div style=\"font-family:'Playfair Display',serif;font-size:17px;font-weight:600;color:var(--ink);margin-bottom:8px\"\
    >Bogotá D.C.</div>\n        <p style=\"font-size:12px;line-height:1.6;color:var(--warm-grey);margin:0\"\
    >Capital district + Distrito Capital special administrative status. Population\
    \ ~7.9M (DANE 2024); ~16% of national GDP; government + financial services + tertiary\
    \ core. R3 ceiling 1.05. Codensa S.A. E.S.P. (Enel Colombia) is the regional DSO\
    \ with ~30% of national MWh. Critical supply: Guavio 1,200 MW (Emgesa, Cundinamarca-Boyacá\
    \ border) is the reservoir-electricity nexus anchor for Bogotá D.C. supply continuity\
    \ during dry-season El Niño years.</p>\n      </div>\n\n      <div class=\"card\"\
    \ style=\"border-left:3px solid #941914\">\n        <div class=\"label-xs\" style=\"\
    color:#941914;margin-bottom:6px\">T1 · Capital-Metro / Industrial</div>\n    \
    \    <div style=\"font-family:'Playfair Display',serif;font-size:17px;font-weight:600;color:var(--ink);margin-bottom:8px\"\
    >Antioquia (Medellín)</div>\n        <p style=\"font-size:12px;line-height:1.6;color:var(--warm-grey);margin:0\"\
    >Medellín industrial heartland + Aburrá Valley manufacturing concentration. Population\
    \ ~6.9M; GDP/cap ~$8k. EPM (Empresa Pública de Medellín) is the municipally-owned\
    \ 100%-City-of-Medellín DSO + dominant hydro generator. EPM hydro portfolio includes\
    \ Guatapé + San Carlos 1,240 MW + Porce I-II-III-IV + Ituango 2,400 MW (cohort-largest\
    \ hydro project; partial commissioning 2018-2024, full commissioning 2024 added\
    \ ~1,200 MW). R6_drought α 0.15-0.20 — cohort-highest hydro-dependence exposure.</p>\n\
    \      </div>\n\n      <div class=\"card\" style=\"border-left:3px solid #5d8563\"\
    >\n        <div class=\"label-xs\" style=\"color:#5d8563;margin-bottom:6px\">T4\
    \ · Pacific / Frontier</div>\n        <div style=\"font-family:'Playfair Display',serif;font-size:17px;font-weight:600;color:var(--ink);margin-bottom:8px\"\
    >Chocó (Quibdó)</div>\n        <p style=\"font-size:12px;line-height:1.6;color:var(--warm-grey);margin:0\"\
    >Pacific rainforest cohort-poorest departamento. Population ~0.55M; GDP/cap ~$2-3k\
    \ (cohort-low). Wettest place on earth (~10,000 mm/yr precipitation). V_socio\
    \ baseline 0.20 — cohort-lowest social-resilience capacity. Significant Afro-Colombian\
    \ + Embera indigenous population. R6_armed_conflict residual exposure (Clan del\
    \ Golfo + ELN). R6_flood α 0.18 — cohort-highest flood-landslide exposure. DSO:\
    \ DISPAC with long radial 34.5 kV feeds and structural quality-of-supply gap vs\
    \ Andean corridor.</p>\n      </div>\n\n    </div>"
