methodology:
  h1_html: <span style="font-size:0.75em;vertical-align:middle;margin-right:8px">🇨🇴</span>Methodology
    — Colombia
  subheader: How the SSI v4.0.2 score is calculated for Colombia — from raw data to
    final classification. Open methodology, open data, fully reproducible across 33
    departamentos.
  custom_thesis_html: Grid resilience in Colombia is inseparable from its hydro-dependent
    generation matrix, its active Andean seismic + volcanic regime, its internal armed-conflict
    legacy, and its socio-economic gradient running from Bogotá D.C. to the Amazon
    frontier. A substation serving a Chocó or Amazonas department with slow restoration,
    weak fiscal capacity, and proximity to a historical pylon-attack corridor is structurally
    more vulnerable than one with identical electrical characteristics in the Bogotá
    metro. The SSI captures this by fusing grid metrics with DANE socio-economic,
    IDEAM hydro-meteorological, SGC seismic + volcanic, ColCERT cyber, and Unidad
    de Víctimas + Migración Colombia displacement data — all from public sources.
  custom_ingest_html: '95 variables from 30+ verified public Colombian sources — DANE
    (Departamento Administrativo Nacional de Estadística) census + departamento-level
    GDP per capita + multidimensional poverty (MPI), UPME (Unidad de Planeación Minero-Energética)
    transmission + generation expansion plans, CREG (Comisión de Regulación de Energía
    y Gas) tariff + reliability + market structure, XM market dispatch + reservoir-level
    monitoring + CSIRT-XM cyber posture, IDEAM (Instituto de Hidrología, Meteorología
    y Estudios Ambientales) ENSO advisories + flood-hazard maps + climate baselines,
    SGC (Servicio Geológico Colombiano) 475-yr PGA hazard maps + volcanic-observatory
    alert bulletins (OVSM Manizales for Nevado del Ruiz, OVSP Pasto for Galeras, OVSPop
    Popayán for Puracé), ColCERT national CERT + CONPES 3854/2016 + 3995/2020 cyber
    framework, Unidad de Víctimas (IDP cumulative register), Migración Colombia (Venezuelan
    refugee register), Ministerio de Defensa (pylon-attack incident reporting), OSM
    Overpass (substation + line geometry via `out geom`). Zero proprietary SCADA dependencies.
    Maximum ingestion frequency: daily.'
  admin_label_plural_lower: substations
  ingestion_frequency: daily
  data_sources_country: Colombia
