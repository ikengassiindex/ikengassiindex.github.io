methodology:
  custom_ingest_html: '95 variables from 30+ verified public data sources — Landsnet
    network statement, Orkustofnun raforkutölfræði + quality reports, Veitur + RARIK
    + HS Veitur DSO quarterly filings, Hagstofa Íslands landshluti regional accounts,
    Seðlabanki Íslands national accounts, Veðurstofa Íslands (IMO/OVF) consolidated
    meteorology + hydrology + seismic + volcanic monitoring (Þjórsá Q100 + Skeiðará/Markarfljót
    jökulhlaup + Mid-Atlantic Ridge SISZ/TFZ catalogue + Reykjanes/Vatnajökull/Hekla
    networks), Umhverfisstofnun (UST) air quality + ISO 9223 corrosion, CERT-IS +
    Fjarskiptastofa (ECOI) cyber posture, Copernicus, Eurostat, IEA/OECD, OSM Overpass.
    Iceland is NOT an ENTSO-E member (insular grid). Zero proprietary SCADA dependencies.
    Maximum ingestion frequency: daily.'
