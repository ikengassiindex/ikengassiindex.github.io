descriptions:
  map: Interactive map of Iceland's electrical grid with SSI v4.0.2 resilience scores
    for 687 substations across 8 landshluti (traditional regions, 2 NUTS-3). 95 variables,
    Landsnet + Landsvirkjun/E.ON heritage + —+II geothermal oversight.
  regional: Compare Iceland's 8 landshluti (traditional regions, 2 NUTS-3) by SSI
    resilience score, component breakdown, and socio-economic context.
  data: Download the complete SSI dataset for Iceland — JSON, CSV, GeoJSON. 30+ verified
    public data sources, 95 variables, 11 data layers.
