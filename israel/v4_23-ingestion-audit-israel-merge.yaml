lessons_generalised:
  - >
      **Hebrew Unicode alias normalisation with NFC works empirically at scale**:
      Unicode NFC + case-insensitive lookup successfully resolved חברת חשמל לישראל,
      חשמל, נגה, דורד variants. 2 new aliases surfaced post-fetch (Israel Electric
      Company + חברת החשמל) — patched via Step 5 retighten pass. Pattern
      generalises to any future country with non-Latin script (Arabic, Cyrillic,
      Greek, Devanagari, CJK) — same NFC + case-insensitive approach.
  - >
      **Step 4b retroactive attribution now integrated into merge script itself**
      (learned from Costa Rica Priority 13). Israel's 0 subs needed retroactive
      attribution because OSM coverage matched baseline count (257 vs 257 = 100%
      match rate). But the code path is now standard for future countries where
      OSM sub count < baseline count. **Novel pattern codification**: monopoly-
      default resolvers naturally support retroactive attribution because they
      don't require geofence overlap knowledge — the state utility default
      catches everything the direct OSM tag didn't.
  - >
      **Step 5 alias-retighten pattern for post-fetch normalisation gaps**:
      When new operator variants surface in OSM data that weren't in the
      initial alias map, apply retroactive normalisation in-place with
      "alias-retighten" provenance tag. Preserves original OSM tag in
      v43_provenance sidecar for audit trail; canonical owner reflects
      the normalised value. Generalises to any future country where OSM
      aliases surface post-shipping.
  - >
      **100% triple coverage achieved AGAIN — 2nd cohort-country at this
      milestone** (Costa Rica was 1st via Step 4b retroactive; Israel is
      2nd because baseline was already 100% voltage + region and monopoly-
      default caught all owners). Emerging pattern: countries with 100%
      voltage/region baseline + monopoly-dominated grid architecture
      naturally reach triple-100% via pure monopoly default. Next candidates
      of same type: Colombia (ISA state monopoly + regional distributors) +
      Lithuania (Litgrid + ESO monopoly).
  - >
      **Line-density task #182 outlier PERSISTS at 24.76**: baseline 16.15
      already flagged; OSM added 2,211 net-new lines (34% growth from
      OSM MV distribution ingestion) pushing ratio worse. Israel now joins
      Norway as the 2 remaining task #182 outliers cohort-wide (Slovenia
      retired at Priority 12). This is honest data quality — Israel is
      genuinely a country with dense MV distribution captured in both
      baseline + OSM. Not a bug, just a data-cardinality outlier.

