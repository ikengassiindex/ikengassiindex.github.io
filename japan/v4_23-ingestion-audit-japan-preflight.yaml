# ---------------------------------------------------------------
# Convention #78 §4bis.5 Layer 3 — NOT REQUIRED for Japan
# ---------------------------------------------------------------
convention_78_4bis_5_layer_3_geofence:
  required: false
  rationale: |
    Japan is REGIONAL-MONOPOLY jurisdiction — each of 9 regional
    utilities is single-DSO in its territory. No metropolitan
    multi-DSO splits exist (unlike Milan A2A+E-Distribuzione or
    Rome ACEA+E-Distribuzione). Tokyo → TEPCO PG only. Osaka →
    Kansai T&D only. Nagoya → Chubu PG only. Post-2020 unbundling
    separated generation from T&D but didn't create metro splits.

    Compare to:
    - Portugal P33: SINGLE-DSO simplification (E-REDES 99% mainland)
    - Japan P35: REGIONAL-MONOPOLY simplification (9 non-overlapping territories)
    - Both are architectural simplifications requiring NO §4bis.5

  cumulative_enforcement_roster_pre_japan:
    1: Prague CZ (P20)
    2: Warsaw PL (P21)
    3: EWZ Zurich CH (P24)
    4: SIG Geneva CH (P24)
    5: Auckland NZ (P27)
    6: Copenhagen DK (P28 — 615)
    7: Helsinki FI (P29 — 446)
    8: Istanbul TR (P30 — 178)
    9: London UK (P31 — 1994 LARGEST)
    10: Stockholm SE (P32 — 24)
    11: Milan IT (P34 — 350)
    12: Rome IT (P34 — 131)
  japan_signature: REGIONAL_MONOPOLY_ARCHITECTURAL_SIMPLIFICATION_NO_4BIS_5

# ---------------------------------------------------------------
# Discipline #36 cross-border tolerance
# ---------------------------------------------------------------
discipline_36_tolerance:
  boundary_tolerance_km: 6.0
  entry_added_to: cross_border_tolerances.json
  rationale_summary: |
    6.0 km tolerance — MATCHES Portugal P33 highest Wave 4 tolerance.
    Justified by: (a) 430 inhabited islands + ~7,000 total islands;
    (b) Ogasawara/Bonin 1,000 km south of Tokyo; (c) Sakishima
    2,500 km southwest of mainland (Yonaguni close to Taiwan);
    (d) Rebun+Rishiri north of Hokkaido; (e) Sanriku Coast fjord-like
    ria coastline; (f) Seto Inland Sea complex archipelago; (g)
    disputed islands (Kuril + Takeshima + Senkaku).
  expected_drops_estimate:
    subs: 100_300
    lines: 50_150

