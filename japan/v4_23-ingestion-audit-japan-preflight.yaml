    lines: out geom
  portugal_p33_bi_directional_option_b_inheritance:
    lines_side_sweden_p32_inheritance:
      include_power_minor_line: true
      accept_no_voltage_with_inference: true
      voltage_inference_defaults_kv:
        minor_line: 6.6  # 🌍 JAPANESE MV STANDARD (unique cohort-wide)
        cable_no_voltage: 6.6  # JAPANESE MV standard for cables
        line_no_voltage: 66.0  # JAPANESE subtransmission (vs Italy 132 / Portugal 60)
    subs_side_portugal_p33_extension:
      accept_no_voltage_with_inference: true
      voltage_inference_defaults_kv:
        substation_transmission: 275.0  # Japanese 275 kV HV standard
        substation_distribution: 6.6  # 🌍 JAPANESE MV STANDARD
        substation_minor_distribution: 6.6  # same 6.6 kV rural
        substation_traction: 1.5  # JR 1.5 kV DC classic (vs Italy 3 kV DC / Portugal 25 kV AC)
        power_substation_generic: 6.6  # Japanese MV default
  merger_operations_required:
    - substation_id_assignment
    - line_id_assignment
    - polyline_conversion_to_compact_p_array
    - line_endpoint_ss_se_matching_string_ids
