  publisher: OpenStreetMap contributors via Overpass API
  licence: ODbL (Open Database License) — attribution required
  endpoint_primary: https://overpass-api.de/api/interpreter
  endpoint_fallback: https://overpass.kumi.systems/api/interpreter
  expected_query_scope: >
    3 element-type queries for substations (way + node + relation) + 1
    combined query for lines (power=line + cable + minor_line). Area
    header: area["ISO3166-1"="GR"]->.gr
  expected_yield:
    substations_way: 1500-3500           # Greek density ~30-40% of Central European per-capita
    substations_node: 500-1500
    substations_relation: 10-30
    lines: 6000-18000                    # Balkan-Mediterranean line-density profile (lower than Central Europe due to island coverage)
    line_ratio_pre_merge: 3.5-5.0        # Balkans-adjusted average
    total_raw_bytes: ~15-40 MB           # Small fetch (below Slovakia P19 scale)
  expected_scale_context: >
    Greece is SMALLEST Wave 3 cohort (556 subs baseline). Expected 3-8×
    increase to ~2000-4500 net-new substations. FIRST Wave 3 country
    — resets smallest-first cadence pattern post-Poland (LARGEST Wave 2).
    Architecturally SIMPLEST post-Convention-#78-BINDING: single
    national DSO + straightforward TSO/DSO partition + no complex
    Layer 3 geofence needed (unlike Warsaw metro Poland or Prague
    metro Czechia). Estimated ~4-6 min sandbox fetch (safely within
    timeout).

# ── Grid architecture — SINGLE national DSO makes attribution trivial ───

grid_architecture:
  tso_transmission:
    operator_id: ADMIE-IPTO
    operator_names_aliases:
      - "ADMIE"                                  # Latin transliteration
      - "ΑΔΜΗΕ"                                  # Greek script
      - "IPTO"                                   # English acronym
      - "Independent Power Transmission Operator"
      - "ΑΝΕΞΑΡΤΗΤΟΣ ΔΙΑΧΕΙΡΙΣΤΗΣ ΜΕΤΑΦΟΡΑΣ ΗΛΕΚΤΡΙΚΗΣ ΕΝΕΡΓΕΙΑΣ"
      - "ADMIE Holding SA"
    voltage_thresholds:
      backbone_kv: 400                            # 400 kV EHV (Continental European sync)
      high_voltage_kv: 150                        # 150 kV HV mainland
      subtransmission_kv: 66                      # 66 kV subtransmission (some regions)
    tso_threshold_rule: "≥66 kV → ADMIE/IPTO"     # SIMPLE — all HV+ to national TSO
    established: 2011                             # Unbundled from PPC ownership
    pre_2011_operator: DEI (Public Power Corporation)
    predecessor_alias_generation: 1               # Single rebrand generation (unlike Poland's multi-generation cascade)

  dso_distribution:
    operator_id: DEDDIE-HEDNO
    operator_names_aliases:
      - "DEDDIE"                                  # Latin transliteration
      - "ΔΕΔΔΗΕ"                                  # Greek script
      - "HEDNO"                                   # English acronym
      - "Hellenic Electricity Distribution Network Operator"
      - "ΔΙΑΧΕΙΡΙΣΤΗΣ ΕΛΛΗΝΙΚΟΥ ΔΙΚΤΥΟΥ ΔΙΑΝΟΜΗΣ ΗΛΕΚΤΡΙΚΗΣ ΕΝΕΡΓΕΙΑΣ"
      - "HEDNO SA"
      - "DEDDIE SA"
      - "ΔΕΔΔΗΕ ΑΕ"
    voltage_thresholds:
      mv_kv: 20                                   # 20 kV medium voltage MV
      lv_v: [230, 400]                            # 230/400 V low voltage LV
    dso_threshold_rule: "< 66 kV → DEDDIE/HEDNO"  # SIMPLE — all sub-transmission to national DSO
    established: 2012                             # Unbundled from PPC/DEI
    pre_2012_operator: DEI (PPC Distribution branch)
    predecessor_alias_generation: 1               # Same rebrand event as ADMIE (2011-2012 grid unbundling)
    coverage: "National — SINGLE DSO covers all mainland + interconnected islands"
    architectural_note: >
      Greece has SINGLE national DSO (unlike Poland's 4-DSO partition or
      even Czechia's E.ON+ČEZ split). NO Convention #78 §4bis.5 Layer 3
      geofence needed — the DSO territory is the entire country. Owner
      attribution simplifies to: voltage-class + single-DSO default.

  private_captives_estimated:
    - "Aluminium of Greece SA (Distomo alumina/aluminium plant)"
    - "Hellenic Petroleum (ELPE) refineries — Aspropyrgos + Elefsina + Thessaloniki"
    - "Larco (Ferronickel Larymna) — historic captive"
    - "PPC/DEI generation captives at Ptolemaida/Kozani lignite complex"
    - "Corinth Pipeworks (Thisvi steel)"
    - "Hellenic Sugar Industry (Serres + Xanthi)"
    - "OSE (Hellenic Railways — 25 kV AC / 750 V DC traction)"
    - "Attiko Metro (Athens metro traction — 750 V DC)"
    - "STASY (Athens tram + electric trolleybus — 600 V DC)"

  island_grid_topology:
    interconnected_islands_2020_2024:
      - Crete (via ADMIE 150 kV HVAC + 500 kV HVDC Ariadne 2021)
      - Cyclades cluster (2018 interconnection)
      - Northern Aegean (Lesvos, Chios — 2022 interconnection)
      - Dodecanese partial (Kalymnos, Kos)
    remaining_isolated_micro_grids:
      - Ionian small islands (Kythira, Antikythira)
      - Small Dodecanese (Astypalaia — became green pilot 2020)
      - Small Cyclades (Anafi, Amorgos partial)
    architectural_relevance: >
      Isolated micro-grids do not affect Convention #78 attribution (still
      DEDDIE-owned) but may have distinct voltage tags in OSM (e.g. 6.6 kV
      distribution on some small islands). Verify at Step 2 fetch.

# ── Convention #78 BINDING 4th enforcement (post-Poland cumulative) ──────

convention_78_binding_4th_enforcement:
  enforcement_number: 4
  cumulative_6_country_hits_pre_greece: 20406
    # Latvia 1 + Estonia 20 + Latvia 143 + Slovakia 615 + Czechia 5178 + Poland 14449 = 20406
  expected_greece_alias_hits: 800-2500
    # LOWER than Poland (14449) or Czechia (5178) due to smaller fleet + simpler alias structure
    # Greek script transliteration dominant class; single-generation rebrand simplifies
  cumulative_7_country_hits_post_greece: 21206-22906
  cadence_precedent_ratio_post_greece: 2120-2290× above 10-instance BINDING threshold
  status_signal: "Convention #78 BINDING continues cohort-wide adoption — 4th enforcement"

  alias_class_distribution_estimated:
    greek_script: HIGH                           # ΑΔΜΗΕ / ΔΕΔΔΗΕ / ΔΕΗ / ΑΕ suffix — dominant class
    latin_transliteration: HIGH                  # ADMIE / DEDDIE / IPTO / HEDNO / DEI — parallel entries
    english_acronym: MODERATE                    # IPTO + HEDNO English variants
    legal_form_variants:                         # ΑΕ / SA / Α.Ε. / Anonymos Etaireia variants
      - "ΑΕ"
      - "Α.Ε."
      - "SA"
      - "S.A."
      - "Anonymos Etaireia"
    typographic_quotes: LOW                      # Greek typography rarely uses quoted names
    diacritics_class: MODERATE                   # Greek accented letters (τόνος + διαλυτικά)
    predecessor_rebrand_alias_classes:
      dei_ppc_pre_2011_pre_2012_rebrand: HIGH    # DEI/ΔΕΗ predecessor to both ADMIE + DEDDIE
      pre_unbundling_integrated_utility: MODERATE # Some old substations tagged with "DEI" or "Public Power Corporation"
    conventional_alias_note: >
      Greece's Convention #78 empirical scope is SIMPLER than Poland's
      because (a) single-generation rebrand event (2011-2012 unbundling)
      vs Poland's 4-generation cascade; (b) single national DSO vs
      Poland's 4-DSO partition. Multi-script (Greek + Latin) is the
      dominant alias-normalisation challenge; predecessor tracking is
      shallow (single generation depth).

