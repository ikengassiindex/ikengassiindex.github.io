# ── Convention #78 §4bis.5 Layer 3 geofence — NOT NEEDED ────────────────

convention_78_4bis_5_layer_3_geofence:
  status: NOT_REQUIRED
  rationale: >
    Greece has SINGLE national DSO (DEDDIE/HEDNO). No sub-national DSO
    territorial partition exists. Layer 3 lat/lon geofence pattern
    (introduced Prague metro Czechia + refined Warsaw metro Poland
    Innogy Stoen) applies ONLY where multiple DSOs partition the
    territory. Greece post-2012 unbundling consolidated all distribution
    under a single operator. Cumulative post-Greece cohort will still
    show 3 Layer 3 §4bis.5 enforcements (Prague + Warsaw narrow +
    reserved for future multi-DSO countries).

