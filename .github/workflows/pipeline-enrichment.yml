name: SSI Pipeline — Data Enrichment

# Runs monthly (1st Thursday, 06:00 UTC — well before Intelligence refresh at 10:00 UTC)
# Also supports manual trigger with country selection
on:
  schedule:
    # KB §91.A — narrow cron to "every Thursday at 06:00 UTC", then runtime-gate
    # to dom <= 7 (1st Thursday). The previous expression '0 6 1-7 * 4' looked
    # like "1st Thursday" but GitHub Actions cron uses OR semantics when both
    # day-of-month AND day-of-week are restricted, so it fired ~10×/month.
    - cron: '0 6 * * 4'  # every Thursday at 06:00 UTC (runtime-gated below)
  workflow_dispatch:
    inputs:
      countries:
        description: 'Countries to process (comma-separated, or "all")'
        required: false
        default: 'all'
      skip_rescore:
        description: 'Skip Monte Carlo rescoring (faster, data-only)'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (preview only, no writes)'
        required: false
        type: boolean
        default: false


# KB §49.7 — Prevent commit-push race when two workflows push to main
concurrency:
  group: pipeline-enrichment-main
  cancel-in-progress: false

permissions:
  contents: write

env:
  CDS_API_KEY: ${{ secrets.CDS_API_KEY }}

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # KB §91.B — gate scheduled runs to 1st Thursday (dom <= 7). Manual
      # workflow_dispatch always proceeds. If this is a scheduled run and
      # today is NOT in the first calendar week, exit 0 (no-op success).
      - name: Gate to 1st Thursday (scheduled runs only)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DOM=$(date -u +%-d)
            if [ "$DOM" -gt "7" ]; then
              echo "::notice::Scheduled run on day-of-month=$DOM — not 1st Thursday. Exiting."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: |
          pip install --upgrade pip
          # Optional: netCDF4 for real CDS data processing
          # pip install netCDF4 cdsapi
          # Discipline #36 — shapely required for the post-ingestion cross-border
          # remediation step. Lazy-imported by scripts/pipeline/utils/geo.py so
          # absence wouldn't break the ingestion run itself, but the remediation
          # step needs it. See CROSS_BORDER_SUBSTATION_AUDIT_20260618.md.
          pip install 'shapely>=2.0'
          echo "Pipeline uses stdlib + shapely (Discipline #36)"

      - name: Restore ingestion cache
        if: steps.gate.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: scripts/pipeline/.cache
          key: ssi-pipeline-cache-${{ github.run_number }}
          restore-keys: |
            ssi-pipeline-cache-

      - name: Determine countries
        id: countries
        if: steps.gate.outputs.skip != 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            COUNTRIES="${{ github.event.inputs.countries }}"
          else
            COUNTRIES="all"
          fi
          echo "countries=$COUNTRIES" >> $GITHUB_OUTPUT

      - name: Run pipeline
        if: steps.gate.outputs.skip != 'true'
        run: |
          COUNTRIES="${{ steps.countries.outputs.countries }}"
          FLAGS=""

          if [ "$COUNTRIES" = "all" ]; then
            FLAGS="--all"
          else
            FLAGS=$(echo "$COUNTRIES" | tr ',' ' ')
          fi

          if [ "${{ github.event.inputs.skip_rescore }}" = "true" ]; then
            FLAGS="$FLAGS --skip-rescore"
          fi

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi

          python -m scripts.pipeline.run $FLAGS --output-report pipeline-report.json -v

      - name: Upload pipeline report
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-report-${{ github.run_number }}
          path: pipeline-report.json

      # ── Discipline #36 — Post-ingestion cross-border filter ──
      # Closes the failure-mode that surfaced 18 Jun 2026: ingestion bounding-box
      # queries against upstream OSM/regulator sources overshoot national polygons,
      # so per-country ssi-data.json inherits substations from neighbours. Without
      # this step the monthly pipeline silently re-leaks ~17% of cohort substations
      # (Austria 47.5%, Canada 74.4%, Greenland 86.5% pre-fix).
      #
      # The remediation script (scripts/remediate_cross_border.py) loads each
      # country's bounds.json + cross_border_tolerances.json, performs point-in-
      # polygon filtering with optional coastline tolerance, recomputes meta +
      # fleet_summary + regions, and writes the cleaned ssi-data.json in place.
      # Idempotent — countries already inside the threshold pass through unchanged.
      #
      # Then clean_grid_geo.py propagates the filter to grid-geo.json (substations
      # + connecting lines + areas — connecting lines that cross borders to filtered-
      # in substations are KEPT per the "keep relevant power lines" requirement);
      # refresh_country_counts.py propagates the post-remediation counts to every
      # country's HTML/JS pages + the root landing data-subs.
      #
      # See CROSS_BORDER_SUBSTATION_AUDIT_20260618.md + PR_CROSS_BORDER_GUARD.md.
      - name: Post-ingestion cross-border remediation (Discipline #36)
        if: steps.gate.outputs.skip != 'true' && github.event.inputs.dry_run != 'true'
        run: |
          COUNTRIES=$(python3 -c "import json; print(' '.join(json.load(open('intelligence/countries.json'))['slugs']))")
          echo "::group::Cross-border remediation — substation filter per country"
          for DIR in $COUNTRIES; do
            if [ -f "$DIR/bounds.json" ] && [ -f "$DIR/ssi-data.json" ]; then
              # --force allows the script to rewrite even if outside-% is below
              # the default 5% threshold; the script remains idempotent because
              # already-clean canonicals produce identical output.
              python3 scripts/remediate_cross_border.py "$DIR" --force || {
                echo "::warning::remediate_cross_border failed for $DIR — continuing"
              }
            else
              echo "  SKIP $DIR: missing bounds.json or ssi-data.json"
            fi
          done
          echo "::endgroup::"

          echo "::group::Cross-border remediation — grid-geo line filter"
          # --all-remediated walks every country whose ssi-data.json was modified
          # in the loop above and rewrites the matching grid-geo.json. Lines that
          # connect filtered-in substations to filtered-out ones are evaluated
          # against the "keep relevant power lines" rule.
          python3 scripts/clean_grid_geo.py --all-remediated || {
            echo "::warning::clean_grid_geo --all-remediated failed — continuing"
          }
          echo "::endgroup::"

          echo "::group::Cross-border remediation — refresh hardcoded counts"
          python3 scripts/refresh_country_counts.py --all-remediated || {
            echo "::warning::refresh_country_counts --all-remediated failed — continuing"
          }
          echo "::endgroup::"

          echo "::group::Cross-border remediation — final audit"
          # The sentinel runs after remediation to confirm cohort is clean. If any
          # country still has >5% outside its polygon (after tolerance), exit
          # non-zero so the workflow fails before committing dirty data.
          python3 scripts/check_cross_border.py --all --strict --json audit/cross-border-$(date -u +%Y-%m-%d).json
          echo "::endgroup::"

      - name: Cache-bust ESG report assets
        if: steps.gate.outputs.skip != 'true' && github.event.inputs.dry_run != 'true'
        run: |
          STAMP=$(date +%s)
          # KB §57 — iterate countries.json single source of truth (no more hardcoded list).
          # Previously hardcoded 24 countries here, silently excluding BE/NL/LU/CZ/LV/LT/EE
          # from the monthly enrichment loop. Per KB §49.8, the slug list lives in
          # intelligence/countries.json and is the only place it should ever live.
          COUNTRIES=$(python3 -c "import json; print(' '.join(json.load(open('intelligence/countries.json'))['slugs']))")
          for DIR in $COUNTRIES; do
            if [ -f "$DIR/esg-report.html" ]; then
              sed -i "s|intelligence-loader\.js[^\"]*|intelligence-loader.js?v=${STAMP}|g" "$DIR/esg-report.html"
              sed -i "s|nav\.js[^\"]*|nav.js?v=${STAMP}|g" "$DIR/esg-report.html"
              sed -i "s|style\.css[^\"]*|style.css?v=${STAMP}|g" "$DIR/esg-report.html"
            fi
          done

      - name: Commit enriched data
        if: steps.gate.outputs.skip != 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "SSI Pipeline Bot"
          git config user.email "pipeline@ikengassiindex.github.io"

          # 2026-09-03: was `git add -A`, which stages untracked files too. On a
          # runner that is normally harmless; in practice it means any file left
          # in the tree gets committed as pipeline enrichment work, authored by
          # the bot, inside a commit message about seismic and climate data.
          # `-u` stages tracked modifications ONLY and structurally cannot adopt
          # a stranger. On a clean CI checkout every tracked modification is by
          # definition this run's own work, so -u is exact here.
          git add -u
          UNTRACKED=$(git ls-files --others --exclude-standard)
          if [ -n "$UNTRACKED" ]; then
            echo "::warning::untracked files present and NOT committed:"
            echo "$UNTRACKED" | sed 's/^/::warning::  /'
          fi
          CHANGES=$(git diff --cached --stat)
          if [ -n "$CHANGES" ]; then
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "pipeline: data enrichment run — ${TIMESTAMP}

          Automated ingestion + scoring pipeline:
          - Seismic PGA overlay (INGV MPS04 / national sources)
          - Climate trajectory (CMIP6 SSP2-4.5)
          - Socio-economic enrichment (national statistics)
          - Monte Carlo rescoring (10k iterations)

          See pipeline-report artifact for full diff."
            # KB §91.A — pull-rebase before push to defuse the cron race
            # against external pushes (intelligence/esg-refresh, manual).
            #
            # 2026-09-03: the fallback was `git pull --no-rebase -X ours`, on the
            # reasoning that "we always want to keep our enrichment data". That
            # resolves every conflicting hunk in this run's favour, silently. The
            # manifests are single-line JSON, so ANY concurrent change to the same
            # file is a whole-file conflict — meaning the fallback could discard
            # another writer's published work with no record that it happened.
            #
            # A conflict here is a real event: two writers changed the same
            # country in the same window. It should stop and tell someone, not
            # pick a winner. Rebase is retried, because a retry resolves the
            # ordinary case where the other push simply landed first.
            PUSHED=0
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin main && git push origin main; then
                PUSHED=1
                break
              fi
              echo "::notice::rebase/push attempt ${attempt} failed; retrying"
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            if [ "$PUSHED" != "1" ]; then
              echo "::error::Could not rebase cleanly onto origin/main after 3 attempts."
              echo "::error::Another writer changed the same files during this run."
              echo "::error::REFUSING to resolve with -X ours — that would discard their"
              echo "::error::work silently. Re-run the pipeline once main is settled."
              exit 1
            fi
            echo "✓ Committed and pushed enriched data"
          else
            echo "No changes to commit"
          fi
