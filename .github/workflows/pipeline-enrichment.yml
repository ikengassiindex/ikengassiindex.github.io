name: SSI Pipeline — Data Enrichment

# Runs monthly (1st Thursday, 06:00 UTC — well before Intelligence refresh at 10:00 UTC)
# Also supports manual trigger with country selection
on:
  schedule:
    # KB §91.A — narrow cron to "every Thursday at 06:00 UTC", then runtime-gate
    # to dom <= 7 (1st Thursday). The previous expression '0 6 1-7 * 4' looked
    # like "1st Thursday" but GitHub Actions cron uses OR semantics when both
    # day-of-month AND day-of-week are restricted, so it fired ~10×/month.
    - cron: '0 6 * * 4'  # every Thursday at 06:00 UTC (runtime-gated below)
  workflow_dispatch:
    inputs:
      countries:
        description: 'Countries to process (comma-separated, or "all")'
        required: false
        default: 'all'
      skip_rescore:
        description: 'Skip Monte Carlo rescoring (faster, data-only)'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (preview only, no writes)'
        required: false
        type: boolean
        default: false


# KB §49.7 — Prevent commit-push race when two workflows push to main
concurrency:
  group: pipeline-enrichment-main
  cancel-in-progress: false

permissions:
  contents: write

env:
  CDS_API_KEY: ${{ secrets.CDS_API_KEY }}

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # KB §91.B — gate scheduled runs to 1st Thursday (dom <= 7). Manual
      # workflow_dispatch always proceeds. If this is a scheduled run and
      # today is NOT in the first calendar week, exit 0 (no-op success).
      - name: Gate to 1st Thursday (scheduled runs only)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DOM=$(date -u +%-d)
            if [ "$DOM" -gt "7" ]; then
              echo "::notice::Scheduled run on day-of-month=$DOM — not 1st Thursday. Exiting."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: |
          pip install --upgrade pip
          # Optional: netCDF4 for real CDS data processing
          # pip install netCDF4 cdsapi
          echo "Pipeline uses stdlib only — no external dependencies required"

      - name: Restore ingestion cache
        if: steps.gate.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: scripts/pipeline/.cache
          key: ssi-pipeline-cache-${{ github.run_number }}
          restore-keys: |
            ssi-pipeline-cache-

      - name: Determine countries
        id: countries
        if: steps.gate.outputs.skip != 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            COUNTRIES="${{ github.event.inputs.countries }}"
          else
            COUNTRIES="all"
          fi
          echo "countries=$COUNTRIES" >> $GITHUB_OUTPUT

      - name: Run pipeline
        if: steps.gate.outputs.skip != 'true'
        run: |
          COUNTRIES="${{ steps.countries.outputs.countries }}"
          FLAGS=""

          if [ "$COUNTRIES" = "all" ]; then
            FLAGS="--all"
          else
            FLAGS=$(echo "$COUNTRIES" | tr ',' ' ')
          fi

          if [ "${{ github.event.inputs.skip_rescore }}" = "true" ]; then
            FLAGS="$FLAGS --skip-rescore"
          fi

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi

          python -m scripts.pipeline.run $FLAGS --output-report pipeline-report.json -v

      - name: Upload pipeline report
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-report-${{ github.run_number }}
          path: pipeline-report.json

      - name: Cache-bust ESG report assets
        if: steps.gate.outputs.skip != 'true' && github.event.inputs.dry_run != 'true'
        run: |
          STAMP=$(date +%s)
          # KB §57 — iterate countries.json single source of truth (no more hardcoded list).
          # Previously hardcoded 24 countries here, silently excluding BE/NL/LU/CZ/LV/LT/EE
          # from the monthly enrichment loop. Per KB §49.8, the slug list lives in
          # intelligence/countries.json and is the only place it should ever live.
          COUNTRIES=$(python3 -c "import json; print(' '.join(json.load(open('intelligence/countries.json'))['slugs']))")
          for DIR in $COUNTRIES; do
            if [ -f "$DIR/esg-report.html" ]; then
              sed -i "s|intelligence-loader\.js[^\"]*|intelligence-loader.js?v=${STAMP}|g" "$DIR/esg-report.html"
              sed -i "s|nav\.js[^\"]*|nav.js?v=${STAMP}|g" "$DIR/esg-report.html"
              sed -i "s|style\.css[^\"]*|style.css?v=${STAMP}|g" "$DIR/esg-report.html"
            fi
          done

      - name: Commit enriched data
        if: steps.gate.outputs.skip != 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "SSI Pipeline Bot"
          git config user.email "pipeline@ikengassiindex.github.io"
          git add -A
          CHANGES=$(git diff --cached --stat)
          if [ -n "$CHANGES" ]; then
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "pipeline: data enrichment run — ${TIMESTAMP}

          Automated ingestion + scoring pipeline:
          - Seismic PGA overlay (INGV MPS04 / national sources)
          - Climate trajectory (CMIP6 SSP2-4.5)
          - Socio-economic enrichment (national statistics)
          - Monte Carlo rescoring (10k iterations)

          See pipeline-report artifact for full diff."
            # KB §91.A — pull-rebase before push to defuse cron race
            # against external pushes (intelligence/esg-refresh, manual).
            # Fallback to merge -X ours if rebase conflicts (we always want
            # to keep our enrichment data).
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && break
              echo "Rebase attempt ${attempt} failed; trying merge -X ours"
              git rebase --abort 2>/dev/null || true
              git pull --no-rebase --no-edit -X ours origin main && break
              sleep 5
            done
            git push origin main
            echo "✓ Committed and pushed enriched data"
          else
            echo "No changes to commit"
          fi
