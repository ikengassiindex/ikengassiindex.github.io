name: Monthly Intelligence & ESG Refresh
on:
  schedule:
    # KB §91.B — narrow cron to "every Thursday at 10:00 UTC", then runtime-gate
    # to 8 <= dom <= 14 (2nd Thursday). The previous expression '0 10 8-14 * 4'
    # used GitHub's OR semantics for restricted DOM+DOW, firing ~10×/month.
    - cron: '0 10 * * 4'  # every Thursday at 10:00 UTC (runtime-gated below)
  workflow_dispatch:
    inputs:
      force_edition:
        description: 'Force a specific edition number (leave empty for auto-increment)'
        required: false
        type: string
      skip_archive:
        description: 'Skip PDF/HTML archival and email (true/false)'
        required: false
        default: 'false'
        type: string


# KB §49.7 — Prevent commit-push race between the THREE workflows that push
# to main (pipeline-enrichment, monthly-refresh, esg-refresh). Until
# 2026-09-10 each declared its OWN group name, which serialises a workflow
# only against itself: GitHub applies concurrency within a group, so three
# different names gave no mutual exclusion at all and the comment claiming
# otherwise was false. One shared group, queued rather than cancelled.
concurrency:
  group: ssi-main-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # KB §91.B — gate scheduled runs to 2nd Thursday (8 <= dom <= 14).
      # Manual workflow_dispatch always proceeds.
      - name: Gate to 2nd Thursday (scheduled runs only)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DOM=$(date -u +%-d)
            if [ "$DOM" -lt "8" ] || [ "$DOM" -gt "14" ]; then
              echo "::notice::Scheduled run on day-of-month=$DOM — not 2nd Thursday. Exiting."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── Step 1: Archive current pages (before rotation) as PDF + HTML + email ──
      - name: Install Playwright for PDF/HTML capture
        if: ${{ steps.gate.outputs.skip != 'true' && github.event.inputs.skip_archive != 'true' }}
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Archive Intelligence + ESG pages (PDF + HTML + email)
        if: ${{ steps.gate.outputs.skip != 'true' && github.event.inputs.skip_archive != 'true' }}
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          MAIL_SENDER: ssi_index@ikenga.eu
          ARCHIVE_EMAIL: ssi_index@ikenga.eu
        run: python3 scripts/archive-and-email.py

      - name: Upload run log artifact
        if: ${{ always() && steps.gate.outputs.skip != 'true' && github.event.inputs.skip_archive != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ssi-archive-run-log
          path: archive/_logs/run-*.json
          if-no-files-found: warn
          retention-days: 90

      # ── Step 2: Update edition config ──
      - name: Update edition config
        if: steps.gate.outputs.skip != 'true'
        run: python3 scripts/update-edition.py

      - name: Override edition if forced
        if: ${{ steps.gate.outputs.skip != 'true' && github.event.inputs.force_edition != '' }}
        run: |
          python3 -c "
          import json
          with open('intelligence/edition-config.json', 'r') as f:
              config = json.load(f)
          config['current_edition'] = int('${{ github.event.inputs.force_edition }}')
          with open('intelligence/edition-config.json', 'w') as f:
              json.dump(config, f, indent=2, ensure_ascii=False)
              f.write('\n')
          print(f'Edition forced to {config[\"current_edition\"]:03d}')
          "

      # ── Step 3: Cache-bust and commit (includes archive/ folder) ──
      - name: Cache-bust intelligence + ESG assets
        if: steps.gate.outputs.skip != 'true'
        run: |
          STAMP=$(date +%s)
          CURRENT_YM=$(date -u +%Y-%m)
          # Country slugs + first-refresh gates come from intelligence/countries.json
          # (single source of truth, also consumed by scripts/archive-and-email.py).
          COUNTRIES=$(python3 -c "import json; print(' '.join(json.load(open('intelligence/countries.json'))['slugs']))")
          for country in $COUNTRIES; do
            FIRST=$(python3 -c "import json; print(json.load(open('intelligence/countries.json'))['first_refresh'].get('$country', ''))")
            # KB §91.C — truncate to YYYY-MM so "2026-06-04" compares cleanly
            # against CURRENT_YM "2026-06". Previously a YYYY-MM-DD value would
            # always evaluate as > YYYY-MM and silently skip the country.
            FIRST_YM="${FIRST:0:7}"
            if [ -n "$FIRST_YM" ] && [ "$CURRENT_YM" \< "$FIRST_YM" ]; then
              echo "  SKIP ${country}: first automated refresh ${FIRST} (current ${CURRENT_YM})"
              continue
            fi
            if [ -f "${country}/intelligence.html" ]; then
              sed -i "s|intelligence-loader\.js?v=[0-9]*|intelligence-loader.js?v=${STAMP}|g" "${country}/intelligence.html"
            fi
            if [ -f "${country}/esg-report.html" ]; then
              sed -i "s|ssi-data\.json?v=[0-9]*|ssi-data.json?v=${STAMP}|g" "${country}/esg-report.html"
            fi
          done

      # KB §91.E — negative-zero gate, added 2026-09-11.
      # round() on a small negative yields -0.0: equal to 0.0, but serialised
      # as the token "-0.0". It reached production as metrics.I1 = -0.0 on
      # 23,997 substations (a negative snow load) and, once swept, as 251 more
      # in modifier_impacts.* and skewness across 30 countries. The producer
      # was fixed at five boundaries in the scoring engine (5bcaf8e8) and the
      # records cleaned (63b011f6); this stops it coming back.
      #
      # It runs HERE and not in validate.yml because validate.yml uses a
      # sparse checkout that pulls */ssi-data.json but not the shards - where
      # every one of the 251 actually lived. A gate that cannot see the data
      # is a bar that cannot fail. This job checks out the full tree, so the
      # audit refuses if any declared shard is missing rather than reporting
      # clean.
      # KB §91.F — reproducibility gate, added 12 September 2026.
      # Every metric is published alongside a raw counterpart so a reader can
      # verify it WITHOUT trusting the producer. On 12 September that promise
      # was found broken on 149,320 records across three metrics: I1 at 7.457
      # per cent and I5 at 16.450 (metric computed from an unrounded raw while
      # the raw was published rounded), and I1/I2 published on [0, 0.30] while
      # I3-I6 used [0, 1], which also made _<C>_from_metrics mix two scales.
      #
      # All six now reproduce exactly. This stops any of it coming back, and
      # means I7, I8 and I9 inherit the guarantee instead of each having to be
      # caught the way these six were.
      #
      # It runs HERE rather than in validate.yml for the same reason as the
      # negative-zero gate: validate.yml's sparse checkout pulls */ssi-data.json
      # but not the shards, and the gate refuses rather than passing when a
      # declared shard is missing.
      - name: Metric reproducibility gate
        if: steps.gate.outputs.skip != 'true'
        run: python3 scripts/verify_metrics_reproducible.py --gate

      - name: Negative-zero gate on published records
        if: steps.gate.outputs.skip != 'true'
        run: python3 scripts/audit_published_json.py --gate

      - name: Commit and push (edition update + archive files)
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # KB §91.D — explicit scope, not a sweep. `git add -u` alone would
          # BREAK this workflow: archive-and-email.py creates archive/<YYYY-MM>/
          # and archive/_logs/run-<key>.json, which are new files. So -A is
          # kept but confined to archive/, and every other path this workflow
          # writes is named. Nothing at the repo root is swept.
          git add -A -- archive/
          git add -u -- intelligence/edition-config.json prev_edition_key.txt \
                        '*/ssi-data.json' '*/intelligence.html' '*/esg-report.html'
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            EDITION=$(python3 -c "import json; print(json.load(open('intelligence/edition-config.json'))['current_edition'])")
            git commit -m "chore: monthly refresh — Edition $(printf '%03d' $EDITION) + archive [$(date +%Y-%m-%d)]"
            # KB §91.A — pull-rebase before push to defuse cron race against
            # external pushes.
            #
            # 2026-09-10: the `-X ours` merge fallback was REMOVED. It resolved
            # every conflicting hunk in favour of the bot, silently discarding
            # a human change to the same file — no conflict, no error, a
            # clean-looking merge commit. This workflow rewrites
            # */ssi-data.json, the file that carries every derived metric, so
            # that fallback could revert a freshly-derived I1 or I2 across all
            # 39 countries and leave nothing in the diff to show it.
            #
            # The same removal was made in pipeline-enrichment.yml on
            # 2026-09-03 and was recorded as complete; it was not. Three
            # workflows push to main and only one had been repaired.
            #
            # A rebase that will not converge in three attempts is now a HARD
            # FAILURE. A refresh that has to be re-run is cheap; a derivation
            # silently reverted is not.
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && break
              echo "::warning::Rebase attempt ${attempt} failed"
              git rebase --abort 2>/dev/null || true
              if [ "${attempt}" = "3" ]; then
                echo "::error::Could not rebase onto origin/main after 3 attempts."
                echo "::error::Refusing to merge with -X ours — that would discard"
                echo "::error::whatever is on main. Re-run this workflow instead."
                exit 1
              fi
              sleep 5
            done
            git push origin main
          fi
