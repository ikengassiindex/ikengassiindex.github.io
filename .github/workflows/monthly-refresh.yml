name: Monthly Intelligence & ESG Refresh
on:
  schedule:
    # KB §91.B — narrow cron to "every Thursday at 10:00 UTC", then runtime-gate
    # to 8 <= dom <= 14 (2nd Thursday). The previous expression '0 10 8-14 * 4'
    # used GitHub's OR semantics for restricted DOM+DOW, firing ~10×/month.
    - cron: '0 10 * * 4'  # every Thursday at 10:00 UTC (runtime-gated below)
  workflow_dispatch:
    inputs:
      force_edition:
        description: 'Force a specific edition number (leave empty for auto-increment)'
        required: false
        type: string
      skip_archive:
        description: 'Skip PDF/HTML archival and email (true/false)'
        required: false
        default: 'false'
        type: string


# KB §49.7 — Prevent commit-push race when two workflows push to main
concurrency:
  group: monthly-refresh-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # KB §91.B — gate scheduled runs to 2nd Thursday (8 <= dom <= 14).
      # Manual workflow_dispatch always proceeds.
      - name: Gate to 2nd Thursday (scheduled runs only)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DOM=$(date -u +%-d)
            if [ "$DOM" -lt "8" ] || [ "$DOM" -gt "14" ]; then
              echo "::notice::Scheduled run on day-of-month=$DOM — not 2nd Thursday. Exiting."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── Step 1: Archive current pages (before rotation) as PDF + HTML + email ──
      - name: Install Playwright for PDF/HTML capture
        if: ${{ steps.gate.outputs.skip != 'true' && github.event.inputs.skip_archive != 'true' }}
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Archive Intelligence + ESG pages (PDF + HTML + email)
        if: ${{ steps.gate.outputs.skip != 'true' && github.event.inputs.skip_archive != 'true' }}
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          MAIL_SENDER: ssi_index@ikenga.eu
          ARCHIVE_EMAIL: ssi_index@ikenga.eu
        run: python3 scripts/archive-and-email.py

      - name: Upload run log artifact
        if: ${{ always() && steps.gate.outputs.skip != 'true' && github.event.inputs.skip_archive != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ssi-archive-run-log
          path: archive/_logs/run-*.json
          if-no-files-found: warn
          retention-days: 90

      # ── Step 2: Update edition config ──
      - name: Update edition config
        if: steps.gate.outputs.skip != 'true'
        run: python3 scripts/update-edition.py

      - name: Override edition if forced
        if: ${{ steps.gate.outputs.skip != 'true' && github.event.inputs.force_edition != '' }}
        run: |
          python3 -c "
          import json
          with open('intelligence/edition-config.json', 'r') as f:
              config = json.load(f)
          config['current_edition'] = int('${{ github.event.inputs.force_edition }}')
          with open('intelligence/edition-config.json', 'w') as f:
              json.dump(config, f, indent=2, ensure_ascii=False)
              f.write('\n')
          print(f'Edition forced to {config[\"current_edition\"]:03d}')
          "

      # ── Step 3: Cache-bust and commit (includes archive/ folder) ──
      - name: Cache-bust intelligence + ESG assets
        if: steps.gate.outputs.skip != 'true'
        run: |
          STAMP=$(date +%s)
          CURRENT_YM=$(date -u +%Y-%m)
          # Country slugs + first-refresh gates come from intelligence/countries.json
          # (single source of truth, also consumed by scripts/archive-and-email.py).
          COUNTRIES=$(python3 -c "import json; print(' '.join(json.load(open('intelligence/countries.json'))['slugs']))")
          for country in $COUNTRIES; do
            FIRST=$(python3 -c "import json; print(json.load(open('intelligence/countries.json'))['first_refresh'].get('$country', ''))")
            # KB §91.C — truncate to YYYY-MM so "2026-06-04" compares cleanly
            # against CURRENT_YM "2026-06". Previously a YYYY-MM-DD value would
            # always evaluate as > YYYY-MM and silently skip the country.
            FIRST_YM="${FIRST:0:7}"
            if [ -n "$FIRST_YM" ] && [ "$CURRENT_YM" \< "$FIRST_YM" ]; then
              echo "  SKIP ${country}: first automated refresh ${FIRST} (current ${CURRENT_YM})"
              continue
            fi
            if [ -f "${country}/intelligence.html" ]; then
              sed -i "s|intelligence-loader\.js?v=[0-9]*|intelligence-loader.js?v=${STAMP}|g" "${country}/intelligence.html"
            fi
            if [ -f "${country}/esg-report.html" ]; then
              sed -i "s|ssi-data\.json?v=[0-9]*|ssi-data.json?v=${STAMP}|g" "${country}/esg-report.html"
            fi
          done

      - name: Commit and push (edition update + archive files)
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            EDITION=$(python3 -c "import json; print(json.load(open('intelligence/edition-config.json'))['current_edition'])")
            git commit -m "chore: monthly refresh — Edition $(printf '%03d' $EDITION) + archive [$(date +%Y-%m-%d)]"
            # KB §91.A — pull-rebase before push to defuse cron race against
            # external pushes. Fallback to merge -X ours if rebase conflicts;
            # the cron's edition bump + archive payload always wins.
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && break
              echo "Rebase attempt ${attempt} failed; trying merge -X ours"
              git rebase --abort 2>/dev/null || true
              git pull --no-rebase --no-edit -X ours origin main && break
              sleep 5
            done
            git push origin main
          fi
