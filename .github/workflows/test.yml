name: SSI Pipeline Tests

# Runs the pytest suite on every push + PR. Introduced in Phase 1 PR-1 per
# PHASE_1_IMPLEMENTATION_PLAN.md. Each Phase 1 PR adds tests under tests/;
# this workflow is the green-bar that gates merge.

on:
  push:
    paths:
      - 'scripts/pipeline/**'
      - 'tests/**'
      - 'pytest.ini'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'scripts/pipeline/**'
      - 'tests/**'
      - 'pytest.ini'
  workflow_dispatch:

# KB §49.7 — Prevent commit-push race
concurrency:
  group: pipeline-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            scripts/pipeline/requirements.txt
            scripts/pipeline/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/pipeline/requirements-dev.txt

      - name: Verify numpy import
        run: |
          python -c "import numpy as np; print(f'numpy {np.__version__} ok')"

      # The registry's entry COUNT is pinned by tests/test_modifier_registry.py,
      # which is the file people edit when a modifier lands. Asserting it here
      # too created a second copy that nobody updated: it sat at 16 while the
      # registry went to 17 (R7_cyber_v2, Phase 2J, 18 Aug 2026), and because
      # this step runs before pytest it blocked the entire suite for a week.
      # KB §57 single-source-of-truth, applied to a constant. Keep the import
      # check — failing fast on an ImportError is worth the ten seconds.
      - name: Verify modifier registry import
        run: |
          python -c "
          from scripts.pipeline.scoring.modifier_registry import (
              MODIFIER_REGISTRY, compute_modifier_terms, per_modifier_impacts
          )
          assert MODIFIER_REGISTRY, 'MODIFIER_REGISTRY is empty'
          print(f'MODIFIER_REGISTRY: {len(MODIFIER_REGISTRY)} entries (count pinned by tests/test_modifier_registry.py)')
          "

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short

      - name: Run pytest with coverage (Python 3.11 only)
        if: matrix.python-version == '3.11'
        run: |
          pytest tests/ --cov=scripts.pipeline.scoring --cov-report=term-missing
