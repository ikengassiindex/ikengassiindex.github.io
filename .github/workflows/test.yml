name: SSI Pipeline Tests

# Runs the pytest suite on every push + PR. Introduced in Phase 1 PR-1 per
# PHASE_1_IMPLEMENTATION_PLAN.md. Each Phase 1 PR adds tests under tests/;
# this workflow is the green-bar that gates merge.

on:
  push:
    paths:
      - 'scripts/pipeline/**'
      - 'tests/**'
      - 'pytest.ini'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'scripts/pipeline/**'
      - 'tests/**'
      - 'pytest.ini'
  workflow_dispatch:

# KB §49.7 — Prevent commit-push race
concurrency:
  group: pipeline-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            scripts/pipeline/requirements.txt
            scripts/pipeline/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/pipeline/requirements-dev.txt

      - name: Verify numpy import
        run: |
          python -c "import numpy as np; print(f'numpy {np.__version__} ok')"

      - name: Verify modifier registry import
        run: |
          python -c "
          from scripts.pipeline.scoring.modifier_registry import (
              MODIFIER_REGISTRY, compute_modifier_terms, per_modifier_impacts
          )
          assert len(MODIFIER_REGISTRY) == 16, f'Expected 16 entries, got {len(MODIFIER_REGISTRY)}'
          print(f'MODIFIER_REGISTRY: {len(MODIFIER_REGISTRY)} entries')
          "

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short

      - name: Run pytest with coverage (Python 3.11 only)
        if: matrix.python-version == '3.11'
        run: |
          pytest tests/ --cov=scripts.pipeline.scoring --cov-report=term-missing
