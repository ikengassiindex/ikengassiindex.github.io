name: SSI Data Validation

on:
  push:
    paths:
      - '*/ssi-data.json'
      - '*/grid-geo.json'
      - 'versions.json'
      - 'countries.json'
  pull_request:
    paths:
      - '*/ssi-data.json'
      - '*/grid-geo.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/
            versions.json
            countries.json
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate versions.json
        run: |          python3 -c "import json; json.load(open('versions.json')); print('versions.json: valid JSON')"

      - name: Validate countries.json
        run: |
          python3 -c "
          import json
          cfg = json.load(open('countries.json'))
          assert len(cfg) >= 12, f'Expected 12+ countries, got {len(cfg)}'
          for code, c in cfg.items():
            for key in ['name','flag','currency','admin_l1','prefix']:
              assert key in c, f'{code} missing {key}'
          print(f'countries.json: {len(cfg)} countries validated')
          "

      - name: Check data file sizes
        run: |
          python3 -c "
          import os, sys
          issues = []
          for root, dirs, files in os.walk('.'):
            for f in files:
              if f == 'ssi-data.json':
                path = os.path.join(root, f)
                size_mb = os.path.getsize(path) / (1024*1024)
                country = root.strip('./')
                if size_mb > 100:
                  issues.append(f'{country}: {size_mb:.1f} MB EXCEEDS 100 MB limit')
                elif size_mb > 50:
                  print(f'WARNING: {country} ssi-data.json is {size_mb:.1f} MB (> 50 MB)')
          if issues:
            for i in issues: print(f'ERROR: {i}')
            sys.exit(1)
          print('All data files within size limits')
          "

      - name: Summary
        run: echo "Validation passed"
