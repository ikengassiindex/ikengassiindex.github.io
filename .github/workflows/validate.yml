name: SSI Data Validation

on:
  workflow_dispatch:
  push:
    paths:
      - '*/ssi-data.json'
      - '*/grid-geo.json'
      - 'versions.json'
      - 'intelligence/countries.json'
  pull_request:
    paths:
      - '*/ssi-data.json'
      - '*/grid-geo.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Discipline #36 — sparse-checkout extended to include per-country
          # bounds.json + ssi-data.json so the cross-border gate (below) can
          # run point-in-polygon checks. cross_border_tolerances.json carries
          # the per-country tolerance defaults the gate consumes.
          sparse-checkout: |
            scripts/
            versions.json
            intelligence/
            cross_border_tolerances.json
            */bounds.json
            */ssi-data.json
            */grid-geo.json
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate versions.json
        run: |
          python3 -c "import json; json.load(open('versions.json')); print('versions.json: valid JSON')"

      - name: Validate intelligence/countries.json (canonical SoT)
        run: |
          python3 -c "
          import json, re
          cfg = json.load(open('intelligence/countries.json'))
          slugs = cfg.get('slugs', [])
          fr = cfg.get('first_refresh', {})
          assert len(slugs) >= 20, f'Expected 20+ country slugs, got {len(slugs)}'
          # first_refresh is OPTIONAL per slug — entries without one are treated
          # as 'already past' (legacy countries deployed before the gating system).
          # But every PRESENT entry must parse as YYYY-MM or YYYY-MM-DD.
          # Underscore-prefixed keys are in-file documentation, not countries.
          # first_refresh carries a '_comment' (added 2026-06-04 by 5d3efa6a)
          # whose value is prose. Both assertions below iterated over it: the
          # date check failed on the prose, so this step exited 1 on EVERY run
          # from that day onward — and because the job stopped there, the two
          # gates that follow (Task #125 file-size sentinel and the Discipline
          # #36 check_cross_border.py --all --strict deploy gate) never ran at
          # all. The absent cross-border-report.json artefact in every run log
          # is the fingerprint. Skipping metadata keys restores all three.
          for slug, date in fr.items():
            if slug.startswith('_'): continue
            assert re.match(r'^\d{4}-\d{2}(-\d{2})?\$', date), f'{slug}: bad first_refresh {date!r}'
          # And every key in first_refresh must be a real slug (catches typos)
          orphans = [s for s in fr if not s.startswith('_') and s not in slugs]
          assert not orphans, f'first_refresh keys not in slugs[]: {orphans}'
          print(f'intelligence/countries.json: {len(slugs)} slugs · {len(fr)} first_refresh dates · all parse OK')
          "

      - name: Check data file sizes (task #125 sentinel)
        # Delegates to scripts/check_data_file_sizes.py — checks both
        # ssi-data.json AND grid-geo.json, uses 90 MB hard threshold with
        # 54 MB warn band. See script docstring for rationale.  This step
        # catches the indent=2 pretty-printing bloat class BEFORE it hits
        # GitHub's hard 100 MB per-file limit.
        run: python3 scripts/check_data_file_sizes.py --threshold 90

      # ── Discipline #36 — Cross-border substation gate ──
      # Closes the failure-mode the 18 Jun 2026 audit surfaced: per-country
      # ssi-data.json inheriting substations from neighbouring countries via
      # ingestion bounding-box overshoot (Austria 47.5% pre-fix, Canada 74.4%,
      # Greenland 86.5%). Any push or PR that touches */ssi-data.json or
      # */grid-geo.json now runs the audit and fails if any country has >5%
      # of its substations outside its national polygon (with per-country
      # tolerance from cross_border_tolerances.json — defaults to 100m,
      # Greenland/NZ/Denmark/Norway 5km for fjord/coastline simplification).
      #
      # See CROSS_BORDER_SUBSTATION_AUDIT_20260618.md + PR_CROSS_BORDER_GUARD.md.
      - name: Install shapely for cross-border gate
        run: pip install 'shapely>=2.0'

      - name: Cross-border substation gate (Discipline #36)
        run: |
          python3 scripts/check_cross_border.py --all --strict --json cross-border-report.json
          echo "::notice::Cross-border audit passed — no country exceeds 5% outside-polygon threshold."

      - name: Upload cross-border audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-border-report
          path: cross-border-report.json
          if-no-files-found: warn

      - name: Summary
        run: echo "Validation passed"
