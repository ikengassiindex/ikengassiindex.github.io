name: SSI Data Validation

on:
  push:
    paths:
      - '*/ssi-data.json'
      - '*/grid-geo.json'
      - 'versions.json'
      - 'intelligence/countries.json'
  pull_request:
    paths:
      - '*/ssi-data.json'
      - '*/grid-geo.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/
            versions.json
            intelligence/
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate versions.json
        run: |
          python3 -c "import json; json.load(open('versions.json')); print('versions.json: valid JSON')"

      - name: Validate intelligence/countries.json (canonical SoT)
        run: |
          python3 -c "
          import json, re
          cfg = json.load(open('intelligence/countries.json'))
          slugs = cfg.get('slugs', [])
          fr = cfg.get('first_refresh', {})
          assert len(slugs) >= 20, f'Expected 20+ country slugs, got {len(slugs)}'
          # first_refresh is OPTIONAL per slug — entries without one are treated
          # as 'already past' (legacy countries deployed before the gating system).
          # But every PRESENT entry must parse as YYYY-MM or YYYY-MM-DD.
          for slug, date in fr.items():
            assert re.match(r'^\d{4}-\d{2}(-\d{2})?\$', date), f'{slug}: bad first_refresh {date!r}'
          # And every key in first_refresh must be a real slug (catches typos)
          orphans = [s for s in fr if s not in slugs]
          assert not orphans, f'first_refresh keys not in slugs[]: {orphans}'
          print(f'intelligence/countries.json: {len(slugs)} slugs · {len(fr)} first_refresh dates · all parse OK')
          "

      - name: Check data file sizes
        run: |
          python3 -c "
          import os, sys
          issues = []
          for root, dirs, files in os.walk('.'):
            for f in files:
              if f == 'ssi-data.json':
                path = os.path.join(root, f)
                size_mb = os.path.getsize(path) / (1024*1024)
                country = root.strip('./')
                if size_mb > 100:
                  issues.append(f'{country}: {size_mb:.1f} MB EXCEEDS 100 MB limit')
                elif size_mb > 50:
                  print(f'WARNING: {country} ssi-data.json is {size_mb:.1f} MB (> 50 MB)')
          if issues:
            for i in issues: print(f'ERROR: {i}')
            sys.exit(1)
          print('All data files within size limits')
          "

      - name: Summary
        run: echo "Validation passed"
