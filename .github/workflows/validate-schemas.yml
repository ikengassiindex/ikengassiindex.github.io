name: Phase 1 — Data contract + JS parse validation

# Runs on every push to main + every PR. Fails the build if:
#   1. Any country's data file violates schemas/*.schema.json
#   2. nav.js auto-section is out of sync with countries.json
#   3. Any inline <script> block in country HTML fails node --check
#      (Phase 1.7 — catches the apostrophe/typo class that took down
#       Slovenia's Section D today)
# Reference: KB §65.4.3 + §65.4.7

on:
  push:
    branches: [main]
    paths:
      - '*/grid-geo.json'
      - '*/ssi-data.json'
      - '*/bounds.json'
      - '*/*.html'
      - 'intelligence/countries.json'
      - 'schemas/**'
      - 'scripts/run_schema_validation.py'
      - 'scripts/generate_nav_data.py'
      - 'scripts/check_inline_js_parse.py'
      - 'nav.js'
      - '.github/workflows/validate-schemas.yml'
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          # countries.json + data files only — no need for large LFS objects
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema==4.26.0

      - name: Run schema validation (strict — fails build on any error)
        run: python3 scripts/run_schema_validation.py --strict

      - name: Verify nav.js auto-section in sync with countries.json
        run: python3 scripts/generate_nav_data.py --check

      - name: Set up Node.js (for inline JS parse-check)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Parse-check every inline <script> in country HTML pages (Phase 1.7)
        run: python3 scripts/check_inline_js_parse.py --strict

      - name: Verify ?v= cache-busters match git-hash of target files (Phase 1.8)
        run: python3 scripts/bump_cache_busters.py --check
