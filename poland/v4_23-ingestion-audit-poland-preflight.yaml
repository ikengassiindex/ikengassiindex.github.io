# ── Data source primary — OSM Overpass API ──────────────────────────────

primary_source:
  source_id: PL-C1-osm-overpass
  publisher: OpenStreetMap contributors via Overpass API
  licence: ODbL (Open Database License) — attribution required
  endpoint_primary: https://overpass-api.de/api/interpreter
  endpoint_fallback: https://overpass.kumi.systems/api/interpreter
  expected_query_scope: >
    3 element-type queries for substations (way + node + relation)
    + 1 combined query for lines (power=line + cable + minor_line).
    Area header: area["ISO3166-1"="PL"]->.pl
  expected_yield:
    substations_way: 30000-45000  # Poland ~4× Czechia scale (Czechia 10,213 way subs)
    substations_node: 2000-5000
    substations_relation: 20-50
    lines: 180000-250000          # Central European line-density profile
    line_ratio_pre_merge: 5.5-6.5 # Central European average (Czechia 5.24, Slovakia 5.4)
    total_raw_bytes: ~180-250 MB  # LARGEST fetch cohort-wide (below only US 44,634 subs)
  expected_scale_context: >
    Poland is LARGEST Wave 2 cohort by substation delta — ~4× Czechia
    scale (Czechia baseline 1,074 → 8,899 net-new; Poland baseline 2,247
    → expected 32,000-42,000 net-new). Wave 2 P21 will materially
    extend cumulative Wave 2 substation counter and trigger LARGEST
    single-country line-merge dedupe pass (~5-8 min sandbox est. — likely
    similar Czechia timeout class, plan for operator local execution).

# ── Owner attribution architecture ──────────────────────────────────────

owner_attribution:
  fallback_class: region-jurisdiction × voltage-class + Layer 3 lat/lon geofence
  reuse_source: czechia (deepest predecessor post-BINDING; 3rd application overall)
  visegrad_trio_position: 3 of 3 (post Slovakia P19 + Czechia P20)

  tso_threshold: ≥220 kV → PSE_TSO
    # Polskie Sieci Elektroenergetyczne SA (state TSO)
    # 400 kV backbone (Continental European sync since 1993) + 220 kV EHV
    # 39 baseline subs at 220 kV + 32 at 400 kV = 71 EHV total (3.2% of baseline)

  distribution_partition:
    method: NUTS-2 województwa + Warsaw metro Layer 3 geofence
    dso_map:
      PGE_Dystrybucja:
        territories: |
          Mazowieckie (excluding Warsaw metro) + Łódzkie + Świętokrzyskie +
          Lubelskie + Podkarpackie + Warmińsko-Mazurskie
        share_estimated: ~35% (LARGEST DSO territorially)
        rebrand_predecessor: PGE Rzeszów + PGE Zamość + PGE Lublin + PGE Skarżysko
          (regional predecessors consolidated 2019)
      Tauron_Dystrybucja:
        territories: |
          Małopolskie + Śląskie + Opolskie + Dolnośląskie +
          Podkarpackie (Bieszczady portion)
        share_estimated: ~24%
        rebrand_predecessor: EnergiaPro + Enion (both consolidated 2008)
      Enea_Operator:
        territories: |
          Wielkopolskie + Zachodniopomorskie + Lubuskie + Kujawsko-Pomorskie +
          Bydgoszcz + Gorzów Wielkopolski
        share_estimated: ~19%
        rebrand_predecessor: ENEA Operator sp. z o.o. (formed 2007 from Zachodniopomorska
          Grupa Energetyczna consolidation)
      Energa_Operator:
        territories: |
          Pomorskie + Warmińsko-Mazurskie (Elbląg portion) +
          Kujawsko-Pomorskie (Toruń portion)
        share_estimated: ~14%
        rebrand_predecessor: Energa Operator SA (2006 from Grupa Energetyczna
          Zachód + Koncern Energetyczny Energa)
      Innogy_Stoen_Operator:
        territories: |
          Warsaw metropolitan area (Warszawa admin bounds)
        share_estimated: ~8%
        rebrand_predecessor: RWE Stoen Operator (pre-2020) + Stoen Operator
          (pre-2016) + ZE Warszawa (pre-2003)
        layer_3_geofence_bbox: [52.10, 52.35, 20.85, 21.25]   # Warsaw admin — TBD refinement (bbox_refinement candidate per Task #262 methodology)
        note: >
          Innogy Stoen operates Warsaw metro area only — Layer 3 lat/lon
          geofence critical. Post-fetch bbox refinement candidate (Prague
          precedent Task #262 methodology).

  private_industrial_captives:
    - KGHM Polska Miedź (Zagłębie Miedziowe copper mining — Lubuskie/Dolnośląskie)
    - JSW Jastrzębska Spółka Węglowa (Silesian coal mining)
    - PKN Orlen (Płock petrochemical + Trzebinia refinery)
    - PKP Energetyka (Polish State Railways electric traction — 3 kV DC)
    - Tram/metro traction operators (Warszawski Metro + PKM Warszawa + MPK Kraków + MPK Wrocław + MZKZG Gdańsk)

# ── Convention #78 BINDING 3rd enforcement — LARGEST alias class ────────

convention_78_binding_3rd_enforcement:
  enforcement_number: 3
  cumulative_5_country_hits_pre_poland: 5957   # LT 1 + EE 20 + LV 143 + SK 615 + CZ 5178
  expected_poland_alias_hits: 8000-15000       # LARGEST cohort-wide — 4 rebrand events + Polish NFC + Cyrillic + comma legal-form
  cumulative_6_country_hits_post_poland: 13957-20957
  cadence_precedent_ratio_post_poland: 1395-2095× above 10-instance BINDING threshold

  alias_class_distribution_estimated:
    polish_nfc_diacritics: HIGH       # ą ć ę ł ń ó ś ź ż — dominant class
    cyrillic_script: LOW              # Eastern Silesia + Podlaskie Belarusian minority OSM
    comma_separated_legal_form: MODERATE  # SA + sp. z o.o. + sp. z o. o. variants
    predecessor_rebrand_alias_classes:
      pge_2019_rebrand: MODERATE      # 4 regional predecessors (Rzeszów + Zamość + Lublin + Skarżysko)
      tauron_2008_rebrand: MODERATE   # EnergiaPro + Enion predecessors
      enea_2007_rebrand: LOW-MODERATE # ZGE Zachodniopomorska Grupa Energetyczna predecessor
      energa_2006_rebrand: LOW-MODERATE   # GEZ + Koncern Energetyczny Energa predecessors
      rwe_stoen_pre_2020_rebrand: MODERATE # RWE Stoen Operator predecessor pre-Innogy takeover
      stoen_pre_2016_rebrand: LOW      # Pre-RWE Stoen Operator SA predecessor
      ze_warszawa_pre_2003_rebrand: LOW  # ZE Warszawa predecessor pre-Stoen
    typographic_quotes: LOW           # Polish typographic quotes „..." like German/Czech/Latvian

  first_5_rebrand_predecessor_alias_events_cohort_wide: >
    Poland has 5-7 distinct rebrand-predecessor alias classes across 4 DSO
    + 1 Warsaw metro operator — this is UNIQUE cohort-wide (Czechia had 1
    with E.ON→EG.D 2021; Slovakia had 0). Poland becomes the empirical
    stress test for Convention #78 BINDING multi-generational rebrand
    predecessor tracking. 20-30 rebrand-alias entries expected in the
    100-150 entry multi-script alias map.

  new_sub_convention_candidate:
    scope: >
      Multi-generational rebrand-predecessor alias tracking — codify
      that where a DSO territory has cycled through ≥3 corporate
      identities in living OSM contributor memory (i.e. subs still tagged
      with predecessor names), the Layer 3 connector authoring MUST
      preemptively include ALL predecessor mappings, not just the most
      recent rebrand. Poland Innogy Stoen empirical case (RWE Stoen 2020
      → Stoen 2016 → ZE Warszawa 2003) is the codifying instance.
    empirical_evidence_precedent: Czechia E.ON→EG.D 2021 (single generation)
    poland_extension: multi-generation (2-3 generations)
    future_countries_potentially_affected: >
      Germany (E.ON → innogy → Westenergie 2020 predecessor cascade),
      UK (National Grid ESO → NESO 2024 rebrand), Netherlands (Alliander
      → Liander predecessor), Belgium (Fluvius 2018 merger of Eandis +
      Infrax predecessors), France (EDF Réseau de Distribution → Enedis
      2016 rebrand).

# ── Convention #78 §4bis.5 Layer 3 geofence 3rd enforcement ─────────────

layer_3_geofence_3rd_enforcement:
  enforcement_number: 3
  precedent_countries:
    slovenia_1st_enforcement: pre-binding-promotion (Wave 2 P8)
    slovakia_2nd_enforcement_post_binding: P19 (SUCCESS)
    czechia_3rd_enforcement_post_binding: P20 (SUCCESS, Prague bbox refinement)
  poland_4th_enforcement_expected: P21 (this closure)

  geofence_composition:
    pse_tso_threshold: ≥220 kV via voltage class (Convention #56 preserved)
    innogy_stoen_warsaw_bbox: [52.10, 52.35, 20.85, 21.25]  # TBD refinement post-fetch
    pge_north_east_bbox: TBD    # Mazowieckie non-Warsaw + Łódzkie + Świętokrzyskie + Lubelskie + Podkarpackie + Warmińsko-Mazurskie
    tauron_south_bbox: TBD      # Małopolskie + Śląskie + Opolskie + Dolnośląskie
    enea_west_north_bbox: TBD   # Wielkopolskie + Zachodniopomorskie + Lubuskie + Kujawsko-Pomorskie (excluding Toruń)
    energa_north_bbox: TBD      # Pomorskie + Warmińsko-Mazurskie Elbląg + Kujawsko-Pomorskie Toruń
    unresolved_default: pge_dystrybucja  # LARGEST DSO territorial default

  warsaw_bbox_refinement_forecast: >
    Post-fetch retrospective bbox audit expected to refine Warsaw metro
    Innogy Stoen bbox similar to Prague PRE distribuce methodology (Task
    #262). Warsaw admin bounds (~517 km²) vs historic Innogy Stoen
    concession area (~250-350 km²) — refinement candidate. If empirical
    fetch shows >10% baseline attribution to Innogy Stoen, bbox
    refinement will be needed.

# ── Discipline #36 cross-border filter ──────────────────────────────────

discipline_36_cross_border_filter:
  polygon_source: poland/bounds.json (16-województwa multi-polygon)
  tolerance_km: 0.1  # 100m default (Central European precedent — same as Slovakia + Czechia)
  expected_dropped_substations: 50-150  # Kaliningrad enclave + Belarus/Ukraine/Lithuania/Slovakia/Czech border overspill
  expected_dropped_lines: 300-800       # transnational 400 kV PSE↔50Hertz Germany + PSE↔ČEPS Czech + PSE↔SEPS Slovakia + PSE↔Ukraine (via Rzeszów-Kaliningrad direct)
  bordering_countries: 7                # Germany + Czech + Slovakia + Ukraine + Belarus + Lithuania + Russia (Kaliningrad enclave)
  synchronous_area: Continental_European_since_1993

# ── Discipline #41 line parity ──────────────────────────────────────────

