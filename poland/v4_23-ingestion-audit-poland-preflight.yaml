    Baseline 2,247 subs + 6,484 lines (baseline gaudit if available) = 2.89
    line ratio; Central European average pre-merge post-fetch ratio
    expected 5.5-6.5 (below Slovakia 13.31 line-heavy outlier; above
    Czechia 5.24). Poland OSM Central European average line-mapping
    culture.

