country_slug: norway
discovery_date_utc: "2026-07-13"
author: ikenga-ssi-foundation
methodology_pin: v4.2
parent_state_transitions:
  - norway/v4_3-ingestion-audit-norway-preflight.yaml
  - norway/v4_3-ingestion-audit-norway-fetch.yaml (Refutation #3 raised here)

# ─────────────────────────────────────────────────────────────────────────────
# 1. Empirical probe methodology
# ─────────────────────────────────────────────────────────────────────────────
probe_methodology:
  target_feature_type: app:EL_Luftlinje
  wfs_endpoint: http://wfs.geonorge.no/skwms1/wfs.nettanlegg
  wfs_version: 2.0.0
  outputFormat: default (server-native GML 3.2)
  probes_executed:
    probe_A_two_line_sample:
      count: 2
      startIndex: 0
      response_bytes: 6560
      sample_sha256_prefix: f5de26dc77edfbc83717e720
      purpose: extract full field schema from first two features
    probe_B_two_hundred_line_stratification:
      count: 200
      startIndex: 0
      response_bytes: 355727
      sample_sha256_prefix: a2c4253fb7dd0e5a060b8223
      purpose: characterise voltage distribution in early dataset
    probe_C_five_thousand_line_full_spectrum:
      count: 5000
      startIndex: 0
      response_bytes: 9621402
      sample_sha256_prefix: f759677fffc622a2fa2b37c6
      purpose: characterise full voltage spectrum across all three grid tiers
    probe_D_deep_dataset_probe:
      count: 2000
      startIndex: 50000
      response_bytes: 2729680
      purpose: verify voltage completeness in middle of 145,460-line dataset

# ─────────────────────────────────────────────────────────────────────────────
# 2. Line field schema (empirically extracted)
# ─────────────────────────────────────────────────────────────────────────────
line_field_schema:
  sample_first_feature_id: el_luftlinje.873512
  fields_extracted:
    gml_id: publisher-assigned unique ID (e.g. el_luftlinje.873512)
    driftsattår: year commissioned (e.g. 1965) — populated on some lines
    eier: OWNER NAME (e.g. ARVA AS, LEDE AS) — valuable enrichment
    eierOrgnr: Norwegian company registry ORG # (e.g. 979151950)
    identifikasjon.lokalId: stable UUID (e.g. df952fd5-3ce9-455f-9ca0-c5f2ad94e8f7)
    identifikasjon.navnerom: namespace URL
    identifikasjon.versjonId: version (e.g. 1.0)
    kildeEndretDato: source modified date
    navn: LINE NAME (e.g. "Semb - Veggbakken") — populated on some lines
    nettnivå: grid tier categorical (Sentralnett / Regionalnett / Distribusjonsnett)
    spenning: VOLTAGE IN kV (e.g. 132.0, 66.0, 420.0)   # ← THE FIND
    posisjonskvalitet.målemetode: position quality method code
    linje: LineString or MultiCurve geometry in EPSG:4258

# ─────────────────────────────────────────────────────────────────────────────
# 3. Voltage spectrum — empirical distribution (5000-line sample from start)
# ─────────────────────────────────────────────────────────────────────────────
empirical_voltage_spectrum:
