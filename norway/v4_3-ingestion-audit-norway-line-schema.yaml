    voltages_kv_observed: [220, 250, 300, 350, 420, 525]
    breakdown:
      "420.0": 87                          # Statnett main transmission
      "300.0": 138                         # Statnett secondary transmission
      "525.0": 1                           # HVDC (likely NorNed / NordLink / North Sea Link)
      "350.0": 1                           # HVDC secondary
      "250.0": 2                           # HVDC intermediate
      "220.0": 2                           # legacy transmission
  regionalnett_regional:
