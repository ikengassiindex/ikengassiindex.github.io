      "66.0": 1440                         # regional secondary
      "47.0": 325                          # regional legacy
      "110.0": 121                         # regional intermediate
      "52.0": 106                          # regional legacy
      "50.0": 134                          # regional legacy
      "145.0": 60                          # regional intermediate
      "73.0": 44                           # regional legacy
      "45.0": 22                           # regional legacy
      "60.0": 30                           # regional legacy
      "36.0": 15                           # regional legacy
      "72.0": 10                           # regional legacy
      "55.0": 2                            # regional legacy
      "150.0": 1                           # regional legacy
  distribusjonsnett_distribution:
    lines_observed: 969
    voltages_kv_observed: [10, 11, 12, 17, 18, 20, 21, 22, 22.5, 23, 24, 33]
    breakdown:
      "22.0": 680                          # MV distribution (dominant)
      "24.0": 211                          # MV distribution
      "11.0": 36                           # MV distribution
      "12.0": 26                           # MV distribution
      "17.0": 15                           # LV distribution
      "23.0": 6                            # LV distribution
      "21.0": 6                            # LV distribution
      "33.0": 4                            # MV distribution
      "20.0": 3                            # LV distribution
      "22.5": 2                            # LV distribution
      "18.0": 1                            # LV distribution
      "10.0": 1                            # LV distribution
  nettnivå_tag_completeness:
    lines_with_nettniva_tag: 3367           # 67.4% of sampled lines
    sentralnett: 361                        # matches sentralnett voltage count within tolerance
    regionalnett: 2973                       # matches regionalnett voltage count within tolerance
    distribusjonsnett: 33                    # UNDER-REPRESENTED — nettnivå tag drops out on
                                             # distribution grid; voltage remains reliable
  edge_cases:
    spenning_zero_or_missing: 16             # ~0.32% of sample — data-quality edge case
    unknown_hvdc_asymmetry: |
      525 kV + 350 kV + 250 kV appear on 1-2 lines each; likely HVDC
      converter routes (NorNed 450 kV DC operates asymmetric AC endpoints,
      NordLink 525 kV DC, North Sea Link 515 kV DC).  Sub-1% of sample;
      does not affect the enrichment pipeline design.
  deep_dataset_probe_validation:
    startIndex_50000_sample_size: 2000
    voltage_completeness: 100.0             # 2000/2000 — even deeper in dataset, spenning holds
    voltages_all_below_25kv: true            # 100% Distribusjonsnett (11-24 kV band)
    finding: |
      145,460-line dataset appears roughly stratified: front-of-file contains
      Sentralnett + Regionalnett, middle contains distribution.  This is not
      a bug; NVE serves features in some deterministic order.  Full-cohort
      ingestion will capture all tiers regardless.

# ─────────────────────────────────────────────────────────────────────────────
# 4. Refutation #3 — partial inversion
# ─────────────────────────────────────────────────────────────────────────────
refutation_3_partial_inversion:
  original_finding_from_step_2:
    statement: |
      "EL_Transformatorstasjon schema does NOT carry voltage_kv or Norwegian
      equivalent 'spenning'.  Gap-audit's voltage-enrichment assumption
      refuted for substations."
    status_after_step_2b: |
      STILL TRUE at the substation-schema layer — NVE does not publish
      voltage directly on transformer stations.  But this is only half the
      picture.
  new_finding_from_step_2b:
    statement: |
      EL_Luftlinje DOES carry voltage via app:spenning with 99.78%
      completeness on the sampled 5,000-line front-of-dataset slice.  Full
      Norwegian grid stratification empirically captured: Sentralnett
      (220-525 kV, 6 voltage classes), Regionalnett (36-150 kV, 14 voltage
      classes), Distribusjonsnett (10-33 kV, 12 voltage classes).
    architectural_consequence: |
      Norwegian substation voltage enrichment is achievable via REVERSE
      Discipline #41: instead of substation-carries-voltage-and-lines-inherit,
      we do line-carries-voltage-and-endpoint-substations-inherit.  For each
      Line L with spenning V, find the substations within 500m of either
      endpoint (existing Discipline #41 line-coupling threshold) and
      propagate V to those substations.  A substation touching multiple
      lines at different voltages carries the MAXIMUM (its highest
      operating voltage class).

# ─────────────────────────────────────────────────────────────────────────────
# 5. Voltage-inheritance pipeline design
# ─────────────────────────────────────────────────────────────────────────────
voltage_inheritance_design:
  algorithm: reverse_discipline_41_endpoint_proximity_join
  steps:
    step_1_line_endpoint_extraction: |
      For each EL_Luftlinje feature with spenning populated, extract line
      endpoints from the LineString/MultiCurve gml:posList.  For LineString:
      first-point + last-point.  For MultiCurve: first-point of first curve
      + last-point of last curve.  Preserve spenning value on each endpoint.
    step_2_endpoint_indexing: |
      Build a spatial index (KDTree or R-tree) over all line endpoints,
      keyed by (lat, lon), carrying spenning.
    step_3_substation_query: |
      For each substation S in the merged canonical (existing 5,842 + any
      v4.3 net-new), query the endpoint index for all endpoints within
      500m of S.center.  Collect list of spenning values.
    step_4_max_voltage_selection: |
      Assign S.voltage_kv = max(collected spenning values).  If no endpoint
      within 500m, S.voltage_kv remains 0 (Convention #56 visibly-honest).
    step_5_provenance_pin: |
      Record contributing line lokalIds + endpoint distances in
      S.v43_voltage_inheritance dict.  Downstream audit can reconstruct.
  expected_enrichment_ratio: |
    5,842 substations exist.  1,558 NVE substations are known (matched or
    new).  145,460 lines have voltage.  A typical Norwegian regional-grid
    substation has 3-6 incident lines.  Empirical projection: 3,500-4,500
    substations gain voltage_kv (60-77% of the 5,842 existing).  Higher
    coverage than Canada Priority 1 achieved (7 pairs) by orders of magnitude.

