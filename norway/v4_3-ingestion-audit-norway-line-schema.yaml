# SSI Index v4.3 workstream — Norway Step 2b EL_Luftlinje schema audit
#
# Purpose: state-transition anchor per METHODOLOGY_DISCIPLINES.md §5ter for
# the empirical EL_Luftlinje voltage-hypothesis probe.  Tests whether the
# NVE Nettanlegg WFS carries voltage information on the line layer that
# could enrich substation records via reverse Discipline #41 line-coupling
# (line carries voltage, endpoint substation inherits via 500m proximity).
#
# HEADLINE FINDING: HYPOTHESIS CONFIRMED.  EL_Luftlinje carries voltage
# via app:spenning with ~99.5% completeness across all three Norwegian
# grid tiers (Sentralnett + Regionalnett + Distribusjonsnett).  Refutation #3
# from Step 2 is PARTIALLY INVERTED: substation schema still lacks voltage
# but the line layer supplies it comprehensively, and voltage inheritance
# via endpoint proximity is architecturally viable.
#
# Cross-references:
#   - norway/v4_3-ingestion-audit-norway-preflight.yaml (Step 1)
#   - norway/v4_3-ingestion-audit-norway-fetch.yaml (Step 2 — where Refutation #3 was raised)
#   - canada/v4_3-ingestion-audit-canada-preflight.yaml (Priority 1 precedent)

