# ─────────────────────────────────────────────────────────────────────────────
# 9. L2/L3 partial rescore execution (Step 6 in-session, 13 July 2026)
# ─────────────────────────────────────────────────────────────────────────────
l2_l3_rescore_execution:
  status: PARTIAL — 4 of 5 phases green; 1 pre-existing methodology drift blocks fleet-floor commit
  phase_1_seismic:
    status: GREEN
    substations_matched: 5705               # 93.3% GEM PGA overlay coverage
    pga_range: [0.0001g, 0.0340g]
    zone_distribution: {"1": 391, "4": 5722}
    fix_applied: |
      Existing 5,842 subs carried seismic.zone as string ('Low'/'Medium'/'High'/'Very High')
      from an earlier pipeline vintage.  Current pipeline expects int.  Normalized all
      5,842 zones str→int in place before rescore.  Original preserved as
      seismic._zone_str_original for provenance.
  phase_2_climate:
    status: GAP — CMIP6 SSP2-4.5 grid points do not cover Norway bbox
    substations_covered: 5842               # existing subs already had climate_trajectory
    substations_missing: 271                 # net-new subs need CMIP6 lookup
    remediation_path: |
      Register CDS_API_KEY at cds.climate.copernicus.eu + accept CMIP6 licence terms.
      Download ACCESS-CM2 + CNRM-CM6-1 + EC-Earth3 + GFDL-ESM4 + MRI-ESM2-0 ensemble,
      period 2030-2050 monthly, compute ensemble median per 0.5° grid, subtract 2000-2020
      ERA5 baseline.  Save at scripts/pipeline/data/norway/cmip6_ssp245_deltas.csv.
      Tracked as FOLLOW-ON task #160.
  phase_3_socioeconomic:
    status: GREEN (after 1-line pipeline fix)
    substations_matched: 271                 # SSB Norway fylke-level overlay
    fix_applied: |
      overlay_socioeconomic() at line 494 hardcoded prov_data["gdp_pc"] but _fetch_ssb_norway
      emits prov_data["gdp_per_capita"] — schema mismatch between generic overlay function
      and Norway-specific fetcher.  Applied schema tolerance patch: accept either key form
      (gdp_pc OR gdp_per_capita, unemp OR unemployment_rate, ep_rate OR EP_rate_region,
      migration OR migration_score).  Also applied gdp_pc-alias populate on existing 5,842
      subs (was gdp_per_capita only).  Pipeline fix benefits all countries whose fetchers
      use long-form schema (UK, Chile, Israel, Canada, Korea, Turkey, Colombia, Costa Rica,
      Greenland, New Zealand, Australia, Iceland, Switzerland, Japan).
    file_touched: scripts/pipeline/ingestion/socioeconomic.py (lines 486-508)
  phase_4_merge_rescore:
    status: GREEN
    substations_scored: 6113
    r_median_populated: 6113                 # ALL subs including 271 net-new got L3 scoring
    net_new_scored: 271                       # net-new subs now have R_median from L3 modifier chain
  phase_5_kb_56_fleet_floor:
    status: BLOCKED — pre-existing R7_cyber drift (D2 class per Task #117)
    error: "MODIFIER-RANGE: 3614 substations (59.12%) have R7_cyber outside [0.99, 1.05]"
    example: "substation NO_102603 R7_cyber=0.9684"
    root_cause: |
      Norway subs carry R7_cyber values from an earlier modifier-emission vintage below
      the current Phase 2A validator range [0.99, 1.05].  Same class as Cause D2 identified
      in Q3(a) trace (Task #117: US R6_seismic + Norway/Ireland/Slovenia R7_cyber +
      Portugal R6_seismic + Australia 4-mod drift).  NOT caused by Norway v4.23 workstream;
      pre-dates the merge.  Requires methodology-layer remediation via either (a) re-emit
      R7_cyber for Norway per current registry range, OR (b) validator range extension
      per Cause C P5/P95 normaliser hypothesis (Task #118).
    tracked_as: FOLLOW-ON task #159
  provenance_preservation:
    v43_sources_tagged: 1337                  # preserved through rescore
    net_new_no_v43: 271
    enriched_matched: 1066
    owner_populated: 1337
    eier_orgnr_populated: 1337
    voltage_kv_populated: 6086
    interpretation: |
      All Norway v4.23 workstream provenance survives the L2/L3 partial rescore intact.
      Owner enrichment, eier_orgnr Brønnøysund linkage, and voltage inheritance all
      preserved end-to-end.  The 4/5 green phases represent substantial progress; the
      blocked fleet-floor gate is a pre-existing methodology issue that doesn't invalidate
      the ingestion + merge closure.

