# ─────────────────────────────────────────────────────────────────────────────
# 6. Discipline #41 line-coupling readiness
# ─────────────────────────────────────────────────────────────────────────────
discipline_41_line_coupling_readiness:
  operator_directive_25_june_2026: |
    "all must be auditable and if we add substations we add connecting power lines"
  federal_line_source: CanVec ManMade Transmission_Line feature class (companion to Electric_Facility)
  strategic_line_source: NACEI Layer 1 Electric Transmission Line (28 Canada features, backbone-scale cross-check)
  provincial_line_sources:
    - YEC Power Lines (Yukon, companion to YEC Substations)
    - Nova Scotia NSTDB Utilities Line Layer (id x39x-aw9i)
    - BC Transmission Lines
  line_yield_estimate_canada: 15 000 - 22 000 km additional transmission-line km (per v4.23 gap-audit §Canada)
  sentinel_commitment: |
    TestSubstationLineParity sentinel (per CLAUDE.md v4.23 forward-reference) will land
    alongside first Canada L1 connector.  Each new substation node MUST have ≥1
    transmission-line edge in the same ingestion pass; each new line MUST have
    non-orphan endpoints in the substation registry.
