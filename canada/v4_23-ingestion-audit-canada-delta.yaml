    B_osm_redesign: canada/v4_23-ingestion-audit-canada-osm-integration.yaml (Option B executed)
    C_utility_expansion: canada/v4_23-ingestion-audit-canada-utility-expansion.yaml (Option C executed)
  commit_hash_placeholder: TBD_at_operator_decision
  ci_job_url_placeholder: TBD_at_operator_decision
