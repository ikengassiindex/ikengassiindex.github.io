# SSI Index v4.23 workstream — Canada federation delta audit
#
# Purpose: state-transition anchor per METHODOLOGY_DISCIPLINES.md §5ter for
# the critical empirical finding surfaced when the federation output was
# compared against the existing OSM-derived canada/ssi-data.json state.
#
# TL;DR — the v4.23 gap-audit projected 10-15k additional Canada substations
# from CanVec 50K + provincial supplements.  Empirical delta shows CanVec
# 50K delivers ~1,240 new substations after 500m proximity dedupe against
# the existing 6,399 OSM-post-Discipline-36 state.  That is a ~12× smaller
# yield than projected.  Operator architectural decision required before
# any L2/L3 wiring proceeds.
#
# Cross-references:
#   - canada/v4_23-ingestion-audit-canada-preflight.yaml (parent pre-flight)
#   - Report Production/02-v4_23-gap-audit-2026-07/v4_23-gap-audit.md (gap-audit projection)
#   - CROSS_BORDER_SUBSTATION_AUDIT_20260618.md (Discipline #36 remediation history)

schema_version: v4_23-ingestion-audit-delta-1
country_slug: canada
discovery_date_utc: "2026-07-13"
author: ikenga-ssi-foundation
methodology_pin: v4.2
parent_state_transitions:
  - canada/v4_23-ingestion-audit-canada-preflight.yaml (schema v2)
  - CanVec Res_MGT extraction body implementation (commit abd15ec7)
  - NS-NSTDB + YEC bug fixes (commit c7fc8a87)

# ─────────────────────────────────────────────────────────────────────────────
# 1. Empirical state comparison
# ─────────────────────────────────────────────────────────────────────────────
state_comparison:
  existing_canada_ssi_data_json:
    substations: 6399
    fields_per_substation: 42
    source_narrative: OSM-derived, post-Discipline #36 cross-border filter
    original_pre_remediation_count: 24986
    discipline_36_removed: 18587    # 74.4% cross-border leakage removed
    last_reclassification_run_utc: "2026-07-12T16:23:49.754203+00:00"
    last_remediation_run_utc: "2026-07-02T09:36:02.506781+00:00"

  federation_output:
    substations: 4557
    fields_per_substation: 8           # L1 raw schema (identity + geo + voltage + prov + prov_iso + region + sources + provenance)
    substations_by_source:
      CA-C1-canvec-resmgt: 4528        # federal CanVec 50K
      CA-C3-yec-substations: 21        # YEC operational (some matched CanVec)
      CA-C4-ns-nstdb-utilities-point: 24  # NS-NSTDB UTSS60 (some matched CanVec)
    file_size_bytes: 1485497
    written_at_utc: "2026-07-13T07:52:57Z"

# ─────────────────────────────────────────────────────────────────────────────
# 2. Overlap analysis (500m proximity match threshold)
# ─────────────────────────────────────────────────────────────────────────────
overlap_analysis:
  proximity_match_threshold_m: 500.0    # matches Discipline #41 sentinel threshold
  matched_within_threshold: 3330         # 73.1% of federation overlaps existing
  unmatched_would_be_new: 1227           # 26.9% would be new additions
  by_province_new:
    Ontario: 408
    Alberta: 281
    Québec: 188
    Saskatchewan: 96
    British Columbia: 74
    Manitoba: 52
    Nova Scotia: 47
    Newfoundland and Labrador: 46
    New Brunswick: 22
    Yukon: 8
    Prince Edward Island: 5
  by_source_new:
    CA-C1-canvec-resmgt: 1217           # 99.2% of new — CanVec dominant
    CA-C3-yec-substations: 7            # 14 of 21 YEC subs matched CanVec
    CA-C4-ns-nstdb-utilities-point: 6   # 18 of 24 NS subs matched CanVec

# ─────────────────────────────────────────────────────────────────────────────
# 3. Empirical refutation of v4.23 gap-audit projection
# ─────────────────────────────────────────────────────────────────────────────
gap_audit_projection_refutation:
  gap_audit_projected_range: [10000, 15000]   # per Report Production/02-v4_23-gap-audit-2026-07/
  empirical_new_delivered: 1227
  yield_ratio: 0.10                            # ~1/12 of projection
  root_cause: |
    CanVec 50K is a topographic-cartographic product at 1:50,000 scale.
    Its Electric_Facility feature class (transformer_station_0 + _2) captures
    substations that are visible on medium-scale topographic maps — typically
    HV switchyards, transmission substations, and larger MV distribution
    substations.  It does NOT comprehensively capture the LV/MV utility-
    inventory-scale substations that OSM contributors have geolocated
    (~24,986 pre-Discipline-36 for Canada).

    The Yukon completeness ratio flagged in the pre-flight audit YAML
    (CanVec 3 vs YEC 21 operational = ~14%) applies to Yukon Territory
    specifically; the empirical delta suggests it may over-estimate CanVec's
    coverage in more populated provinces where OSM contributor density is
    higher.  The actual Canada-wide completeness ratio of CanVec vs OSM
    appears to be closer to 73% (existing OSM 6,399 vs CanVec 50K ~4,538).

    The gap-audit's 10-15k projection assumed CanVec would deliver material
    net additions beyond OSM.  Empirical: CanVec is largely REDUNDANT with
    OSM at the topographic-scale substation layer.  The v4.23 workstream's
    substation-growth ambition needs a different source stack.

# ─────────────────────────────────────────────────────────────────────────────
# 4. Voltage-schema enrichment potential (partial finding)
# ─────────────────────────────────────────────────────────────────────────────
voltage_enrichment_potential:
  initial_check_finding: |
    Initial empirical check for existing substations with voltage_kv=NULL
    that could be filled by federation returned 0 candidates.  However, the
    existing schema uses voltage_kv=0 as placeholder for unknown voltage
    (not NULL), so the check was too strict.
  followup_needed: |
    Redo the voltage-enrichment analysis with voltage_kv IN (0, NULL, '') as
    the enrichment-candidate signal, and empirically anchor how many of the
    3,330 matched-substation pairs would gain voltage information from
    NACEI (Voltage_kV populated on 28 lines) + YEC (34.5 kV on 21 subs) +
    federation supplements.
  provisional_estimate: |
    YEC + NACEI voltage schema together carry ~49 substations with known
    voltage.  These would enrich a corresponding subset of existing subs
    matched by proximity.  Small volume but high value per substation.

# ─────────────────────────────────────────────────────────────────────────────
# 5. Architectural decision required (operator)
# ─────────────────────────────────────────────────────────────────────────────
decision_needed:
  scope: v4.23 Canada workstream continuation
  three_options:
    option_A_ship_delta:
      description: |
        Merge the 1,227 empirically-new substations into canada/ssi-data.json
        as a v4.23 additive contribution.  Run L2 enrichment (climate + seismic
        + socioeconomic) + L3 SSI scoring on just the new subs.  Preserve
        existing 6,399 OSM-derived scored state.  Also enrich voltage_kv on
        the ~49 matched pairs where federation carries known voltage.
      pros:
        - Ships a real v4.23 Canada addition (+19% substations, 6399 → 7626)
        - Preserves existing scored state; no regression
        - Voltage enrichment on matched pairs adds R6b Network Topology signal
        - Discipline #41 line-coupling satisfied (13,044 lines federated)
      cons:
        - Falls short of gap-audit 10-15k projection by ~10×
        - CanVec + provincial supplements plateau; further Canada growth
          needs a different source stack
      engineering_cost: 3-5 engineer-days
    option_B_redesign_with_osm:
      description: |
        Add OSM as a formal L1 connector (CA-C6-osm-canada) so the v4.23
        workstream unifies the source stack.  The existing 6,399 OSM subs
        would flow through the same federation architecture as CanVec + YEC
        + NS-NSTDB, with provenance tracking + Discipline #36 filter +
        Discipline #41 line-coupling all applied uniformly.  Result: cleaner
        architecture, but no NET substation growth beyond what already exists.
      pros:
        - Unifies the source stack under one federation architecture
        - Voltage/owner enrichment can be applied uniformly to OSM subs
        - Preserves the existing pipeline provenance chain end-to-end
      cons:
        - Does NOT close the v4.23 gap-audit substation growth ambition
        - OSM connector adds ~5-7 engineer-days
      engineering_cost: 8-12 engineer-days
    option_C_expand_with_operational_utility:
      description: |
        Escalate the v4.23 Canada workstream to include operational-utility
        registries beyond CanVec + YEC + NS-NSTDB.  Direct portals: IESO
        Ontario Transmission Assessment + Hydro-Québec Réseau de transport
        (via TSMB) + AESO Alberta Transmission Facility Register + Manitoba
        Hydro + SaskPower.  These carry ~15-25k substations Canada-wide
        (Ontario alone has ~8-12k in the IESO Data Directory).  Requires
        Chrome MCP or manual portal navigation to identify data URLs.
      pros:
        - Would deliver the gap-audit's 10-15k projection empirically
        - Real operational-utility data with voltage + owner schema
        - Closes the substation-growth ambition of v4.23
      cons:
        - Direct utility portals require case-by-case discovery
        - Some may require registration or licence acceptance
        - Estimated 15-25 engineer-days per province
      engineering_cost: 25-40 engineer-days (Priority 1 rescope)
  operator_choice_placeholder: TBD_at_operator_decision

# ─────────────────────────────────────────────────────────────────────────────
# 6. Recommendation
# ─────────────────────────────────────────────────────────────────────────────
recommendation: |
  Ship Option A (1,227 new substations + voltage enrichment on ~49 matched
  pairs) as the closure of Priority 1 Canada v4.23 workstream Phase 1.
  Track Option C (operational-utility expansion) as Priority 1 Canada Phase 2,
  queued for Q4 2026 alongside Norway/Mexico/Austria/Greenland Priority 2-5.

  Rationale: Option A is a real net contribution to the SSI Index cohort +
  hits ship-ready state within the Q3 2026 Editorial Calendar window +
  preserves the empirical anchor architecture (pre-flight → federation →
  delta audit → merge) so Phase 2 can extend cleanly.  Option B doesn't
  ship any real growth.  Option C is the correct long-term answer but
  requires substantial engineering time better queued as its own phase.

# ─────────────────────────────────────────────────────────────────────────────
# 7. Auditability chain
# ─────────────────────────────────────────────────────────────────────────────
auditability_chain:
  state_transition: L1-federation-shipped → operator-decision-required
  parent_state: canada/v4_23-ingestion-audit-canada-preflight.yaml (schema v2)
  child_state_options:
