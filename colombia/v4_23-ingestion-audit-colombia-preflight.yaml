meta:
  country: colombia
  iso2: CO
  iso3: COL
  wave: 2
  priority: 15
  step: 1
  target: "Owner enrichment via OSM Overpass — 6th region-jurisdiction × voltage-class instance (LARGEST DSO cardinality yet)"
  rationale: >
    Colombia carries 378 substations with 0% owner tagged and 100% voltage +
    region tagged (28 distinct departments populated as region field —
    Antioquia + Bogotá + Valle del Cauca largest). Sixth application of the
    region-jurisdiction × voltage-class fallback pattern (after Belgium 3 +
    Netherlands 4 + Hungary 4 + Chile lat-band + Slovenia 5-DSO NUTS-3 map)
    with the LARGEST DSO cardinality yet (~30 DSOs regulated by CREG).
    Colombia's electricity architecture: ISA (Interconexión Eléctrica S.A.,
    state-linked) handles TSO ≥220 kV national transmission + XM SA ESP
    system operator (spun out from ISA, non-owner of infrastructure); ~30
    regional distributors handle sub-220 kV with departmental territories.
    NOVEL PATTERN: department-name lookup from baseline region field (100%
    populated) — simpler than lat/lon geofence because Colombia's
    department boundaries are cleanly ingested at baseline.

