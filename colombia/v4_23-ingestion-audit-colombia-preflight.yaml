architecture:
  connector_layout: scripts/pipeline/ingestion/colombia/
  files_to_ship:
    - __init__.py
    - _base.py         # ISA TSO threshold + department-name-to-DSO map + Cali metro geofence + ISA default
    - osm_overpass.py  # single-query fetch (~1,142k km², may partition)
    - merge_into_ssi_data.py  # 500m proximity + Step 4b retroactive + baseline-department lookup
  pattern_reused_from: slovenia (region-jurisdiction × voltage) + costa-rica (Step 4b retroactive integration)
  differentiators_vs_slovenia:
    - dso_cardinality: ~30 DSOs vs Slovenia's 5 (6× larger)
    - regional_metadata_source: department names (Spanish, natural language) vs NUTS-3 codes (SI###)
    - country_size: 1,142k km² vs 20k km² (57× larger)
    - state_utility_default: ISA fires as fallback (like Costa Rica ICE) vs Slovenia unresolved
    - system_operator_non_owner_distinction: XM SA ESP tagged separately from ISA (like Noga in Israel)

expected_deltas:
  post_merge_owner_coverage: 100%  # department map + ISA default catches all
  post_merge_voltage_coverage: 40-70%  # from 100% transmission-only to multi-tier including MV
  post_merge_substations: 800-2500
  post_merge_lines: 3000-10000
  km_of_lines: 10000-30000

risks_flagged:
  - risk_1: >
      Colombia has enormous departmental cardinality (30+) and OSM tagging
      quality varies widely by region. Bogotá + Medellín likely have high
      operator= tag density; Amazon basin near-zero.
  - risk_2: >
      Cauca department has CEO (Compañía Energética de Occidente) but some
      Popayán urban may show Cencar or older Cedelca names — verify alias
      map catches historical variants.
  - risk_3: >
      Air-e vs Afinia split of former Electricaribe: SW (Air-e: Atlántico
      + Magdalena + La Guajira) vs NE (Afinia: Bolívar + Cesar + Córdoba +
      Sucre). If OSM tags show "Electricaribe" historical name, need to
      route by department to disambiguate (not by alias alone).
  - risk_4: >
      2-country border zones with Panama (NW), Ecuador (S), Peru (SE),
      Brazil (E), Venezuela (E). Discipline #36 cross-border filter uses
      colombia/bounds.json.
  - risk_5: >
      Islas de San Andrés (Caribbean archipelago ~250 km NW of Cartagena)
      is Colombian territory but has isolated grid (Sopesa). May sit at
      polygon boundary; verify after fetch.

convention_preservation:
  discipline_36:
    scope: Colombia bounds already CLEAN. 100m tolerance adequate.
  discipline_41:
    scope: EVERY net-new substation MUST have ≥1 connecting line.
  convention_56:
    scope: >
      ISA state-utility default is Convention #56-compliant — ISA/XM
      operates majority + de facto default for unmapped territory.
      Historical Electricaribe route via department (not alias alone).
      OSM-tag-unresolved cases surface honestly.
  convention_60:
    scope: OSM only — no commercial providers.
  convention_64:
    scope: All changes contained to colombia/ + scripts/pipeline/ingestion/colombia/.

next_steps:
  step_2: >
    Operator runs `python3 -m scripts.pipeline.ingestion.colombia.osm_overpass`
    locally. Expected wall-clock 3-5 min (may need bbox partitioning).
  step_3: L1 connector shipped in same batch as this pre-flight.
  step_4: >
    Operator runs `python3 -m scripts.pipeline.ingestion.colombia.merge_into_ssi_data`.
    Includes Step 4b retroactive attribution + Step 5 alias-retighten passes.
  step_5: >
    Cohort audit sweep re-run — expect owner_coverage WARN retired.

status: READY_FOR_STEP_2
