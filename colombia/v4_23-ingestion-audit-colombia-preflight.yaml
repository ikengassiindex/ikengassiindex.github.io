source_options:
  canonical:
    name: OSM Overpass
    endpoint_primary: https://overpass-api.de/api/interpreter
    endpoint_fallback_1: https://overpass.kumi.systems/api/interpreter
    endpoint_fallback_2: https://overpass.private.coffee/api/interpreter
    query_scope: power=substation + power=line + power=minor_line + power=cable
    bbox: [-79.10, 1.10, -66.80, 12.60]  # west, south, east, north
    strategy: >
      Single-query pattern — Colombia bbox ~1,142k km² (50× Slovenia, 22× Israel,
      ~2× Chile). Fetch may take 3-5 minutes; if 429/504 encountered may need
      bbox partitioning by department cluster.
    expected_yield:
      substations: 800-2500
      lines: 3000-10000
    tag_completeness_hypothesis: >
      Colombia OSM tagging density typically 40-60% for Andean urban centres
      (Bogotá + Medellín + Cali + Barranquilla). Rural coasts (Guajira +
      Chocó) + Amazon basin (Amazonas + Vaupés + Guainía) 10-30%. OSM
      operator= tags likely sparse — ISA/EPM/Enel-Codensa direct tags for
      major backbone, unresolved for MV distribution net-new.
    lp_dd_class: canonical

  fallback_region_jurisdiction_with_ISA_default:
    strategy: department_name_to_dso_map_plus_isa_tso_threshold_plus_isa_default
    rationale: >
      Baseline has 100% region attribution as department names (28 distinct)
      — this is the cleanest resolver base yet cohort-wide. Layer 2 uses
      department-name-to-DSO map directly (no lat/lon geofence needed for
      baseline subs); Layer 3 uses lat/lon geofence for net-new OSM subs
      without department tag; Layer 4 falls back to ISA default (Convention
      #56 visibly-honest).
    tso_threshold_kv: 220  # ISA operates 500 + 230 + 220 kV backbone
    tso_operator: ISA  # Interconexión Eléctrica S.A. (state-linked TSO)
    system_operator_non_owner: XM SA ESP  # spun out from ISA, non-owner of infrastructure
    dso_departments_map:
      # Departments where DSO is unambiguous by department alone
      antioquia: EPM
      bogota: Enel-Codensa
      atlantico: Air-e
      magdalena: Air-e
      la-guajira: Air-e
      bolivar: Afinia
      cesar: Afinia
      cordoba: Afinia
      sucre: Afinia
      santander: Essa
      norte-de-santander: CENS
      boyaca: EBSA
      caldas: Chec
      quindio: Chec
      risaralda: Chec
      huila: Electrohuila
      tolima: Enertolima
      nariño: Cedenar
      casanare: Enerca
      meta: Emsa
      arauca: Enerca-Enelar
      guaviare: Emsa-Guaviare
      putumayo: Emsa-Putumayo
      caqueta: Electrocaqueta
      choco: DisPac
      amazonas: Amazonas
      vichada: Emsa-Vichada
      vaupes: Emsa-Vaupes
      guainia: Emsa-Guainia
      san-andres: Sopesa

    dso_departments_split_by_geofence:
      # Departments where multiple DSOs overlap — need cantonal/lat-lon geofence
      cundinamarca:
        default: Enel-Codensa  # majority — Bogotá suburbs
        edge_cases: null       # rural NE Cundinamarca overlaps with EBSA (Boyacá)
      valle-del-cauca:
        default: EPSA          # rest of Valle del Cauca
        cali_metro_geofence:
          bbox: "3.30-3.60°N, -76.65 to -76.40°W"
          dso: Emcali
      cauca:
        default: CEO           # Compañía Energética de Occidente
        note: "Some Popayán urban may overlap with Cencar"

  dso_alias_normalisation:
    aliases:
      # ISA + XM variants
      "ISA": "ISA"
