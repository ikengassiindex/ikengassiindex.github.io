lessons_generalised:
  - >
      **Baseline department promotion in merge is the novel pattern**:
      OSM Colombia doesn't populate department tags → Layer 2 fires 0 times
      from OSM path. But merge_substations detects OSM ISA_default outputs
      on baseline-matched subs and re-runs the resolver with the baseline
      department. Empirically lifts ~50% of ISA_default outputs to proper
      DSO attribution. Codified in merge_substations() for reuse.
  - >
      **Step 5 alias-retighten pass now standard cohort-wide** (Israel
      Priority 14 codification + Colombia Priority 15 empirical validation).
      Countries with rich linguistic/legal-form OSM operator variance
      benefit from post-merge alias catchup. Colombia's 41 "Enel" +
      6 "Electricaribe-legacy" surfaced only post-fetch — patched via
      alias-retighten with provenance preservation.
  - >
      **55 distinct operators = richest cohort-wide DSO diversity yet**:
      Colombia's post-1994 unbundled electricity market (CREG-regulated
      ~30 regional DSOs + ISA state TSO + XM SO) produces the richest
      operator distribution. Emcali (Cali metro carve-out from Valle del
      Cauca EPSA) validates the intra-department geofence pattern.
  - >
      **Task #182 line-density outlier NOT triggered**: Colombia's baseline
      ratio 6.03 improved to 3.62 post-merge because OSM added mostly
      transmission-tier lines matching baseline (not MV distribution deep-
      ingestion like Slovenia/Israel/Norway). Norway remains the sole
      cohort-wide task #182 outlier (Israel joined at 24.76 in P14).
  - >
      **Overpass 504 gateway retry strategy empirically validated at
      country-scale**: Colombia (~1,142k km²) hit multiple 504s across all
      3 endpoints; endpoint-fallback + backoff recovered fully via cache
      + kumi.systems endpoint. Countries approaching ~1M km² threshold
      may need bbox partitioning by administrative cluster in future.

