# ── Data source primary — OSM Overpass API ──────────────────────────────

primary_source:
  source_id: CH-C1-osm-overpass
  publisher: OpenStreetMap contributors via Overpass API
  licence: ODbL (Open Database License) — attribution required
  endpoint_primary: https://overpass-api.de/api/interpreter
  endpoint_fallback: https://overpass.kumi.systems/api/interpreter
  endpoint_second_fallback: https://overpass.private.coffee/api/interpreter
  expected_query_scope: >
    3 element-type queries for substations (way + node + relation) + 1
    combined query for lines (power=line + cable + minor_line). Area
    header: area["ISO3166-1"="CH"]->.ch
  expected_yield:
    substations_way: 800-2000                 # High OSM density (Central European contributor cohort)
    substations_node: 400-1000
    substations_relation: 10-25
    lines: 3000-8000                          # LARGE gap vs baseline 625 (line densification MAJOR gain)
    line_ratio_pre_merge: 3.0-5.0             # Central European transmission density
    total_raw_bytes: ~15-40 MB                # 3-6× Iceland fetch scale
  expected_scale_context: >
    Switzerland is THIRD Wave 3 cohort at 947 baseline subs. Expected
    2-4× increase to ~1,900-3,800 net-new substations. Line densification
    expected to be MATERIAL (baseline 625 lines is significantly under
    Central European transmission density; expected 4-10× line growth
    to ~2,500-6,000 final line count). Central European OSM contributor
    density is HIGH (vs Nordic-Arctic Iceland sparsity) — single-query
    per element type expected to succeed reliably. Estimated ~5-10 min
    sandbox fetch. 504 gateway timeouts less likely than Iceland/Greek
    Nordic-Arctic/Mediterranean sparsity but possible on line-query
    (largest payload) — Convention #56 partial-fetch preservation ready.

# ── Grid architecture — Swissgrid federal TSO + 5+600 DSOs ──────────────

grid_architecture:
  tso_transmission:
    operator_id: SWISSGRID
    operator_names_aliases:
      - "Swissgrid"                             # German (Federal common name)
      - "Swissgrid AG"                          # With legal form
      - "Swissgrid ag"
      - "SWISSGRID"
      - "Swissgrid SA"                          # French legal form
      - "Swissgrid SpA"                         # Italian legal form
    voltage_thresholds:
      backbone_kv: 380                          # 380 kV backbone (30 subs)
      high_voltage_kv: 220                      # 220 kV EHV (117 subs)
      subtransmission_kv: 150                   # Occasional 150 kV interfacings
    tso_threshold_rule: "≥220 kV → SWISSGRID"    # Simple threshold; 150 kV boundary case
    established: 2006                           # BFE unbundled per EU 3rd Package via bilateral agreement
    unbundling_completed: 2009                  # Full asset transfer
    grid_synchronous: TRUE                      # UCTE/Continental Europe synchronous area
    grid_frequency_hz: 50
    cross_border_interconnectors: 41            # HIGHEST cohort-wide count (bilateral EU + Italy + Austria + France + Germany)
    note: >
      Swissgrid is HIGHEST-connectivity TSO cohort-wide with 41
      cross-border interconnectors to DE + FR + IT + AT. First
      non-EU-member cohort TSO — operates under bilateral EU relationship
      via BFE oversight (not EEA membership). CH ISO code + bilateral
      framework distinguishes Switzerland from cohort EEA members.

  dso_distribution:
