        - "Axpo Grid AG"
        - "Axpo"
        - "Axpo AG"                             # Parent Axpo Holding
        - "Axpo Holding"
        - "Axpo Holding AG"
        - "AXPO"
      territory: >
        Aargau + Zürich + Schaffhausen + Thurgau + parts of Zug + Bern
