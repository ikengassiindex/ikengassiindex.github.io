      Switzerland has ~600 DSOs cohort-wide — LARGEST DSO fragmentation
      in cohort. 5 major DSOs cover ~60-70% of population; remaining
      ~30-40% served by hundreds of small municipal utilities
      (Elektrizitätswerke). Convention #78 §4bis.5 Layer 3 geofence
      LIKELY REQUIRED for Zürich metro (EWZ + Axpo Grid cohabitation)
      + Geneva metro (SIG + Romande Energie cohabitation) —
      analogous to Warsaw Innogy Stoen carve-out pattern.

