# ── Convention #78 §4bis.5 Layer 3 geofence — LIKELY REQUIRED ────────────

convention_78_4bis_5_layer_3_geofence:
  status: LIKELY_REQUIRED_2_METRO_CARVE_OUTS
  target_regions:
    - Zürich Stadt (EWZ vs Axpo Grid cohabitation)
    - Genève (SIG vs Romande Energie cohabitation)
    - Lausanne (SIL vs Romande Energie cohabitation — smaller carve-out)
  layer_3_geofence_bboxes:
    zurich_metro: [47.32, 47.44, 8.45, 8.62]     # EWZ carve-out from Axpo Grid
    geneva_metro: [46.15, 46.28, 6.05, 6.20]     # SIG carve-out from Romande Energie
    lausanne_metro: [46.51, 46.55, 6.58, 6.68]   # SIL carve-out from Romande Energie
  rationale: >
    Switzerland has 3 major metro-DSO carve-outs analogous to Warsaw
    Innogy Stoen narrow carve-out pattern (Convention #78 §4bis.5 3rd
    enforcement pending). Zürich (EWZ) + Geneva (SIG) + Lausanne (SIL)
    operate as municipal DSOs within cantonal DSO territories (Axpo Grid
    + Romande Energie). Voltage-class Layer 1 (Swissgrid ≥220 kV)
    disambiguates TSO cleanly; but distribution-tier requires Layer 3
    geofence for metro-vs-cantonal DSO attribution.
  cumulative_enforcement_count_post_switzerland: 4-5    # If all 3 metro carve-outs triggered
    # Currently 2 (Prague CZ + Warsaw PL). Switzerland could add 2-3 (Zürich + Geneva + optional Lausanne)
  fallback_if_not_triggered: 2                    # Prague + Warsaw preserved

