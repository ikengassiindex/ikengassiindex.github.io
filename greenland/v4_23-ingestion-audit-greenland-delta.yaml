# ─────────────────────────────────────────────────────────────────────────────
# 3. Merge strategy — Option A (subs + lines one-shot)
# ─────────────────────────────────────────────────────────────────────────────
merge_strategy: Option A — subs + lines one-shot from sandbox
merge_strategy_rationale: |
  Greenland's small size (~44 subs + ~112 lines total, ~63 KB combined cache)
  enables end-to-end merge execution from sandbox — unlike Austria which
  required operator local execution due to ~5 min wall-clock.  Wall-clock
  measured: ~0.3 seconds for full pipeline (fetch from cache + merge + write).
  No operator-local dependency needed.

merge_operations:
  operation_1_owner_enrichment_via_pure_monopoly:
    scope: All 44 OSM substations
    architectural_distinction: |
      Unlike Austria (fragmented multi-utility — untagged → None) and
      Mexico (CFE-monopoly with industrial self-gen exceptions), Greenland
      applies PURE MONOPOLY fallback rule.  100% of tagged operators =
      Nukissiorfiit (28/28 subs + 2/2 lines at Step 2 probe).  Zero
      exceptions since Nukissiorfiit IS the sole utility.  Convention #56
      preserved via explicit provenance-class label 'nukissiorfiit_monopoly_fallback'.
    expected_direct_tagged: 28
    expected_monopoly_fallback: 16

  operation_2_voltage_cross_validation:
    scope: Matched pairs with both voltages populated
    threshold: max/min ratio > 1.5
    expected_finding_rate_pct: <5.0                # anchor: mid-Mexico (0.04%) and Austria (25.6%)

  operation_3_voltage_fill:
    scope: Matched pairs where existing has NO voltage
    expected_range: 5-15                            # baseline 45.9% missing → 17 subs eligible

  operation_4_net_new_substation_ingestion:
    scope: OSM subs with no existing match within 500m
    expected_range: 5-10                            # 44 OSM - 37 baseline = 7 raw delta

  operation_5_line_densification_REVERSED:
    scope: OSM lines with no existing match within 100m + tier ±20%
    baseline_richer_than_osm: true
    expected_appended_range: 0-10                   # baseline 125 vs OSM 112 = -13 raw
    architectural_note: |
      REVERSED delta — baseline (125) has more lines than OSM (112).
      This is expected: existing ingestion likely captured Nukissiorfiit
      operational line topology that OSM contributors haven't detailed.
      Merge still runs (net-new anything OSM has that existing doesn't)
      but contribution is small.

# ─────────────────────────────────────────────────────────────────────────────
# 4. Discipline #36 cross-border enforcement
# ─────────────────────────────────────────────────────────────────────────────
discipline_36_status:
  bounds_json: greenland/bounds.json (Mode 2, 540 KB — dense coastline detail)
  tolerance_km: 5.0                                 # Mode 2 fjord tolerance
  bounds_remediated: task #60 (2026-06-24 commit 86d7c9df)
  in_workstream_filter_expected: ~50 lines stripped (from 112 → ~62 retained)
  post_merge_sentinel_expected: PASS (0.00% outside)

# ─────────────────────────────────────────────────────────────────────────────
# 5. Convention preservation matrix
# ─────────────────────────────────────────────────────────────────────────────
convention_preservation:
  convention_46: N/A — single-country canonical
  convention_56_visibly_honest_degradation: |
    Applied end-to-end: (a) voltage stays None on OSM-untagged (no fabrication);
    (b) name stays None on OSM-untagged (no fabrication); (c) net-new subs
    get {} placeholders for L2/L3 dict-typed fields; (d) PURE MONOPOLY
    fallback tagged with explicit provenance-class label so downstream audit
    sees the inference chain.
  convention_60_non_commercial_provenance: |
    OSM (ODbL) only in Phase 1.  Nukissiorfiit public tariff schedules
    queued as Phase 2 supplement.  No commercial ESG providers.
  convention_64_strict_per_country: |
    Merge script writes ONLY to greenland/*.json.  Zero cross-country
    contamination possible by construction.

