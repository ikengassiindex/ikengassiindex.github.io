# SSI Index v4.23 workstream — Greenland Step 4 delta audit
#
# Purpose: state-transition anchor per METHODOLOGY_DISCIPLINES.md §5ter for
# the delta computation between existing greenland/ssi-data.json + grid-geo.json
# and fresh OSM Overpass output.  Documents Option A merge strategy (subs +
# lines one-shot from sandbox — Greenland is small enough to execute end-to-end
# without operator-local dependency).
#
# STATUS: CLOSED in-session.  Unlike Austria (which required operator local
# execution due to ~5 min wall-clock exceeding sandbox 45s bash budget),
# Greenland's small footprint (~44 subs + ~112 lines) allowed full merge
# execution from sandbox in ~0.3 seconds.

