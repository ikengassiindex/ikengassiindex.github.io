# ─────────────────────────────────────────────────────────────────────────────
# 4. Comparison vs existing baseline
# ─────────────────────────────────────────────────────────────────────────────
comparison_vs_baseline:
  substations:
    baseline: 37
    osm_fresh: 44
    expected_net_new_range: 5-10          # small — many baseline subs likely match OSM within 500m
    architectural_pattern: validation-workstream (not growth)
  lines:
    baseline: 125
    osm_fresh: 103-112                    # OSM has FEWER than existing
    expected_line_delta_range: -25 to +5  # NEGATIVE line densification possibility — baseline has richer coverage than OSM
    architectural_pattern: |
      Reverse of Austria — baseline richer than OSM.  This is expected given
      Greenland's isolated-microgrid architecture where existing ingestion
      likely captured Nukissiorfiit-supplied line topology data that OSM
      contributors haven't yet mapped in detail.  Line merge Option A should
      still run (net-new anything OSM has that existing doesn't) but the
      contribution will be SMALL.

# ─────────────────────────────────────────────────────────────────────────────
# 5. Architectural anchors for Step 3 L1 connector design
# ─────────────────────────────────────────────────────────────────────────────
step_3_architectural_anchors:
  fetch_strategy:
    substation_query: single-query per element type (node + way + relation) OR combined
    line_query: split-by-power-class (line + minor_line + cable) to avoid 504
    NO_bbox_partitioning_needed: |
      Greenland size (44 subs + 112 lines) fits in single-query per class.
      Austria-style bbox quadrants not necessary.
  discipline_36_cross_border_tolerance:
    mode: 2 (fjord + coastline simplification)
    tolerance_km: 5.0                     # inherited via Mode 2 remediation task #60
    bounds_source: greenland/bounds.json (540 KB — includes fjord/coastline detail)
  monopoly_fallback_rule:
    scope: ALL untagged substations + ALL untagged lines
    default_owner: Nukissiorfiit
    rationale: |
      PURE MONOPOLY market — Nukissiorfiit is the ONLY electricity utility for
      the entire country.  State-owned + 100% market share.  Empirically
      confirmed: 100% of tagged operators in BOTH substations (28/28) AND lines
      (2/2) are "Nukissiorfiit".  Unlike Mexico's CFE-monopoly (had industrial
      self-gen exceptions on some substations), Greenland has ZERO exceptions.
      Convention #56 visibly-honest degradation still applies to the untagged
      tail but fallback is architecturally sound at 100% confidence.
  provenance_class_labels:
    - osm_operator_tag_direct: 28 substations + 2 lines
    - nukissiorfiit_monopoly_fallback: 16 substations + 101 lines (Step 3 will apply)

