# ─────────────────────────────────────────────────────────────────────────────
# 1. OSM Overpass API probe methodology
# ─────────────────────────────────────────────────────────────────────────────
overpass_probe_methodology:
  endpoint_primary: https://overpass-api.de/api/interpreter
  endpoints_fallback:
    - https://overpass.kumi.systems/api/interpreter
    - https://overpass.private.coffee/api/interpreter
  user_agent: SSI-Index-Foundation/1.0 (+https://ikengassiindex.github.io)
  rate_limit_status_at_probe_start: "2 slots free (verified 2026-07-13T12:49Z)"
  query_scope_area_id: "ISO3166-1"="GL"
  query_strategy: |
    Greenland is small enough (44 subs + 112 lines total) to skip Austria's
    bbox-quadrant partitioning.  Single-query per class works cleanly for
    substations + power=line; power=minor_line + power=cable retrieved as
    separate queries to keep per-response payload under the ~1 MB soft cap
    that seems to trigger 504 gateway responses on out geom for combined
    queries.

