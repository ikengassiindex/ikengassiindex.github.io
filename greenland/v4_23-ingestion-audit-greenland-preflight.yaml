# SSI Index v4.23 workstream — Greenland Step 1 pre-flight audit
#
# Purpose: state-transition anchor per METHODOLOGY_DISCIPLINES.md §5ter for
# the empirical source-discovery pass on Greenland electricity grid data.
# Follows the exact Canada + Norway + Mexico + Austria Step 1 pattern.
#
# HEADLINE FINDING: Greenland is the SMALLEST + MOST UNIQUE v4.23 country.
# 44 OSM substations vs existing 37 (small delta ~7 net-new).  ONLY 21 OSM
# power=line features vs existing 125 (OSM has FEWER lines than existing —
# no line densification opportunity from OSM alone).  PURE MONOPOLY market
# structure: Nukissiorfiit is the ONLY electricity utility for the entire
# country + state-owned + 100% market share.  Greenland has ~80 isolated
# settlement microgrids (no interconnected national grid due to 88.7% ice
# cover), each with own generation mix (hydro + diesel + wind).  This
# workstream is a VALIDATION exercise (owner enrichment on existing subs
# via Nukissiorfiit-monopoly fallback + voltage fill from OSM) rather than
# a GROWTH workstream.
#
# Cross-references:
#   - canada/v4_23-ingestion-audit-canada-preflight.yaml (Priority 1 precedent)
#   - norway/v4_23-ingestion-audit-norway-preflight.yaml (Priority 2 precedent)
#   - mexico/v4_23-ingestion-audit-mexico-preflight.yaml (Priority 3 precedent)
#   - austria/v4_23-ingestion-audit-austria-preflight.yaml (Priority 4 precedent)

schema_version: v4_23-ingestion-audit-preflight-1
country_slug: greenland
discovery_date_utc: "2026-07-13"
author: ikenga-ssi-foundation
methodology_pin: v4.2

# ─────────────────────────────────────────────────────────────────────────────
# 1. Existing state (baseline)
# ─────────────────────────────────────────────────────────────────────────────
existing_state:
  ssi_data_json:
    substations: 37                       # SMALLEST v4.23 cohort
    voltage_kv_populated_pct: 54.1        # lowest across v4.23
    owner_populated_pct: 0.0
    regions_kommune:
      Kujalleq: 20                        # south (Qaqortoq + Nanortalik + Narsaq)
      Qeqertalik: 12                       # west-central (Aasiaat + Qasigiannguit)
      Qeqqata: 3                           # west-central (Sisimiut + Maniitsoq)
      Sermersooq: 1                        # capital region (Nuuk)
      Avannaata: 1                         # far north (Ilulissat)
    source_narrative: |
      OSM-derived from a prior ingestion vintage.  Discipline #36 remediation:
      Greenland was Mode-2 fjord-tolerance remediated per task #60 (2026-06-24
      commit 86d7c9df).  Small cohort reflects isolated-settlement architecture
      — Greenland has no interconnected national grid due to 88.7% ice cover;
      each of ~80 settlements has own microgrid.
  grid_geo_json:
    lines: 125
    schema_kind: compact_ssi_index_native
  cross_border_tolerance: default (probably 5km fjord-inherited from Mode 2)

# ─────────────────────────────────────────────────────────────────────────────
# 2. Greenland electricity data sources — empirical probe results
# ─────────────────────────────────────────────────────────────────────────────
source_discovery_probe_results:
  Nukissiorfiit_state_utility:
    homepage: https://www.nukissiorfiit.gl/
    http_status: 302 → live (Polylang multi-language)
    machine_accessible_data_endpoint: NO — publisher-managed portal only
    findings: |
      Nukissiorfiit (nunatsinnut ubloq unnuarlu — "energy day and night") is
      the state-owned utility with 100% market share.  Provides electricity +
      district heating + water services across all ~80 Greenlandic settlements.
      Publishes annual reports as PDFs, no machine-readable inventory API.
      Publicly-owned per Greenland Home Rule Act — accountable to Greenland
      Parliament (Inatsisartut).

  Statistics_Greenland_stat_gl:
    homepage: https://stat.gl/
    http_status: 200
    machine_accessible_data_endpoint: PARTIAL — statistical bank via PxWeb
    findings: |
      Grønlands Statistik publishes statistical yearbook data on energy
      consumption + generation by settlement.  PxWeb access at bank.stat.gl
      but not per-substation inventory.  Useful for L2 socio-economic
      enrichment (already integrated in pipeline for Greenland).

  Government_of_Greenland_naalakkersuisut_gl:
    homepage: https://naalakkersuisut.gl/
    http_status: 200
    machine_accessible_data_endpoint: NO — policy documents + press releases
    findings: |
      Naalakkersuisut (Government of Greenland) publishes energy policy
      documents including 2018 Energy Sector Framework Agreement + climate
      strategy.  No inventory data.

  Asiaq_Greenland_Survey:
    homepage: https://asiaq.gl/
    http_status: 301 → live
    machine_accessible_data_endpoint: PARTIAL — geodata portal
    findings: |
      Asiaq Grønlands Forundersøgelser (Greenland's basic survey agency)
      operates as national mapping + geodata authority.  Publishes basemap
      WMS services at basemap.asiaq.gl for cartographic rendering.  No
      dedicated electricity infrastructure vector layer.

  nunagis_gl_geoportal:
    homepage: https://www.nunagis.gl/
    http_status: 301 → live
    machine_accessible_data_endpoint: PARTIAL — WMS/WFS catalog
    findings: |
      NunaGIS is Greenland's national geoportal aggregating datasets from
      Asiaq + Statistics Greenland + Government of Greenland ministries.
      Multi-language (Kalaallisut + Danish + English).  Focus on natural
      resources + minerals + Arctic environment; electricity grid layers not
      prominent.  Feasibility of ingestion-suitable WFS discovery queued as
      Phase 2 candidate.

# ─────────────────────────────────────────────────────────────────────────────
# 3. OSM baseline empirical probe (the PROVEN L1 source)
# ─────────────────────────────────────────────────────────────────────────────
osm_baseline_probe:
  endpoint: https://overpass-api.de/api/interpreter
  query_pattern: 'area["ISO3166-1"="GL"];power=substation'
  empirical_counts_full_44:
    substation_nodes: 14
    substation_ways: 30
    substation_relations: 0
    substation_total: 44                    # SMALLEST v4.23 cohort
    delta_vs_existing: +7                    # very small growth potential
  query_pattern_lines: 'power=line'
  empirical_lines_count: 21                  # FEWER than existing 125!
  osm_lines_vs_existing_delta: -104         # OSM under-covers vs existing
  interpretation: |
    Greenland has the SMALLEST OSM electricity infrastructure coverage in
    v4.23.  Only 44 substations mapped across ~80 settlements (55%
    settlement-level coverage).  Only 21 power=line features vs existing
    grid-geo.json 125 lines — OSM has FEWER lines than existing state,
    likely because Greenland's inter-settlement submarine + underground
    cables are hard to survey and not consistently tagged.  Existing state
    ingestion appears to have captured more infrastructure than current OSM
    coverage (via a different data path, possibly Nukissiorfiit annual
    report or ISED/DTU Danish research datasets).

# ─────────────────────────────────────────────────────────────────────────────
# 4. OSM tag completeness on FULL 44-sub cohort
# ─────────────────────────────────────────────────────────────────────────────
osm_tag_completeness_full:
  substation_subtype: {count: 30, pct: 68.2}
  operator: {count: 28, pct: 63.6}         # PURE MONOPOLY (Nukissiorfiit 100% of tagged)
  voltage: {count: 19, pct: 43.2}          # LOWEST across v4.23
  ref: {count: 9, pct: 20.5}
  name: {count: 3, pct: 6.8}                # LOWEST across v4.23
  interpretation: |
    Greenland's OSM contributor community focused on operator + subtype
    tagging (63.6% + 68.2%) but under-mapped voltage (43.2%) and name
    (6.8%).  This reflects the isolated-settlement nature — Greenlandic
    substations are often "the substation" at a given settlement, not
    named individually.  Voltage information may not be publicly
    documented for many settlement microgrids.

# ─────────────────────────────────────────────────────────────────────────────
# 5. Operator distribution — TRUE MONOPOLY
# ─────────────────────────────────────────────────────────────────────────────
operator_distribution_full:
  distinct_operators_tagged: 1              # PURE MONOPOLY across v4.23
  breakdown:
    Nukissiorfiit: 28                        # 100% of tagged operator (28/28)
  untagged_16: for-cfe-style-fallback-application
  interpretation: |
    Greenland has the STRONGEST monopoly market structure across all v4.23
    priorities.  Nukissiorfiit is the SOLE electricity utility with 100%
    market share (state-owned, publicly accountable per Home Rule Act 1979).
    Compare Mexico CFE 92.4% (with 18 minority utilities) — Greenland has
    ZERO minority utilities.  Nukissiorfiit-monopoly fallback rule applies
    to 100% of the 16 untagged substations (unlike Mexico where industrial
    self-gen subs get owner=None per Convention #56 discipline).

# ─────────────────────────────────────────────────────────────────────────────
# 6. Substation subtype distribution
# ─────────────────────────────────────────────────────────────────────────────
substation_subtype_distribution:
  distribution: 18                          # settlement distribution
  unspec: 14                                 # subtype not tagged
  minor_distribution: 10                     # micro-settlement transformer
  generation: 1                              # power plant substation
  transmission: 1                            # rare — inter-settlement HV cable
  interpretation: |
    Distribution + minor_distribution + unspec = 42/44 (95%) — all
    settlement-level.  1 transmission = probably an inter-settlement HVDC
    submarine cable substation (Nuuk area or Ilulissat).  1 generation =
    substation at a hydropower station (Buksefjord + Amitsoq stations
    documented in Nukissiorfiit annual reports).

# ─────────────────────────────────────────────────────────────────────────────
# 7. Refutations of gap-audit projection
# ─────────────────────────────────────────────────────────────────────────────
refutations:
  refutation_1_micro_cohort_size:
    gap_audit_projection: [50, 200] net-new substations
    empirical_ceiling_at_pre_flight: 7        # OSM 44 - existing 37
    impact: |
      Greenland's substation-count growth potential is at most 7 net-new
      after 500 m dedupe — 10-30× smaller than gap-audit projection.
      Priority 5 Greenland is a MICRO-WORKSTREAM by scale.
  refutation_2_line_growth_absent:
    gap_audit_assumption: OSM has line coverage comparable to Norway
    empirical_finding: OSM 21 vs existing 125 — OSM has FEWER lines
    impact: |
      No line densification opportunity from OSM alone.  Existing state
      already better than OSM at line level.  If line growth is desired,
      only Nukissiorfiit annual report PDF extraction (queued as Phase 2)
      or a per-settlement microgrid mapping project (very heavy engineering
      effort) would deliver additional lines.

# ─────────────────────────────────────────────────────────────────────────────
# 8. Recommended L1 source architecture
# ─────────────────────────────────────────────────────────────────────────────
recommended_source_architecture:
  L1_primary_source:
    source_id: GL-C1-osm-overpass
    endpoint: https://overpass-api.de/api/interpreter
    query_pattern_substations: '[out:json];area["ISO3166-1"="GL"]->.gl;(node["power"="substation"](area.gl);way["power"="substation"](area.gl);relation["power"="substation"](area.gl););out center tags;'
    expected_substations: 44
    voltage_field: voltage= (43% coverage)
    owner_field: operator= (64% coverage; ALL Nukissiorfiit-labeled)
    rate_limit_strategy: |
      Full country queries return in ~5-10s — no bbox partitioning needed
      (Greenland OSM electricity dataset is tiny at 44 subs + 21 lines).
  L1_nukissiorfiit_monopoly_fallback_rule:
    difference_vs_mexico_cfe: |
      Mexico's CFE-monopoly rule applies to 82% of untagged subs BUT
      preserves industrial self-gen substations (owner=None per Convention
      #56).  Greenland has NO industrial self-gen substations in OSM —
      100% of untagged 16 subs get Nukissiorfiit-monopoly fallback with
      NO exception.  Simpler rule than Mexico.
  L1_supplement_source_1_deferred:
    source_id: GL-C2-nukissiorfiit-annual-report-pdf
    role: PDF extraction from Nukissiorfiit annual reports (asset inventory + generation mix)
    engineering_effort: 3-5 engineer-days
    priority: Phase 2 candidate — provides authoritative operator-verified data

