# SSI Index v4.3 workstream — Mexico Option A merge closure audit
#
# Purpose: state-transition anchor per METHODOLOGY_DISCIPLINES.md §5ter for
# the Option A execution — merging the OSM Overpass L1 federation output into
# mexico/ssi-data.json + running L2/L3 rescore + emitting voltage QA report.
#
# TL;DR — Mexico substation count 2,436 → 3,085 (+26.64% growth, LARGEST %
# growth of any v4.3 country).  Owner provenance 0.0% → 83.1% (via CFE-monopoly
# fallback + tag normalisation + industrial no-default discipline).  L3 rescore
# FULLY GREEN (all 6 ESG readiness checks READY at 100%).  Voltage QA
# essentially no-op (1 finding vs Norway's 191 — Mexican OSM tagging accuracy
# is dramatically higher).
#
# Lines DEFERRED to Step 5b: operator runs L1 connector locally to complete
# line densification (5-20k lines, 2-3× multiplier vs Norway's 11.6×).

schema_version: v4_3-ingestion-audit-merge-1
country_slug: mexico
merge_date_utc: "2026-07-13"
author: ikenga-ssi-foundation
methodology_pin: v4.2
option_chosen: A                    # per mexico/v4_3-ingestion-audit-mexico-delta.yaml
parent_state_transitions:
  - mexico/v4_3-ingestion-audit-mexico-preflight.yaml
  - mexico/v4_3-ingestion-audit-mexico-fetch.yaml
  - mexico/v4_3-ingestion-audit-mexico-delta.yaml (A/B/C options gate)
  - scripts/pipeline/ingestion/mexico/osm_overpass.py (L1 connector, commit f5bb9c09)
  - scripts/pipeline/ingestion/mexico/merge_into_ssi_data.py (federation merger, this commit)

# ─────────────────────────────────────────────────────────────────────────────
# 1. Substation merge outcome
# ─────────────────────────────────────────────────────────────────────────────
substation_merge_outcome:
  substation_count_before: 2436
  substation_count_after: 3085
  growth_absolute: 649
  growth_percent: 26.64                 # LARGEST % across v4.3 priorities
  matched_pairs_enriched: 2435
  voltage_filled_pairs: 2                # existing had voltage=0, OSM had voltage>0
  net_new_added: 649
  discipline_36_bounds_filtered: 13     # from Discipline #36 100m tolerance
  owner_coverage_before_pct: 0.0
  owner_coverage_after_pct: 83.1        # dramatically higher than Norway's 21.9%
  owner_coverage_by_provenance:
    cfe_monopoly_fallback: 2050         # untagged non-industrial → CFE canonical
    convention_56_industrial_self_gen_no_default: 516  # Convention #56 discipline
    osm_operator_tag_cfe_normalized: 475               # 20 CFE tag variants → canonical Spanish
    osm_operator_tag_native: 38                          # non-CFE OSM tags preserved verbatim
  distinct_owners_final: 15
  distinct_owners_breakdown:
    Comisión Federal de Electricidad: 2525    # 82% cohort (CFE + variants + fallback)
    Tren Maya: 20
    Sistema de Transporte Colectivo variants: 5
    Servicio de Transportes Eléctricos: 3
    Sistema de Transporte Colectivo Metro: 2
    others (industrial self-gen): 8

# ─────────────────────────────────────────────────────────────────────────────
# 2. Voltage cross-validation (near-empty artifact vs Norway rich)
# ─────────────────────────────────────────────────────────────────────────────
voltage_cross_validation:
  matched_pairs_evaluated: 2435
  voltage_tier_mismatches: 1
  voltage_tier_mismatch_rate_pct: 0.04   # 375× smaller than Norway's 15%
  sample_finding:
    existing_kv: 230.0
    osm_kv: 20.0
    distance_m: 44.1
    class: transmission_node_tagged_as_distribution
  report_path: mexico/v4_3-voltage-cross-validation.json
  downstream_use_case: |
    Mexican OSM voltage tagging accuracy is dramatically higher than Norwegian
    OSM (0.04% vs 15% mismatch rate).  LP-DD data-quality signal is essentially
    a no-op artifact — one finding vs Norway's 191.  Root cause hypothesis: fewer
    contributors + more centralised CFE reference docs available to Mexican OSM
    community.

# ─────────────────────────────────────────────────────────────────────────────
# 3. L2/L3 rescore execution — FULLY GREEN
# ─────────────────────────────────────────────────────────────────────────────
l2_l3_rescore_execution:
  status: FULLY GREEN — 5/5 phases green (best result across v4.3 workstreams)
  fix_applied_pre_rescore:
    seismic_zone_str_to_int: 2436 subs (Norway pattern precedent)
    socio_gdp_pc_alias: 2436 subs (Norway pattern precedent)
  phase_1_seismic: GREEN
  phase_2_climate: GREEN (existing subs had climate_trajectory; net-new inherited proximity fallback)
  phase_3_socioeconomic: GREEN (via Norway Step 6 schema-tolerance fix already committed)
  phase_4_merge_rescore: GREEN — all 3,085 substations scored, all with R_median + classification
  phase_5_kb_56_fleet_floor: GREEN — no R7_cyber-class blocker like Norway
  esg_readiness_all_ready:
    R1_Climate_Physical_Risk_Assessment: READY (100% coverage)
    R2_Grid_Equity_Social_Vulnerability: READY (100% coverage)
    R3_EU_Taxonomy_Alignment: READY (100% coverage)
    R4_Energy_Transition_DER_Stress: READY (100% coverage)
    R5_Pollution_Corrosion: READY (100% coverage)
    R6_Cybersecurity_Exposure: READY (100% coverage)
  pipeline_wall_clock_secs: 11.1
  interpretation: |
    Mexico closure is the CLEANEST L2/L3 execution in v4.3 — 5/5 phases green,
    all 6 ESG readiness checks 100%.  Contrast Norway 4/5 with R7_cyber D2
    drift blocker (Task #159 follow-on).  Root cause: Mexico's existing state
    was populated in a more recent pipeline vintage than Norway's, so no
    schema-versioning drift blocks fleet-floor validation.

# ─────────────────────────────────────────────────────────────────────────────
# 4. Fleet summary post-merge
# ─────────────────────────────────────────────────────────────────────────────
fleet_summary_post_merge:
  total: 3085
  median_R: 0.7527
  mean_R: 0.6125
  P5: 0.0
  P95: 1.0433
  classification_bands:
    Low: 708                    # 22.9%
    Medium: 224                  # 7.3%
    High: 600                    # 19.4%
    Critical: 1271               # 41.2% ← dominant class for Mexico
    Extreme: 282                 # 9.1%
  interpretation: |
    Mexican substation cohort skews toward Critical band (41.2%) reflecting
    combined seismic (Ring of Fire), climate (hurricane + coastal flooding),
    and socioeconomic (regional Gini disparity, energy poverty in certain
    states) risk stack.  Extreme band 9.1% is comparable to Iceland +
    Greenland proportions.

# ─────────────────────────────────────────────────────────────────────────────
# 5. Schema of new substations + enrichment fields
# ─────────────────────────────────────────────────────────────────────────────
new_substation_schema:
  populated_from_osm:
    - substation_id                # SHA-1(osm_id)[:12] prefixed "MX_v43_"
    - name                          # OSM name tag where available
    - latitude / longitude          # OSM WGS84
    - voltage_kv                    # OSM voltage= tag ÷ 1000 (or 0 placeholder)
    - owner                          # CFE-canonical via fallback rule OR None (industrial)
    - osm_feature_id                # osm_way_<id> / osm_node_<id> / osm_relation_<id>
    - osm_substation_subtype        # transmission/distribution/industrial/generation/traction
    - version                        # v4.2 methodology pin
    - v43_sources                    # ["MX-C1-osm-overpass"]
    - v43_provenance                 # dict — {source_id: {feature_id, owner_provenance, ...}}
  null_placeholders_filled_by_L2_L3_this_session:
    - seismic (via GEM PGA overlay)
    - climate_trajectory (via cross-cutting CMIP6)
    - socio_economic (via SSB-analog country data — DENUE not yet wired)
    - R_median + classification + all L3 fields (via v4.2 modifier chain)
  convention_56_visibly_honest_degradation: |
    Industrial self-gen substations preserved with owner=None per Convention #56
    — do NOT default to CFE since these are factory generation sites.  Non-
    industrial untagged subs default to CFE per monopoly rule.

# ─────────────────────────────────────────────────────────────────────────────
# 6. File impact + Convention #125 pre-commit sentinel compliance
# ─────────────────────────────────────────────────────────────────────────────
file_impact:
  ssi_data_json:
    size_before_mb: ~6.5
    size_after_mb: 7.8
    under_90mb_convention_125_threshold: true
  voltage_cross_validation_json:
    size_kb: 2
    role: data-quality artifact (1 finding)
  grid_geo_json:
    modified: false                     # Step 5b will modify with lines from operator local

# ─────────────────────────────────────────────────────────────────────────────
# 7. Step 5b — line densification (operator local)
# ─────────────────────────────────────────────────────────────────────────────
step_5b_line_ingestion_pending:
  scope: 5,000-20,000 net-new lines from OSM Mexico (2-3× multiplier over existing 8,701)
  who: operator (residential IP — Overpass API rate limits cloud IPs)
  commands: |
    python3 -m scripts.pipeline.ingestion.mexico.osm_overpass 2>&1 | tail -30
    # Runs full line ingestion (4 bbox quadrants) + delta match vs existing grid-geo
  followup_action_after_5b: |
    Re-run scripts.pipeline.run mexico to update fleet after line-densified topology.
    Emit mexico/v4_3-ingestion-audit-mexico-merge-step-5b.yaml addendum.

