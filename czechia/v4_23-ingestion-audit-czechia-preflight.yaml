layer_3_lat_lon_geofence_architecture:
  reason: >
    OSM Czechia is EXPECTED to NOT populate ref:nuts:3 tags on power=substation elements
    (Slovenia + Slovakia empirical precedent at cohort-wide scale). Layer 3 geofence MUST be
    codified preemptively at Step 3 connector authoring time per Convention #78 BINDING
    Layer 3 geofence sub-convention.
  four_layer_stack:
    layer_1: ČEPS TSO threshold ≥220 kV (voltage-based)
    layer_2: ref:nuts:3 tag → DSO map (forward-compat surface — expected 0 hits)
    layer_3: lat/lon geofence 3-region partition:
      pre_prague_metro:
        bounds: lat 49.94 → 50.18, lon 14.22 → 14.75
        resolves_to: PRE distribuce
        rationale: Prague administrative boundary (Hl. m. Praha capital city NUTS-2 CZ01)
      egd_south:
        rule: (lon < 15.50 AND lat < 49.60) OR (lon > 15.50 AND lon < 17.20 AND lat < 49.30)
        resolves_to: EG.D
        rationale: South Bohemia (western) + South Moravia (eastern) — 2 disjoint bboxes
        note: >
          Simplistic 2-bbox approximation for Step 3. If empirical fetch reveals attribution
          errors on Vysočina/Zlín boundary regions, refine bbox at Step 4 merge time
          (Slovakia precedent — Layer 3 geofence can be refined mid-workflow).
      cez_distribuce_default:
        rule: everything else in Czechia (Layer 3 catch-all)
        resolves_to: ČEZ Distribuce
        rationale: >
          Largest DSO by territory (~65% national coverage). Convention #56 preserved via
          voltage cross-check + baseline region cross-check.
    layer_4: ČEPS state-utility default (only true EHV ≥220 kV subs)
  expected_dso_distribution_post_merge:
    ČEZ Distribuce: 60-70%    # largest DSO
    EG.D: 12-18%
    PRE distribuce: 3-6%       # Prague metro
    ČEPS: 1-3%                 # only true EHV/HV interconnectors
    others_preserved: <2%       # railway traction + industrial captives

convention_78_binding_preemptive_alias_map_design:
  rationale: >
    Slovakia Priority 19 empirical VERDICT: 615 alias-normalised at fetch time (HIGHEST
    cohort-wide, 4-5× Latvia). Convention #78 BINDING enforcement PASSES. Czechia is the
    2nd empirical enforcement test with parallel Czech commercial-registry + Cyrillic +
    NFC diacritic + typographic-quote coverage.
  expected_alias_hits:
    cyrillic_low_expected: 2-8
      # ЧЕЗ (ČEZ) + ЧЕПС (ČEPS) — potential rare Cyrillic contributions
      # LESS common than Baltic Trio (Baltic contributors historically Russian-adjacent)
    czech_nfc_diacritics: 15-40
      # ě š č ř ž ý á í é ú ů ň ť ď ó
      # ČEZ / ČEPS / ČEZ Distribuce / EG.D / PRE distribuce
    typographic_quotes: 5-25
      # Czech uses „…" bottom-open + top-close same as Latvian typography
      # Latvia precedent: 122 subs; Czechia expected lower due to less common quoted-form OSM tags
    comma_separated_legal_form: 15-40
      # Czech commercial registry uses:
      # ČEZ Distribuce, a. s. (with space) — MOST COMMON
      # ČEZ Distribuce a.s.  (without space) — SECOND MOST COMMON
      # ČEZ Distribuce a. s. (partial space) — RARE
      # Sibling Slovak pattern per Convention #78 BINDING NEW sub-class
    predecessor_pre_2003_dso: 5-25
      # ČEZ absorbed 5 regional pre-2003 predecessors:
      # Východočeská energetika + Severomoravská + Středočeská + Západočeská + Severočeská
      # OSM tags may still carry pre-2003 legacy names — historical alias normalisation
    predecessor_e_on_pre_2021: 20-80
      # EG.D was E.ON Distribuce until 2021 rebrand — LARGEST predecessor alias class
      # OSM community has NOT yet migrated all E.ON tags → EG.D
      # Expected LARGEST predecessor alias class cohort-wide (2-4 years since rebrand)
    total_expected_alias_normalisation: 50-200
      # Middle-of-cohort — lower than Slovakia (615) but higher than most Baltic Trio countries
      # Empirical hypothesis: Czech OSM community more tag-consistent than Slovak
  expected_layer_3_geofence_hits: 800-1000
    # Same Slovakia precedent: Layer 2 NUTS-3 returns 0 hits
    # Layer 3 geofence carries 60-70% of DSO attribution
  post_merge_verdict_prediction: >
    Convention #78 BINDING 2nd enforcement test expected VERDICT: SUCCESS
    Layer 3 geofence sub-convention 2nd enforcement test expected VERDICT: SUCCESS
    (both sub-conventions BINDING-locked at Slovakia Priority 19; Czechia empirically reinforces)

