national_grid_architecture:
  bidding_zone: CZ (unified single Czech market — Nord Pool sync since 2015)
  entsoe_synchronous_area: Continental Europe (via CEPS)
  vertical_integration_status: unbundled
  four_operator_resolver:
    tso:
      name: ČEPS a.s.
      role: state-owned TSO 100% via Ministry of Industry and Trade (MPO)
      voltage_scope: 400 kV + 220 kV + selected 110 kV interconnectors (with DE + AT + SK + PL)
      predecessor: ČEZ transmission department (spun out 1998)
      market_cap: NA (state-owned)
      total_km: ~5,600 km (400+220 kV backbone)
    dso_1_largest:
      name: ČEZ Distribuce a.s.
      role: LARGEST DSO — parent ČEZ Group (69.8% state-owned via MPO)
      voltage_scope: 110 kV + 22/35 kV MV + 0.4 kV LV
      territory: >
        Bohemia excluding Prague + Silesia + Moravia excluding South Moravia (EG.D territory)
        Rough geofence: everything NOT Prague metro AND NOT South Bohemia AND NOT South Moravia
      customer_count: ~3.7M connections (~65% national market)
      predecessor_aliases:
        - ČEZ Distribuce, a. s. (comma-separated legal-form variant per Convention #78 BINDING)
        - Východočeská energetika (pre-2003 East Bohemia predecessor)
        - Severomoravská energetika (pre-2003 North Moravia predecessor)
        - Středočeská energetická (pre-2003 Central Bohemia predecessor)
        - Západočeská energetika (pre-2003 West Bohemia predecessor)
    dso_2_south:
      name: EG.D a.s.
      role: DSO — rebranded 2021 from E.ON Distribuce (E.ON Germany sold Czech operations to Sazka Group)
      voltage_scope: 110 kV + MV + LV
      territory: South Bohemia + South Moravia + parts of Vysočina + parts of Zlín
      customer_count: ~1.2M connections (~15% national market)
      predecessor_aliases:
        - E.ON Distribuce a.s. (pre-2021 rebrand — MOST COMMON legacy OSM tag)
        - E.ON Česká republika s.r.o.
        - E.ON Distribuce, a. s. (comma-separated legal-form variant)
        - JČE Jihočeská energetika (pre-2001 South Bohemia predecessor)
        - JME Jihomoravská energetika (pre-2001 South Moravia predecessor)
    dso_3_prague:
      name: PRE distribuce a.s.
      role: Prague metro monopoly DSO
      voltage_scope: 110 kV + MV + LV
      territory: Prague metropolitan area ONLY (bbox 49.94-50.18 lat, 14.22-14.75 lon)
      customer_count: ~750,000 connections (~4% national market)
      parent: Pražská energetika a.s. (58% EnBW Germany + 42% City of Prague)
      predecessor_aliases:
        - Pražská energetika a.s. (parent holding — may appear on some OSM tags)
        - PRE distribuce, a. s. (comma-separated legal-form variant)
