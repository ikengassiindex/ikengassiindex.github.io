# ---------------------------------------------------------------
# Voltage-class × RICHEST multi-DSO resolver
# ---------------------------------------------------------------
voltage_class_dso_resolver:
  pattern: MULTI_LAYER_TSO_PLUS_REGIONAL_DSO_PLUS_METRO_GEOFENCE
  layers:
    - name: Transpower TSO threshold
      condition: voltage_kv >= 110
      attribution: Transpower
      priority: 1
      note: NZ transmission tier is 220/110/66 kV; ≥110 kV → Transpower TSO
    - name: KiwiRail electrified traction
      condition: voltage_kv in [25, 26] AND name contains rail_context
      attribution: KiwiRail
      priority: 2
    - name: NZAS Tiwai Point aluminium smelter
      condition: name matches ['NZAS', 'Tiwai Point', 'Bluff Aluminium']
      attribution: NZAS
      priority: 3
    - name: Auckland metropolitan carve-out (§4bis.5 Layer 3 geofence — 5th enforcement)
      condition: region == 'Auckland' AND voltage_kv < 110
      sub_layers:
        - condition: lat >= -36.85 AND lat <= -36.75 AND lon >= 174.65 AND lon <= 174.90
          attribution: Vector
          note: Vector Auckland CBD + suburbs geofence
        - condition: lat < -37.00 OR (name contains 'Papakura' OR name contains 'Franklin')
          attribution: Counties Energy
          note: Counties Energy south of Auckland CBD
        - condition: fallback
          attribution: Vector
          note: Vector catch-all for Auckland region
      priority: 4
    - name: Wellington metropolitan (single-EDB — no geofence needed)
      condition: region == 'Wellington' AND voltage_kv < 110
      attribution: Wellington Electricity
      priority: 5
    - name: Canterbury metropolitan (Orion NZ Christchurch + regional split)
      condition: region == 'Canterbury' AND voltage_kv < 110
      sub_layers:
        - condition: lat >= -43.70 AND lat <= -43.40 AND lon >= 172.30 AND lon <= 172.85
          attribution: Orion New Zealand
          note: Orion Christchurch metropolitan geofence
        - condition: lat < -43.90
          attribution: Alpine Energy
          note: Alpine Energy South Canterbury (Timaru + Twizel)
        - condition: lat > -43.20
          attribution: MainPower NZ
          note: MainPower North Canterbury (Rangiora + Amberley)
        - condition: fallback
          attribution: Orion New Zealand
          note: Orion catch-all for Canterbury region
      priority: 6
    - name: Region → dominant EDB map (Layer 3)
      condition: voltage_kv < 110 AND region is not null
      attribution: <region-mapped EDB>
      priority: 7
    - name: Transpower catch-all
      condition: fallback
      attribution: Transpower
      priority: 8  # LAYER 5 CATCH-ALL

