# ---------------------------------------------------------------
# Convention #78 §4bis.5 Layer 3 geofence assessment
# ---------------------------------------------------------------
layer_3_geofence:
  enforcement_needed: true  # 5th COHORT-WIDE ENFORCEMENT EXPECTED
  rationale: |
    Auckland region (253 subs) splits between Vector (metropolitan CBD +
    suburbs, ~65% of Auckland) and Counties Energy (southern Auckland,
    Papakura + Franklin + Waiuku, ~35%). Simple region → EDB mapping
    insufficient; lat/lon geofence required to disambiguate.

    Cumulative Convention #78 §4bis.5 enforcement expected to grow
    to 5:
    - Prague CZ (Czechia P20)
    - Warsaw PL (Poland P21)
    - EWZ Zurich CH (Switzerland P24)
    - SIG Geneva CH (Switzerland P24)
    - NEW: Auckland NZ (Vector vs Counties Energy split)

    Wellington (single-EDB Wellington Electricity) does NOT require
    geofence — Powerco Wairarapa is geographically distinct
    (Masterton region separate from Wellington City).

    Christchurch (Canterbury region) considered but Orion NZ is
    dominant enough that a soft-boundary Layer 3 admin-based
    attribution suffices; keeping metropolitan geofence to Auckland
    only for empirical parsimony. If Step 4 empirical outcome shows
    Christchurch attribution ambiguity, extend to 6th enforcement
    retroactively.
  proposed_enforcement:
    auckland_vector_geofence:
      lat_min: -36.85
      lat_max: -36.75
      lon_min: 174.65
      lon_max: 174.90
      attribution: Vector
      note: Auckland CBD + North Shore + eastern suburbs
    auckland_counties_energy:
      condition: name contains 'Papakura' OR 'Franklin' OR 'Waiuku' OR lat < -37.00
      attribution: Counties Energy
      note: Auckland southern (below Manukau Harbour approx.)

# ---------------------------------------------------------------
# Discipline #36 cross-border filter (EXISTING NZ ENTRY)
# ---------------------------------------------------------------
discipline_36:
  boundary_tolerance_km: 5.0  # existing entry from Mode 2 remediation
  existing_tolerance_source: cross_border_tolerances.json
  rationale_existing: |
    Heavily indented Pacific coastline (North Cape, East Cape,
    Coromandel, Fiordland, Stewart Island); bounds.json simplified
    at sub-cadastral precision. 100% of prior audit outliers sat
    within 5 km of polygon edge. Cleared 101 of 101 audit outliers;
    max observed drift 3.8 km.
  cross_border_interconnectors: 0  # No submarine link to Australia or Pacific islands
  cook_strait_hvdc_status: DOMESTIC  # HVDC Inter-Island link is intra-NZ
  chatham_kermadec_tokelau_status: TERRITORIAL_EXTENSIONS_INCLUDED  # Mode 3 pattern
  ross_dependency_antarctic: EXCLUDED  # Antarctic territorial claim not within grid scope
  expected_pre_filter_drift_pct: 0.5  # LOW (existing tolerance validated)
  cohort_precedent: iceland  # Nordic + NZ share isolated-grid + coastline patterns

# ---------------------------------------------------------------
# Discipline #41 line parity target
# ---------------------------------------------------------------
discipline_41:
  target_ratio_range: [1.5, 5.0]  # Healthy band
  baseline_line_count: null  # to be captured from grid-geo.json at Step 4
  projection: |
    NZ transmission grid: ~11,000 km Transpower 220/110/66 kV
    NZ distribution grid: ~200,000 km MV/LV across 29 EDBs
    Baseline likely captures transmission + significant MV
    distribution (given 1558 baseline subs); OSM captures full
    MV/LV distribution. Expected line-substation ratio
    HEALTHY (3-8×) — between Korean (3.29) transmission-focused
    and Irish (46.27) full MV/LV over-capture.

