# Convention #56 hazard baselines (Phase 4c prep)
# ---------------------------------------------------------------
convention_56_hazard_baselines:
  flood: 0.60        # Wet+temperate Pacific climate + Auckland pluvial + Canterbury river floods (2021 Westport)
  wildfire: 0.30     # Alpine + Canterbury dry east + Northland wildfire clusters
  winter: 0.40       # Southern Alps + South Island winter + Wellington storm gusts
  adapt: 0.75        # Zero Carbon Act 2019 + NZ ETS 2008 + Climate Change Commission
  compound: 0.60     # Alpine Fault + Wellington fault + Wairarapa fault seismic + storm compounds
  just: 0.30         # Coal transition slower (Huntly retained) + Southland Tiwai smelter closure/preserve ambiguity
  sources:
    - JRC EU-Flood-Atlas (analog for Pacific pluvial exposure)
    - Copernicus (Sentinel-3 wildfire monitoring)
    - ECMWF ERA5 (winter cold snap + storm climatology)
    - ND-GAIN adaptation index (NZ rank ~11/181, 2024 — HIGH)
    - IPCC AR6 Australasia chapter (drought + storm projection)
    - Just-Transition Fund analog: NZ Just Transitions Unit (post-2018 Taranaki oil-gas)
    - GeoNet (NZ seismic + volcanic monitoring)

