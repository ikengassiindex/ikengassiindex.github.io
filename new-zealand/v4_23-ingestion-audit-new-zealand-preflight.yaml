      url: https://www.ea.govt.nz/
      purpose: 29 EDB registry + Electricity Industry Participation Code
      convention_60_compliant: true  # Regulatory authority
    - name: Electricity Networks Association (ENA)
      url: https://www.ena.org.nz/
      purpose: 29 EDB member directory + regional coverage cross-check
      convention_60_compliant: true  # Public industry association
    - name: Stats NZ (Statistics New Zealand)
      url: https://www.stats.govt.nz/
      purpose: 16 regions boundary + population/GDP context
      convention_60_compliant: true  # Public statistics agency

