lessons_generalised:
  - >
      **Monopoly + optional nested geofence overlay** is architecturally clean:
      the base default (Creos ~90%) handles the dominant case; small municipal
      DSOs get precise attribution via tight bounding boxes without breaking
      the pattern. Greenland was pure single-owner; Luxembourg accommodates
      small exceptions.
  - >
      **Historical alias normalisation depth matters**: Luxembourg required
      collapsing pre-2009 CEGEDEL predecessor + Enovos supply sibling +
      current Creos SA all to Creos. Case-insensitive alias map handles
      this via one lookup dict.
  - >
      Luxembourg's 1 voltage-mismatch/164 matched pairs (0.6%) ties with
      Netherlands as the cleanest EU country empirically — reinforces that
      metropolitan-dense OSM has excellent voltage tagging.
  - >
      Smallest cohort-wide file footprint (ssi-data 1.0 MB, grid-geo 0.4 MB)
      confirms Luxembourg is comfortably below task #125's 90 MB sentinel
      threshold with 6+ orders of magnitude headroom.

