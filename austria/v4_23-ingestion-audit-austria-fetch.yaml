# ─────────────────────────────────────────────────────────────────────────────
# 1. OSM Overpass API probe methodology + observed capacity issue
# ─────────────────────────────────────────────────────────────────────────────
overpass_probe_methodology:
  endpoint: https://overpass-api.de/api/interpreter
  user_agent: SSI-Index-Foundation/1.0
  observed_capacity_issue: |
    After ~4 hours of heavy Priority 3 Mexico ingestion (2 substation queries +
    5 line quadrant queries × ~40 MB average payload) the sandbox IP received
    consistent HTTP 504 and 406 responses on Austria queries — even for small
    nodes-only bbox queries.  Rate limit status API shows 2 slots available
    but actual GetFeature requests reject in <10s with fixed 695-byte 504
    error page or 371-byte 406 response.  Pattern indicates soft IP blocking
    or WAF rate-throttling activated after cumulative daily volume threshold.
  mitigation: |
    Full Austria fetch deferred to Step 5b operator-local execution per Mexico
    precedent (Overpass API accessible from residential IP with different
    quota class).  L1 connector build (Step 3) proceeds with well-anchored
    total counts + 500-sub sample tag completeness measurements from Step 1.

