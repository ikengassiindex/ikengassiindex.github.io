  methodology: |
    500-way sample from same country + same power tag is expected to be
    representative for tag-completeness distributions (features that share
    the OSM community + editing conventions).  Extrapolation caveat: OSM
    contributor patterns for less-mapped LV distribution transformers may
    have different (typically lower) metadata coverage than the sample.
