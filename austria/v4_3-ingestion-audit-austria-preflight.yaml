# SSI Index v4.3 workstream — Austria Step 1 pre-flight audit
#
# Purpose: state-transition anchor per METHODOLOGY_DISCIPLINES.md §5ter for
# the empirical source-discovery pass on Austrian electricity grid data.
# Follows the exact Canada + Norway + Mexico Step 1 pattern.
#
# HEADLINE FINDING: Austria has the STRONGEST OSM contributor discipline and
# HIGHEST OSM-native operator tagging coverage of any v4.3 priority country.
# OSM Austria holds 15,213 substation elements vs existing 741 — 20× ratio,
# the LARGEST relative delta across all 5 priority countries.  77.2% of OSM
# subs carry operator= tags directly (vs Mexico 16.6%, Norway ~30% via OSM
# tags before NVE enrichment).  9 distinct utility owners visible in top-10
# (APG TSO + 8 regional Bundesland DSOs + ÖBB railway traction).  Rich EU
# INSPIRE-compliant government open-data infrastructure at data.gv.at +
# basemap.at + e-control.at but interactive UI layer blocks bulk machine
# access from cloud IPs.
#
# Cross-references:
#   - canada/v4_3-ingestion-audit-canada-preflight.yaml (Priority 1 precedent)
#   - norway/v4_3-ingestion-audit-norway-preflight.yaml (Priority 2 precedent)
#   - mexico/v4_3-ingestion-audit-mexico-preflight.yaml (Priority 3 precedent)

schema_version: v4_3-ingestion-audit-preflight-1
country_slug: austria
discovery_date_utc: "2026-07-13"
author: ikenga-ssi-foundation
methodology_pin: v4.2

# ─────────────────────────────────────────────────────────────────────────────
# 1. Existing state (baseline)
# ─────────────────────────────────────────────────────────────────────────────
existing_state:
  ssi_data_json:
    substations: 741                     # SMALLEST v4.3 country baseline
    voltage_kv_populated_pct: 100.0      # highest-quality baseline coverage
    owner_populated_pct: 0.0             # SAME gap as Norway + Mexico pre-v4.3
    top_regions_bundeslaender:
      Niederösterreich: 163
      Oberösterreich: 122
      Steiermark: 95
      Tirol: 92
      Kärnten: 82
      Burgenland: 55                    # estimated from remaining
      Salzburg: 51                       # estimated
      Wien: 46                           # estimated
      Vorarlberg: 35                     # estimated
    source_narrative: |
      OSM-derived from a prior ingestion vintage, post-Discipline #36 filter.
      Discipline #36 remediation history: Austria was one of first countries
      remediated per task #56 (2026-06-24 commit 86d7c9df).
  grid_geo_json:
    lines: 5252
    schema_kind: compact_ssi_index_native
  cross_border_tolerance: default 100m   # no fjord/coastline complexity

# ─────────────────────────────────────────────────────────────────────────────
# 2. Austrian electricity data sources — empirical probe results
# ─────────────────────────────────────────────────────────────────────────────
source_discovery_probe_results:
  APG_austrian_power_grid_TSO:
    homepage: https://www.apg.at/
    http_status: 200
    machine_accessible_data_endpoint: NO — publisher-managed portal only
    findings: |
      Austrian Power Grid (APG) publishes market-operations data (load flows,
      congestion, tariffs) but does NOT publish machine-accessible geospatial
      inventory of transmission assets.  Contrast Norway NVE Nettanlegg WFS
      with rich schema.  APG operates 220/380 kV Sentralnett-equivalent
      backbone in Austria — 14 subs directly tagged in OSM as APG-operated
      per Step 1 empirical probe of 500-sub sample.

  E_Control_regulator:
    homepage: https://www.e-control.at/
    http_status: 200
    machine_accessible_data_endpoint: NO — consumer-facing pages only
    findings: |
      E-Control publishes electricity network tariffs + statistical annual
      reports as PDFs.  Consumer-facing pages under /konsumenten/stromnetzentgelte-aktuell
      + industry-facing under /industrie/strom/stromnetz.  No REST API or
      WFS endpoint for infrastructure inventory.

  data_gv_at_national_open_data_portal:
    URL: https://www.data.gv.at/
    http_status: 200
    machine_accessible_data_endpoint: PARTIAL — CKAN API returns empty via cloud IP
    findings: |
      Austria's national open-data portal on CKAN.  Standard
      /katalog/api/3/action/package_search endpoint returns HTML/empty from
      cloud IPs (likely WAF-blocked, similar pattern to Mexico datos.gob.mx).
      Portal aggregates data.gv.at + regional Bundesland OGD sources under
      the /katalog/dataset URL space.  Direct search from cloud IPs did not
      surface substation inventory catalogs.

  basemap_at_national_geoservice:
    URL: https://basemap.at/
    http_status: 200
    machine_accessible_data_endpoint: PARTIAL — tile map service only
    findings: |
      Austria's national base-map WMTS at maps.wien.gv.at + basemap.at.  Serves
      cartographic tiles for map rendering but no vector infrastructure layers.
      Some Bundesländer publish INSPIRE-compliant WMS/WFS (Vienna at
      wien.gv.at, Salzburg at salzburg.gv.at, etc.) — feasibility of
      per-Bundesland federation queued as Phase 2 candidate.

  Statistik_Austria:
    URL: https://www.statistik.at/
    http_status: 200
    machine_accessible_data_endpoint: STATcube — with authentication
    findings: |
      Statistik Austria's STATcube publishes aggregate statistics (installed
      capacity, generation mix, network length by Bundesland) but not per-
      substation inventory.  Rich socio-economic dataset for L2 enrichment
      already used elsewhere in pipeline.

  ENTSO_E_Transparency_Platform:
    URL: https://transparency.entsoe.eu/
    http_status: 200
    machine_accessible_data_endpoint: YES — REST API with token
    findings: |
      EU-wide TSO transparency portal.  ENTSO-E publishes physical asset
      registries + generation unit lists + interconnector metadata for all
      TSO members (including APG for Austria).  Public REST API available at
      transparency.entsoe.eu/api with security token registration.  Could
      contribute APG-tier substation enrichment (transmission-only, ~40-60
      substations) via Phase 2 supplement.

# ─────────────────────────────────────────────────────────────────────────────
# 3. OSM baseline empirical probe (the PROVEN L1 source)
# ─────────────────────────────────────────────────────────────────────────────
osm_baseline_probe:
  endpoint: https://overpass-api.de/api/interpreter
  query_pattern: 'area["ISO3166-1"="AT"];power=substation'
  empirical_counts:
    substation_nodes: 1676
    substation_ways: 13528
    substation_relations: 9
    substation_total: 15213               # 20× MORE than existing 741 baseline
    delta_vs_existing: +14472              # LARGEST relative delta in v4.3
  query_pattern_lines: 'power=line'
  empirical_lines_count: 5651
  osm_lines_vs_existing_delta: +399       # small line growth — existing was already comprehensive
  interpretation: |
    Austria has EXTREMELY DENSE OSM electricity infrastructure coverage —
    contributors have mapped down to LV/MV distribution transformers and
    small switching cabinets.  15,213 substation elements is 20× the existing
    ssi-data.json baseline of 741, suggesting the existing state captured
    only the HV backbone + major regional substations (~5% of full OSM
    coverage).  Line coverage is already comprehensive at 5,252 vs 5,651 OSM
    (7.6% growth potential).

# ─────────────────────────────────────────────────────────────────────────────
# 4. OSM tag completeness on 500-sub sample (best-in-cohort)
# ─────────────────────────────────────────────────────────────────────────────
osm_tag_completeness_sample_500:
  voltage: {count: 399, pct: 79.8}       # comparable to Norway/Mexico
  operator: {count: 386, pct: 77.2}      # BEST-IN-COHORT (vs Mexico 16.6%, Norway ~30%)
  name: {count: 375, pct: 75.0}          # BEST-IN-COHORT
  interpretation: |
    Austrian OSM contributor community has the HIGHEST tagging discipline
    across all v4.3 priorities.  Operator-tag coverage at 77.2% eliminates
    the need for a monopoly-fallback rule (unlike Mexico's CFE default).
    Voltage-tag coverage matches Norway/Mexico range at ~80%.  This suggests
    Austrian OSM ingestion will be nearly direct without needing enrichment
    rules — Convention #56 visibly-honest degradation applies only to the
    ~20% untagged tail.

# ─────────────────────────────────────────────────────────────────────────────
# 5. Operator distribution — 9 distinct utilities in top 10 of sample
# ─────────────────────────────────────────────────────────────────────────────
operator_distribution_sample:
  distinct_utilities_in_top_10: 9
  breakdown_top_10_from_500_sample:
    - {operator: "ÖBB-Infrastruktur AG", count: 48, class: railway_traction}
    - {operator: "Netz Niederösterreich", count: 46, class: dso_niederoesterreich}
    - {operator: "Netz Oberösterreich", count: 25, class: dso_oberoesterreich}
    - {operator: "Wiener Netze", count: 22, class: dso_vienna}
    - {operator: "KNG-Kärnten Netz GmbH", count: 21, class: dso_kaernten}
    - {operator: "Energie Steiermark", count: 19, class: dso_steiermark}
    - {operator: "Energienetze Steiermark", count: 16, class: dso_steiermark}
    - {operator: "Austrian Power Grid AG", count: 14, class: tso_national}
    - {operator: "Netz Burgenland", count: 13, class: dso_burgenland}
    - {operator: "EVN", count: 12, class: energy_supplier}
  interpretation: |
    Austrian electricity market structure is FRAGMENTED across 9 Bundesland
    DSOs (one per state) + APG national TSO + ÖBB railway traction.  Contrast
    Mexico CFE-monopoly (92% single utility).  Contrast Norway 90 distinct
    utilities via Brønnøysund eierOrgnr.  Austrian structure is intermediate:
    ~10-15 major utilities cover 90% of grid infrastructure via OSM tags.
    NO monopoly-fallback rule needed.

# ─────────────────────────────────────────────────────────────────────────────
# 6. Substation subtype distribution (500-sample)
# ─────────────────────────────────────────────────────────────────────────────
substation_subtype_distribution:
  distribution: 150                       # standard MV/LV distribution
  transmission: 130                        # HV backbone
  unspec: 88                                # subtype not tagged
  minor_distribution: 79                    # LV substation-cabinets
  traction: 44                              # ÖBB railway 15 kV 16.7 Hz + tram/metro
  industrial: 3
  converter: 2
  generation: 2
  yes: 1
  transition: 1
  interpretation: |
    30% pure distribution + 16% minor_distribution + 9% traction = 55% of
    Austrian OSM substations are LV/MV grid features that the existing
    741-sub baseline did NOT capture.  This confirms the 20× ratio: existing
    state ingested transmission + regional backbone only; OSM has full
    distribution grid down to individual transformer cabinets.

# ─────────────────────────────────────────────────────────────────────────────
# 7. Refutations of gap-audit projection
# ─────────────────────────────────────────────────────────────────────────────
refutations:
  refutation_1_yield_much_larger_than_projected:
    gap_audit_projection: [500, 1500] net-new substations
    empirical_ceiling_at_pre_flight: 14472    # OSM 15,213 - existing 741
    impact: |
      OSM Austria substation total is 15,213 — 10× the gap-audit projection
      of 500-1,500 net-new.  Realistic yield after 500 m dedupe expected in
      the 8,000-12,000 range — the LARGEST substation-count growth of any
      v4.3 country by 10-15×.
  refutation_2_operator_tagging_much_richer_than_expected:
    gap_audit_assumption: OSM operator tagging comparable to Mexico (~15%)
    empirical_finding: 77.2% operator tagging in 500-sample
    impact: |
      Austrian OSM tagging is best-in-cohort.  NO CFE-monopoly-style default
      rule needed.  Direct OSM operator= tag propagation covers 77% of
      ingestion by construction.  Convention #56 visibly-honest degradation
      applies only to the ~20% untagged tail (probably small distribution
      cabinets contributed by mappers less careful with metadata).

# ─────────────────────────────────────────────────────────────────────────────
# 8. Recommended L1 source architecture
# ─────────────────────────────────────────────────────────────────────────────
recommended_source_architecture:
  L1_primary_source:
    source_id: AT-C1-osm-overpass
    endpoint: https://overpass-api.de/api/interpreter
    query_pattern_substations: '[out:json];area["ISO3166-1"="AT"]->.at;(node["power"="substation"](area.at);way["power"="substation"](area.at);relation["power"="substation"](area.at););out center tags;'
    expected_substations: 15213
    voltage_field: voltage= (OSM tag, in volts; convert to kV)
    owner_field: operator= (OSM tag; 77.2% coverage)
    name_field: name= (OSM tag; 75% coverage)
    rate_limit_strategy: |
      Split by element type (way + node + relation) to avoid single-query 504.
      Austria is smaller than Mexico by area — bbox partitioning likely
      unnecessary; single-country queries should return in <30s.
  L1_no_monopoly_fallback:
    difference_vs_mexico: |
      Mexico's CFE-monopoly fallback rule is NOT needed for Austria.  Austrian
      market structure is fragmented across ~15 distinct utility owners
      (APG TSO + 8 Bundesland DSOs + ÖBB rail + smaller specialty operators).
      Direct OSM operator= tag propagation covers 77% of subs by construction;
      Convention #56 visibly-honest degradation applies to the ~20% untagged
      tail.
  L1_supplement_source_1_deferred:
    source_id: AT-C2-entso-e-transparency
    endpoint: https://transparency.entsoe.eu/api
    role: APG-tier transmission substation enrichment (~40-60 subs)
    requires_auth: YES — free ENTSO-E security token
    priority: Phase 2 candidate — provides EU-wide harmonized transmission asset registry
  L1_supplement_source_2_deferred:
    source_id: AT-C3-bundeslaender-inspire-wfs-federation
    role: Per-Bundesland INSPIRE-compliant WFS (Vienna wien.gv.at + Salzburg + etc.)
    engineering_effort: 3-6 engineer-days per Bundesland
    priority: Phase 2+ candidate — feasibility discovery required per state

