  file_size_bytes: 80004                          # ~78 KB per-finding audit trail
  matched_pairs_evaluated: 1234
  tier_mismatches: 316
  mismatch_rate_pct: 25.61                        # HIGH vs Mexico 0.04% — real data-quality signal
  mismatch_rate_interpretation: |
    Austrian OSM voltage-tag heterogeneity across 9+ utility contributors:
    (a) unit inconsistency — some contributors tag "220000" (volts) or
    "220000 V", others "220" (kV) or "220 kV";
    (b) MV substation tier ambiguity — one contributor tags the HV side
    (e.g. 132 kV incoming), another tags the LV side (e.g. 20 kV outgoing);
    (c) prior-vintage OSM baseline vs current OSM Overpass fetch capture
    different contributor edits.
    Recommend Phase 2 supplement: cross-validate against APG public network
    diagram (PDF, deferred to Phase 2 candidate) for 220/380 kV subs and
    against Bundesländer DSO published tariff schedules for MV subs.
  expected_range_from_step_4a: "<0.5%"           # anchor was Mexico-precedent; Austria is genuinely higher

