  hangul_diacritics_normalized: true  # NFC normalization for jamo composition
  binding_threshold_hits_projection: 100  # LARGE — Hangul + Latin dual script
  binding_threshold_actual_TBD_step_4: null

# ---------------------------------------------------------------
# Voltage-class × single-DSO resolver
# ---------------------------------------------------------------
voltage_class_dso_resolver:
  pattern: SINGLE_DSO_PLUS_DISPATCH  # KEPCO owns, KPX dispatches
  layers:
    - name: KHNP nuclear identity
      condition: name matches ['고리', '한빛', '한울', '월성', '새울', '신고리', '신월성', '신한울', 'Kori', 'Hanbit', 'Hanul', 'Wolseong', 'Saeul', 'Shin-Kori', 'Shin-Wolseong', 'Shin-Hanul']
      attribution: KHNP
      priority: 1
    - name: 765 kV ultra-EHV backbone
      condition: voltage_kv >= 765
      attribution: KEPCO Transmission (ultra-EHV)
      priority: 2
    - name: 345 kV EHV backbone
      condition: voltage_kv >= 345 AND voltage_kv < 765
      attribution: KEPCO Transmission (EHV)
      priority: 3
    - name: 154 kV transmission
      condition: voltage_kv >= 154 AND voltage_kv < 345
      attribution: KEPCO Transmission (HV)
      priority: 4
    - name: HVDC Jeju links
      condition: name contains ['Jeju', '제주', 'Haenam', '해남'] AND voltage_class == HVDC
      attribution: KEPCO HVDC (Jeju interconnector)
      priority: 5
    - name: KDHC district-heating CHP
      condition: name contains ['열병합', 'CHP', 'district heating', '지역난방']
      attribution: KDHC
      priority: 6
    - name: Industrial captive detection
      condition: name matches ['포스코', 'POSCO', 'GS EPS', 'SK', '현대', '삼성', 'Hyundai', 'Samsung']
      attribution: <captive owner>
      priority: 7
    - name: Rail traction sub
      condition: name contains ['변전소', 'traction'] AND rail_context_flag
      attribution: KORAIL
      priority: 8
    - name: KEPCO default
      condition: fallback
      attribution: KEPCO Distribution
      priority: 9  # LAYER 4 CATCH-ALL

# ---------------------------------------------------------------
# Convention #78 §4bis.5 Layer 3 geofence assessment
# ---------------------------------------------------------------
layer_3_geofence:
  enforcement_needed: false  # SINGLE-DSO ARCHITECTURE (Ireland/Greek/Costa Rica precedent)
  rationale: |
    Korea has SINGLE dominant DSO (KEPCO) with 87% direct baseline attribution.
    No competing metropolitan DSOs (unlike Zurich EWZ or Geneva SIG in Switzerland).
    KHNP nuclear identity handled at Layer 1 (name-based). Industrial captives
    handled at Layer 1 (name-based). Rail traction handled at Layer 1
    (name-based rail context). No geographic carve-out required.

    Cumulative Convention #78 §4bis.5 enforcement stays at 4:
    Prague CZ + Warsaw PL + EWZ Zurich + SIG Geneva
    Korea DOES NOT increment this count.
  alternative_considered_metro_dso_carveout: false  # Seoul KEPCO subsidiary but same corporate group

# ---------------------------------------------------------------
# Discipline #36 cross-border filter
# ---------------------------------------------------------------
discipline_36:
  boundary_tolerance_km: 5.0  # Coastal offset for ~4,400 islands + Dokdo + Ulleungdo + Marado
  cross_border_interconnectors: 0  # KR-ISOLATED (DMZ + no submarine link to Japan/China)
  jeju_hvdc_status: DOMESTIC  # Jeju is Korean territory; HVDC is intra-national
  dmz_northern_boundary: 38.3  # approx; bounds.json handles precision
  expected_pre_filter_drift_pct: 0.5  # Very low — island coastline only
  cohort_precedent: iceland  # Sibling isolated grid; also 5.0 km tolerance

# ---------------------------------------------------------------
# Discipline #41 line parity target
# ---------------------------------------------------------------
discipline_41:
  target_ratio_range: [1.5, 5.0]  # Healthy band
  baseline_line_count: null  # to be captured from grid-geo.json at Step 4
  projection: |
    Korean transmission grid: ~30,000 km 154/345/765 kV
    KEPCO distribution grid: ~450,000 km MV/LV
    Baseline captures transmission primarily; OSM captures full MV/LV
    Expected line-substation ratio elevated (25-45×) — architecturally
    coherent with Irish precedent (46.27 ratio observed).

# ---------------------------------------------------------------
# Data sources (OSM Overpass + KEPCO public reports)
# ---------------------------------------------------------------
data_sources:
  primary:
    - name: OpenStreetMap
      endpoint_pool:
        - overpass-api.de
        - kumi.systems
        - private.coffee
      query_type: substations + power lines
      license: ODbL
      convention_60_compliant: true
  cross_reference:
    - name: KEPCO Annual Report 2024
      url: https://home.kepco.co.kr/kepco/EN/main.do
      purpose: substation count verification + voltage tier confirmation
    - name: KPX Power Statistics Information System
      url: https://epsis.kpx.or.kr/
      purpose: dispatch capacity by zone
    - name: KHNP Nuclear Plant Portal
      url: https://www.khnp.co.kr/eng/
      purpose: 6 nuclear-plant substation identification
    - name: Statistics Korea (KOSTAT)
      url: https://kostat.go.kr/
      purpose: 17 do/si first-tier admin boundary
      convention_60_compliant: true  # public statistics agency

# ---------------------------------------------------------------
# Convention #56 hazard baselines (Phase 4c prep)
# ---------------------------------------------------------------
convention_56_hazard_baselines:
  flood: 0.55        # Monsoon typhoon exposure (Yeongdeungpo 2011 + Sacheon 2020)
  wildfire: 0.20     # Gangwon peninsula (Gangneung 2019 + Uljin/Samcheok 2022)
  winter: 0.50       # Siberian monsoon cold snaps + heavy snow (Yeongdong region)
  adapt: 0.75        # K-Green New Deal 2020 + 2050 Net Zero pathway
  compound: 0.55     # Multi-hazard typhoon+flood+landslide clusters
  just: 0.25         # Post-industrial workforce transition (coal in Chungnam)
  sources:
    - JRC EU-Flood-Atlas (analog for typhoon flood exposure)
    - Copernicus (Sentinel-3 wildfire monitoring)
    - ECMWF ERA5 (winter cold snap climatology)
    - ND-GAIN adaptation index (Korea rank ~15/181, 2024)
    - IPCC AR6 East Asia chapter (typhoon frequency projection)
    - Just-Transition Fund analog: Korea Green New Deal 2020

# ---------------------------------------------------------------
# Empirical projection (Step 4 forecast)
# ---------------------------------------------------------------
step_4_projection:
  raw_fetch_estimate: 1500-1900
  post_filter_estimate: 1490-1890
  net_new_estimate: 200-600  # Baseline was already comprehensive
  net_new_pct_estimate: 15-45  # Moderate growth (KEPCO baseline coverage strong)
  convention_78_hits_estimate: 50-200  # LARGE Hangul+Latin dual-script
  line_growth_estimate: 3-25x
  step_4b_retroactive_attribution_estimate: 30-160  # 167 untagged → KEPCO default
  step_4b_class_diversity_estimate: 1-3  # LOW (KEPCO dominant)

