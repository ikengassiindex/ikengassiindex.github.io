# ---------------------------------------------------------------
# First cohort-wide adjacency graph rebuild from empty
# ---------------------------------------------------------------
adjacency_graph_rebuild_from_empty:
  finding_id: WAVE_4_FIRST_ADJACENCY_REBUILD_FROM_EMPTY_BASELINE
  observation: |
    Spain baseline had ZERO adjacency entries (a_dict_count: 0) despite
    22,765 lines + 3,423 subs. Prior baseline ingestion did NOT perform
    endpoint matching — line endpoints ss/se strings were empty.

    Wave 4 architecture rebuilds adjacency from scratch via:
      1. Grid-based spatial index (0.1° cells ~11 km)
      2. Line endpoint (start_lon, start_lat) + (end_lon, end_lat) matching
         against nearest sub within 500 m radius
      3. Populate adjacency[ss].add(se) + adjacency[se].add(ss)

    Result: 0 → 8,623 adjacency entries (28.5% of subs now have
    graph-topology neighbors). 42.0% endpoint match rate reflects
    Iberian wooden-pole rural MV pattern (many lines terminate at
    distribution transformers on customer premises, not substations).

  cohort_wide_significance: |
    Spain proves Wave 4 architecture can REBUILD adjacency graph from
    empty baseline — future countries with missing/corrupted adjacency
    inherit the same rebuild pattern automatically. This is the FIRST
    cohort-wide adjacency rebuild event (prior countries had populated
    baselines from earlier ingestion passes).

