  candidate: Madrid ES (P36 — 2-way Naturgy + Iberdrola i-DE)
  madrid_context: |
    Madrid metropolitan area (~6.7M population Comunidad de Madrid).
    Two-way DSO split: (a) Naturgy — dominant in Madrid inner + core
    metropolitan (via Unión Fenosa historical concession); (b) Iberdrola
