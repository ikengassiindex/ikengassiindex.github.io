# ---------------------------------------------------------------
# Discipline #36 cross-border tolerance
# ---------------------------------------------------------------
discipline_36_tolerance:
  boundary_tolerance_km: 5.0
  entry_added_to: cross_border_tolerances.json
  rationale_summary: |
    5.0 km tolerance — Iberian Mediterranean+Atlantic coastline complexity
    + Balearic archipelago + Canary Islands remote offshore + Ceuta+Melilla
    African exclaves + Pyrenees ridge complexity. Comparable to Italy 5.0 km
    (matches). Portugal is 6.0 km (higher due to Açores+Madeira mid-Atlantic
    extension); Spain has slightly less remote islands.
  expected_drops_estimate:
    subs: 100_250
    lines: 50_150

# ---------------------------------------------------------------
# Discipline #41 line-substation parity target
# ---------------------------------------------------------------
discipline_41_parity_target:
  baseline_pre_enhancement: 6.65  # ABOVE_HEALTHY_BAND sub-poor line-rich
  target_ratio_min: 1.5
  target_ratio_max: 5.0
  anticipated_signature_post_option_b_bi_directional: HEALTHY_BAND_via_MAJOR_SUB_GROWTH
  rationale: |
    Spain baseline 6.65 ABOVE_HEALTHY_BAND — sub-poor + line-rich pattern
    (opposite of Portugal baseline which was line-poor + sub-rich). Wave 4
    bi-directional Option B inheritance should MASSIVELY grow subs (from
    3,423 to 25k-40k+ via Portugal P33 subs pattern application), bringing
    parity DOWN to 1.5-3.0 HEALTHY_BAND. This is the mirror-image recovery
    pattern to Portugal's line-side recovery.

